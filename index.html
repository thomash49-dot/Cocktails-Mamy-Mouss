<!DOCTYPE html>

<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, viewport-fit=cover"

  >

  <meta name="theme-color" content="#111827">

  <title>Recettes Cocktails</title>

  <link rel="manifest" href="./manifest.json">

  <link rel="apple-touch-icon" href="./icon.PNG">

  <link rel="icon" type="image/png" href="./icon.PNG">

  <style>

    :root {

      --bg: #f3f4f6;

      --card: #ffffff;

      --text: #111827;

      --muted: #6b7280;

      --border: #e5e7eb;

      --dark: #111827;

      --dark2: #374151;

      --danger: #b91c1c;

      --danger-bg: #fee2e2;

      --ok: #15803d;

      --ok-bg: #dcfce7;

      --radius: 18px;

      --font-scale: 1;

    }

    * {

      box-sizing: border-box;

    }

    html {

      font-size: calc(16px * var(--font-scale));

      min-height: 100%;

      background: var(--bg);

    }

    body {

      margin: 0;

      min-height: 100vh;

      background: var(--bg);

      color: var(--text);

      font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        Roboto,

        Helvetica,

        Arial,

        sans-serif;

    }

    body.modal-open {

      overflow: hidden;

    }

    button,

    input,

    textarea,

    select {

      font: inherit;

    }

    button {

      cursor: pointer;

      touch-action: manipulation;

    }

    .app {

      width: min(1400px, 100%);

      min-height: 100vh;

      margin: 0 auto;

      padding: 16px;

      padding-bottom: 100px;

      background: var(--bg);

    }

    .topbar {

      background: var(--dark);

      color: white;

      border-radius: 22px;

      padding: 18px;

      margin-bottom: 16px;

      box-shadow: 0 12px 28px rgba(0,0,0,.12);

    }

    .topbar-row {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      flex-wrap: wrap;

    }

    .title-wrap h1 {

      margin: 0;

      font-size: 1.65rem;

    }

    .title-wrap p {

      margin: 5px 0 0;

      color: #d1d5db;

      font-size: .9rem;

    }

    .status {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      padding: 9px 12px;

      border-radius: 999px;

      font-weight: 700;

      font-size: .85rem;

      background: rgba(255,255,255,.1);

      border: 1px solid rgba(255,255,255,.15);

      color: white;

    }

    .status.unlocked {

      background: rgba(22,163,74,.25);

    }

    .toolbar {

      display: grid;

      grid-template-columns: minmax(220px, 1fr) auto auto;

      gap: 10px;

      margin-bottom: 12px;

    }

    .search,

    .select,

    .input,

    .textarea {

      width: 100%;

      border: 1px solid var(--border);

      background: white;

      color: var(--text);

      border-radius: 14px;

      padding: 13px 14px;

      outline: none;

    }

    .textarea {

      resize: vertical;

      min-height: 100px;

    }

    .btn {

      border: 1px solid var(--border);

      border-radius: 14px;

      padding: 12px 15px;

      font-weight: 700;

      background: white;

      color: var(--text);

    }

    .btn-dark {

      background: var(--dark);

      color: white;

      border-color: var(--dark);

    }

    .btn-danger {

      background: var(--danger-bg);

      color: var(--danger);

      border-color: #fecaca;

    }

    .controls {

      display: flex;

      align-items: center;

      gap: 10px;

      flex-wrap: wrap;

      margin-bottom: 12px;

    }

    .control-box {

      display: flex;

      align-items: center;

      gap: 8px;

      background: white;

      border: 1px solid var(--border);

      padding: 8px;

      border-radius: 14px;

    }

    .control-box select {

      border: 0;

      background: transparent;

      outline: none;

    }

    .font-display {

      min-width: 52px;

      text-align: center;

      font-weight: 700;

    }

    .categories {

      display: flex;

      gap: 8px;

      overflow-x: auto;

      padding: 2px 0 12px;

      scrollbar-width: none;

    }

    .categories::-webkit-scrollbar {

      display: none;

    }

    .chip {

      flex: 0 0 auto;

      border-radius: 999px;

      border: 1px solid var(--border);

      background: white;

      color: var(--text);

      padding: 9px 13px;

      font-weight: 700;

    }

    .chip.active {

      background: var(--dark);

      color: white;

      border-color: var(--dark);

    }

    .grid {

      display: grid;

      grid-template-columns: repeat(3, minmax(0,1fr));

      gap: 15px;

    }

    .card {

      background: var(--card);

      border: 1px solid var(--border);

      border-radius: var(--radius);

      overflow: hidden;

      box-shadow: 0 5px 18px rgba(0,0,0,.05);

    }

    .card-image {

      aspect-ratio: 16 / 10;

      width: 100%;

      object-fit: cover;

      display: block;

      background: #e5e7eb;

    }

    .card-no-image {

      aspect-ratio: 16 / 10;

      display: grid;

      place-items: center;

      background: linear-gradient(135deg,#111827,#374151);

      color: white;

      font-size: 3rem;

    }

    .card-body {

      padding: 15px;

    }

    .card-top {

      display: flex;

      gap: 10px;

      align-items: flex-start;

      justify-content: space-between;

    }

    .card h3 {

      margin: 0 0 6px;

      font-size: 1.15rem;

    }

    .number {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-width: 40px;

      padding: 5px 8px;

      border-radius: 999px;

      background: #f3f4f6;

      font-weight: 800;

      font-size: .85rem;

    }

    .category-label {

      color: var(--muted);

      font-size: .85rem;

      font-weight: 700;

      margin-bottom: 10px;

    }

    .card-content {

      white-space: pre-wrap;

      line-height: 1.45;

      color: #374151;

      font-size: .92rem;

    }

    .card-actions {

      display: flex;

      gap: 8px;

      margin-top: 14px;

      flex-wrap: wrap;

    }

    .empty {

      grid-column: 1 / -1;

      background: white;

      border: 1px dashed #cbd5e1;

      border-radius: var(--radius);

      text-align: center;

      padding: 50px 18px;

      color: var(--muted);

    }

    .fab {

      position: fixed;

      right: 18px;

      bottom: 18px;

      width: 62px;

      height: 62px;

      border: 0;

      border-radius: 50%;

      background: var(--dark);

      color: white;

      font-size: 2rem;

      box-shadow: 0 10px 30px rgba(0,0,0,.25);

      z-index: 40;

    }

    .management-only {

      display: none !important;

    }

    body.management .management-only {

      display: inline-flex !important;

    }

    /* =========================

       MODALES

       Compatible vieux iPad

       ========================= */

    .modal {

      display: none;

      position: fixed;

      top: 0;

      left: 0;

      right: 0;

      bottom: 0;

      width: 100%;

      height: 100%;

      z-index: 1000;

      background: rgba(17,24,39,.62);

      overflow: auto;

      -webkit-overflow-scrolling: touch;

      padding: 20px 12px;

    }

    .modal.show {

      display: flex;

      align-items: center;

      justify-content: center;

    }

    .modal-card {

      width: min(720px, 100%);

      max-height: calc(100vh - 40px);

      margin: auto;

      background: white;

      border-radius: 22px;

      box-shadow: 0 24px 80px rgba(0,0,0,.30);

      overflow: hidden;

    }

    .modal-inner {

      max-height: calc(100vh - 40px);

      overflow-y: auto;

      -webkit-overflow-scrolling: touch;

      padding: 20px;

    }

    .modal-head {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

      margin-bottom: 18px;

      background: white;

    }

    .modal-head h2 {

      margin: 0;

    }

    .close {

      width: 42px;

      height: 42px;

      padding: 0;

      border-radius: 50%;

      border: 1px solid var(--border);

      background: white;

      font-size: 1.2rem;

      flex: 0 0 auto;

    }

    .form-grid {

      display: grid;

      grid-template-columns: 130px 1fr;

      gap: 12px;

    }

    .field {

      margin-bottom: 13px;

    }

    .field label {

      display: block;

      font-weight: 700;

      margin-bottom: 6px;

    }

    .image-preview {

      width: 100%;

      max-height: 300px;

      border-radius: 15px;

      object-fit: contain;

      background: #f3f4f6;

      margin-top: 10px;

    }

    .modal-actions {

      display: flex;

      justify-content: flex-end;

      flex-wrap: wrap;

      gap: 9px;

      margin-top: 18px;

    }

    .pin-wrap {

      max-width: 380px;

      margin: 0 auto;

      text-align: center;

    }

    .pin-input {

      width: 100%;

      text-align: center;

      font-size: 2rem;

      letter-spacing: .6rem;

      padding: 15px;

      border-radius: 16px;

      border: 2px solid var(--border);

    }

    .pin-message {

      margin-top: 12px;

      font-weight: 700;

      min-height: 24px;

    }

    .category-row {

      display: flex;

      align-items: center;

      gap: 8px;

      margin-bottom: 8px;

    }

    .category-row .input {

      flex: 1;

    }

    .separator {

      border: 0;

      border-top: 1px solid var(--border);

      margin: 18px 0;

    }

    @media (max-width: 1000px) {

      .grid {

        grid-template-columns: repeat(2, minmax(0,1fr));

      }

    }

    @media (max-width: 700px) {

      .app {

        padding: 10px;

        padding-bottom: 90px;

      }

      .topbar {

        border-radius: 16px;

      }

      .toolbar {

        grid-template-columns: 1fr 1fr;

      }

      .toolbar .search {

        grid-column: 1 / -1;

      }

      .grid {

        grid-template-columns: 1fr;

      }

      .form-grid {

        grid-template-columns: 1fr;

      }

      .controls {

        align-items: stretch;

      }

      .control-box {

        flex: 1 1 100%;

        justify-content: space-between;

      }

      .btn {

        min-height: 44px;

      }

      .modal {

        padding: 10px 8px;

      }

      .modal-card {

        width: 100%;

        max-height: calc(100vh - 20px);

        border-radius: 18px;

      }

      .modal-inner {

        max-height: calc(100vh - 20px);

        padding: 16px;

      }

    }

    /* Ancien Safari iPad */

    @supports (-webkit-touch-callout: none) {

      .modal {

        height: 100%;

      }

      .modal-card {

        max-height: 90vh;

      }

      .modal-inner {

        max-height: 90vh;

      }

    }

  </style>

</head>

<body>

<div class="app">

  <header class="topbar">

    <div class="topbar-row">

      <div class="title-wrap">

        <h1>🍸 Recettes Cocktails</h1>

        <p>Recettes du bar • Mamy Mouss</p>

      </div>

      <button

        id="managementStatus"

        class="status"

        type="button"

        onclick="toggleManagement()"

      >

        🔒 Mode consultation

      </button>

    </div>

  </header>

  <section class="toolbar">

    <input

      id="searchInput"

      class="search"

      type="search"

      placeholder="🔎 Rechercher un cocktail..."

      oninput="renderCocktails()"

    >

    <button

      class="btn management-only"

      onclick="openCategories()"

    >

      ⚙️ Catégories

    </button>

    <button

      class="btn btn-dark management-only"

      onclick="openCocktailForm()"

    >

      + Cocktail

    </button>

  </section>

  <section class="controls">

    <div class="control-box">

      <strong>Trier par</strong>

      <select

        id="sortSelect"

        onchange="changeSort()"

      >

        <option value="number">🔢 Numéro</option>

        <option value="name">🔤 Nom A → Z</option>

        <option value="category">📂 Catégorie</option>

      </select>

    </div>

    <div class="control-box">

      <strong>Taille</strong>

      <button

        class="btn"

        onclick="changeFont(-0.05)"

      >

        A−

      </button>

      <span

        id="fontDisplay"

        class="font-display"

      >

        100%

      </span>

      <button

        class="btn"

        onclick="changeFont(0.05)"

      >

        A+

      </button>

    </div>

    <button

      class="btn management-only"

      onclick="openPinSettings()"

    >

      🔐 Changer le code

    </button>

    <button

      class="btn management-only"

      onclick="lockManagement()"

    >

      🔒 Verrouiller

    </button>

  </section>

  <div

    id="categoryFilters"

    class="categories"

  ></div>

  <main

    id="cocktailGrid"

    class="grid"

  ></main>

</div>

<button

  class="fab management-only"

  onclick="openCocktailForm()"

>

  +

</button>

<!-- =========================

     CODE GESTION

     ========================= -->

<div id="pinModal" class="modal">

  <div class="modal-card">

    <div class="modal-inner">

      <div class="modal-head">

        <h2>🔐 Code de gestion</h2>

        <button

          class="close"

          onclick="closeModal('pinModal')"

        >

          ✕

        </button>

      </div>

      <div class="pin-wrap">

        <p>

          Entre le code à 4 chiffres pour pouvoir ajouter,

          modifier ou supprimer des recettes.

        </p>

        <input

          id="pinInput"

          class="pin-input"

          type="password"

          inputmode="numeric"

          pattern="[0-9]*"

          maxlength="4"

          autocomplete="off"

        >

        <div

          id="pinMessage"

          class="pin-message"

        ></div>

        <button

          class="btn btn-dark"

          style="width:100%;margin-top:12px;"

          onclick="checkPin()"

        >

          Déverrouiller

        </button>

      </div>

    </div>

  </div>

</div>

<!-- =========================

     CHANGER CODE

     ========================= -->

<div id="pinSettingsModal" class="modal">

  <div class="modal-card">

    <div class="modal-inner">

      <div class="modal-head">

        <h2>🔐 Changer le code</h2>

        <button

          class="close"

          onclick="closeModal('pinSettingsModal')"

        >

          ✕

        </button>

      </div>

      <div class="field">

        <label>Code actuel</label>

        <input

          id="oldPin"

          class="input"

          type="password"

          inputmode="numeric"

          pattern="[0-9]*"

          maxlength="4"

        >

      </div>

      <div class="field">

        <label>Nouveau code à 4 chiffres</label>

        <input

          id="newPin"

          class="input"

          type="password"

          inputmode="numeric"

          pattern="[0-9]*"

          maxlength="4"

        >

      </div>

      <div class="field">

        <label>Confirmer le nouveau code</label>

        <input

          id="confirmPin"

          class="input"

          type="password"

          inputmode="numeric"

          pattern="[0-9]*"

          maxlength="4"

        >

      </div>

      <div

        id="pinSettingsMessage"

        class="pin-message"

      ></div>

      <div class="modal-actions">

        <button

          class="btn"

          onclick="closeModal('pinSettingsModal')"

        >

          Annuler

        </button>

        <button

          class="btn btn-dark"

          onclick="saveNewPin()"

        >

          Enregistrer

        </button>

      </div>

    </div>

  </div>

</div>

<!-- =========================

     COCKTAIL

     ========================= -->

<div id="cocktailModal" class="modal">

  <div class="modal-card">

    <div class="modal-inner">

      <div class="modal-head">

        <h2 id="cocktailModalTitle">

          Ajouter un cocktail

        </h2>

        <button

          class="close"

          onclick="closeModal('cocktailModal')"

        >

          ✕

        </button>

      </div>

      <input

        id="cocktailId"

        type="hidden"

      >

      <div class="form-grid">

        <div class="field">

          <label for="cocktailNumber">

            Numéro

          </label>

          <input

            id="cocktailNumber"

            class="input"

            type="number"

            min="1"

            inputmode="numeric"

            placeholder="Ex. 12"

          >

        </div>

        <div class="field">

          <label for="cocktailCategory">

            Catégorie

          </label>

          <select

            id="cocktailCategory"

            class="select"

          ></select>

        </div>

      </div>

      <div class="field">

        <label for="cocktailName">

          Nom du cocktail *

        </label>

        <input

          id="cocktailName"

          class="input"

          type="text"

          placeholder="Ex. Mojito"

        >

      </div>

      <div class="field">

        <label for="cocktailIngredients">

          Ingrédients

        </label>

        <textarea

          id="cocktailIngredients"

          class="textarea"

          placeholder="Indique ici les ingrédients..."

        ></textarea>

      </div>

      <div class="field">

        <label for="cocktailPreparation">

          Préparation

        </label>

        <textarea

          id="cocktailPreparation"

          class="textarea"

          placeholder="Indique ici la préparation..."

        ></textarea>

      </div>

      <div class="field">

        <label for="cocktailGlass">

          Verrerie / décoration

        </label>

        <textarea

          id="cocktailGlass"

          class="textarea"

          placeholder="Verre, décoration, finition..."

        ></textarea>

      </div>

      <div class="field">

        <label for="cocktailPhoto">

          Photo

        </label>

        <input

          id="cocktailPhoto"

          class="input"

          type="file"

          accept="image/*"

          onchange="handlePhoto(event)"

        >

        <img

          id="photoPreview"

          class="image-preview"

          style="display:none;"

          alt="Aperçu"

        >

      </div>

      <div class="modal-actions">

        <button

          id="deleteCocktailButton"

          class="btn btn-danger"

          style="display:none;"

          onclick="deleteCurrentCocktail()"

        >

          🗑️ Supprimer

        </button>

        <button

          class="btn"

          onclick="closeModal('cocktailModal')"

        >

          Annuler

        </button>

        <button

          class="btn btn-dark"

          onclick="saveCocktail()"

        >

          💾 Enregistrer

        </button>

      </div>

    </div>

  </div>

</div>

<!-- =========================

     CATÉGORIES

     ========================= -->

<div id="categoriesModal" class="modal">

  <div class="modal-card">

    <div class="modal-inner">

      <div class="modal-head">

        <h2>

          📂 Gérer les catégories

        </h2>

        <button

          class="close"

          onclick="closeModal('categoriesModal')"

        >

          ✕

        </button>

      </div>

      <div class="field">

        <label for="newCategory">

          Nouvelle catégorie

        </label>

        <div style="display:flex;gap:8px;">

          <input

            id="newCategory"

            class="input"

            type="text"

            placeholder="Ex. Cocktails chauds"

          >

          <button

            class="btn btn-dark"

            onclick="addCategory()"

          >

            Ajouter

          </button>

        </div>

      </div>

      <hr class="separator">

      <div id="categoryManager"></div>

    </div>

  </div>

</div>

<script>

  const STORAGE_RECIPES =

    "cocktail_recipes_v5";

  const STORAGE_CATEGORIES =

    "cocktail_categories_v5";

  const STORAGE_FONT =

    "cocktail_font_scale_v5";

  const STORAGE_SORT =

    "cocktail_sort_v5";

  const STORAGE_PIN =

    "cocktail_manager_pin_v1";

  const DEFAULT_PIN =

    "1234";

  const defaultCategories = [

    "Classiques",

    "Signatures",

    "Fruités",

    "Tiki",

    "Shots",

    "Sans alcool",

    "Autre"

  ];

  let cocktails =

    loadJSON(

      STORAGE_RECIPES,

      []

    );

  let categories =

    loadJSON(

      STORAGE_CATEGORIES,

      defaultCategories

    );

  let fontScale =

    Number(

      localStorage.getItem(

        STORAGE_FONT

      )

    ) || 1;

  let sortMode =

    localStorage.getItem(

      STORAGE_SORT

    ) || "number";

  let currentCategory =

    "Tous";

  let managementUnlocked =

    false;

  let currentPhoto =

    "";

  function loadJSON(

    key,

    fallback

  ) {

    try {

      const saved =

        localStorage.getItem(key);

      return saved

        ? JSON.parse(saved)

        : JSON.parse(

            JSON.stringify(fallback)

          );

    } catch {

      return JSON.parse(

        JSON.stringify(fallback)

      );

    }

  }

  function saveAll() {

    localStorage.setItem(

      STORAGE_RECIPES,

      JSON.stringify(cocktails)

    );

    localStorage.setItem(

      STORAGE_CATEGORIES,

      JSON.stringify(categories)

    );

  }

  function getPin() {

    return (

      localStorage.getItem(

        STORAGE_PIN

      )

      || DEFAULT_PIN

    );

  }

  function escapeHTML(value) {

    return String(value ?? "")

      .replaceAll("&", "&amp;")

      .replaceAll("<", "&lt;")

      .replaceAll(">", "&gt;")

      .replaceAll('"', "&quot;")

      .replaceAll("'", "&#039;");

  }

  /* =========================

     MODALES

     ========================= */

  function openModal(id) {

    const modal =

      document.getElementById(id);

    if (!modal) return;

    modal.classList.add("show");

    document.body.classList.add(

      "modal-open"

    );

    const inner =

      modal.querySelector(

        ".modal-inner"

      );

    if (inner) {

      inner.scrollTop = 0;

    }

  }

  function closeModal(id) {

    const modal =

      document.getElementById(id);

    if (!modal) return;

    modal.classList.remove(

      "show"

    );

    const anyOpen =

      document.querySelector(

        ".modal.show"

      );

    if (!anyOpen) {

      document.body.classList.remove(

        "modal-open"

      );

    }

  }

  function closeAllModals() {

    document

      .querySelectorAll(

        ".modal"

      )

      .forEach(modal => {

        modal.classList.remove(

          "show"

        );

      });

    document.body.classList.remove(

      "modal-open"

    );

  }

  /* =========================

     MODE GESTION

     ========================= */

  function toggleManagement() {

    if (managementUnlocked) {

      lockManagement();

      return;

    }

    document.getElementById(

      "pinInput"

    ).value = "";

    document.getElementById(

      "pinMessage"

    ).textContent = "";

    openModal(

      "pinModal"

    );

    /*

      IMPORTANT :

      Pas de focus automatique ici.

      C'est ce qui faisait bouger la

      fenêtre sur l'ancien iPad.

    */

  }

  function checkPin() {

    const entered =

      document

        .getElementById(

          "pinInput"

        )

        .value

        .replace(/\D/g, "");

    if (

      entered === getPin()

    ) {

      managementUnlocked =

        true;

      document.body.classList.add(

        "management"

      );

      const status =

        document.getElementById(

          "managementStatus"

        );

      status.classList.add(

        "unlocked"

      );

      status.textContent =

        "🔓 Mode gestion";

      closeModal(

        "pinModal"

      );

      renderCocktails();

    } else {

      document.getElementById(

        "pinMessage"

      ).textContent =

        "❌ Code incorrect.";

      document.getElementById(

        "pinInput"

      ).value = "";

    }

  }

  function lockManagement() {

    managementUnlocked =

      false;

    document.body.classList.remove(

      "management"

    );

    const status =

      document.getElementById(

        "managementStatus"

      );

    status.classList.remove(

      "unlocked"

    );

    status.textContent =

      "🔒 Mode consultation";

    closeAllModals();

    renderCocktails();

  }

  function requireManagement() {

    if (!managementUnlocked) {

      toggleManagement();

      return false;

    }

    return true;

  }

  /* =========================

     CHANGER CODE

     ========================= */

  function openPinSettings() {

    if (!requireManagement()) {

      return;

    }

    document.getElementById(

      "oldPin"

    ).value = "";

    document.getElementById(

      "newPin"

    ).value = "";

    document.getElementById(

      "confirmPin"

    ).value = "";

    document.getElementById(

      "pinSettingsMessage"

    ).textContent = "";

    openModal(

      "pinSettingsModal"

    );

  }

  function saveNewPin() {

    const oldPin =

      document

        .getElementById(

          "oldPin"

        )

        .value

        .replace(/\D/g, "");

    const newPin =

      document

        .getElementById(

          "newPin"

        )

        .value

        .replace(/\D/g, "");

    const confirmPin =

      document

        .getElementById(

          "confirmPin"

        )

        .value

        .replace(/\D/g, "");

    const message =

      document.getElementById(

        "pinSettingsMessage"

      );

    if (

      oldPin !== getPin()

    ) {

      message.textContent =

        "❌ L'ancien code est incorrect.";

      return;

    }

    if (

      !/^\d{4}$/.test(newPin)

    ) {

      message.textContent =

        "❌ Le nouveau code doit contenir exactement 4 chiffres.";

      return;

    }

    if (

      newPin !== confirmPin

    ) {

      message.textContent =

        "❌ Les deux codes ne correspondent pas.";

      return;

    }

    localStorage.setItem(

      STORAGE_PIN,

      newPin

    );

    message.textContent =

      "✅ Nouveau code enregistré.";

    setTimeout(() => {

      closeModal(

        "pinSettingsModal"

      );

    }, 700);

  }

  /* =========================

     TAILLE

     ========================= */

  function applyFont() {

    fontScale =

      Math.min(

        1.5,

        Math.max(

          .8,

          fontScale

        )

      );

    document.documentElement

      .style

      .setProperty(

        "--font-scale",

        fontScale

      );

    document.getElementById(

      "fontDisplay"

    ).textContent =

      Math.round(

        fontScale * 100

      ) + "%";

    localStorage.setItem(

      STORAGE_FONT,

      String(fontScale)

    );

  }

  function changeFont(amount) {

    fontScale += amount;

    applyFont();

  }

  /* =========================

     TRI

     ========================= */

  function changeSort() {

    sortMode =

      document.getElementById(

        "sortSelect"

      ).value;

    localStorage.setItem(

      STORAGE_SORT,

      sortMode

    );

    renderCocktails();

  }

  function sortCocktails(list) {

    const sorted =

      [...list];

    if (

      sortMode === "number"

    ) {

      sorted.sort((a,b) => {

        const numberA =

          Number(a.number)

          || 999999;

        const numberB =

          Number(b.number)

          || 999999;

        if (

          numberA !== numberB

        ) {

          return numberA - numberB;

        }

        return String(

          a.name

        ).localeCompare(

          String(b.name),

          "fr",

          {

            sensitivity:"base"

          }

        );

      });

    }

    if (

      sortMode === "name"

    ) {

      sorted.sort((a,b) =>

        String(

          a.name

        ).localeCompare(

          String(b.name),

          "fr",

          {

            sensitivity:"base"

          }

        )

      );

    }

    if (

      sortMode === "category"

    ) {

      sorted.sort((a,b) => {

        const cat =

          String(

            a.category || ""

          ).localeCompare(

            String(

              b.category || ""

            ),

            "fr",

            {

              sensitivity:"base"

            }

          );

        if (

          cat !== 0

        ) {

          return cat;

        }

        const numberA =

          Number(a.number)

          || 999999;

        const numberB =

          Number(b.number)

          || 999999;

        if (

          numberA !== numberB

        ) {

          return numberA - numberB;

        }

        return String(

          a.name

        ).localeCompare(

          String(b.name),

          "fr",

          {

            sensitivity:"base"

          }

        );

      });

    }

    return sorted;

  }

  /* =========================

     CATÉGORIES

     ========================= */

  function renderCategoryFilters() {

    const container =

      document.getElementById(

        "categoryFilters"

      );

    container.innerHTML =

      "";

    [

      "Tous",

      ...categories

    ].forEach(category => {

      const button =

        document.createElement(

          "button"

        );

      button.className =

        "chip"

        +

        (

          currentCategory === category

            ? " active"

            : ""

        );

      button.textContent =

        category;

      button.onclick =

        () => {

          currentCategory =

            category;

          renderCategoryFilters();

          renderCocktails();

        };

      container.appendChild(

        button

      );

    });

  }

  function fillCategorySelect() {

    const select =

      document.getElementById(

        "cocktailCategory"

      );

    const previous =

      select.value;

    select.innerHTML =

      "";

    categories.forEach(

      category => {

        const option =

          document.createElement(

            "option"

          );

        option.value =

          category;

        option.textContent =

          category;

        select.appendChild(

          option

        );

      }

    );

    if (

      categories.includes(

        previous

      )

    ) {

      select.value =

        previous;

    }

  }

  function openCategories() {

    if (!requireManagement()) {

      return;

    }

    renderCategoryManager();

    openModal(

      "categoriesModal"

    );

  }

  function renderCategoryManager() {

    const manager =

      document.getElementById(

        "categoryManager"

      );

    manager.innerHTML =

      "";

    categories.forEach(

      (category,index) => {

        const row =

          document.createElement(

            "div"

          );

        row.className =

          "category-row";

        row.innerHTML = `

          <input

            class="input"

            value="${escapeHTML(category)}"

            onchange="renameCategory(${index}, this.value)"

          >

          <button

            class="btn btn-danger"

            onclick="deleteCategory(${index})"

          >

            🗑️

          </button>

        `;

        manager.appendChild(

          row

        );

      }

    );

  }

  function addCategory() {

    if (!requireManagement()) {

      return;

    }

    const input =

      document.getElementById(

        "newCategory"

      );

    const name =

      input.value.trim();

    if (!name) return;

    const exists =

      categories.some(

        category =>

          category.toLowerCase()

          ===

          name.toLowerCase()

      );

    if (exists) {

      alert(

        "Cette catégorie existe déjà."

      );

      return;

    }

    categories.push(

      name

    );

    categories.sort(

      (a,b) =>

        a.localeCompare(

          b,

          "fr",

          {

            sensitivity:"base"

          }

        )

    );

    input.value =

      "";

    saveAll();

    fillCategorySelect();

    renderCategoryFilters();

    renderCategoryManager();

  }

  function renameCategory(

    index,

    newName

  ) {

    if (!requireManagement()) {

      return;

    }

    newName =

      newName.trim();

    if (!newName) {

      renderCategoryManager();

      return;

    }

    const oldName =

      categories[index];

    cocktails.forEach(

      cocktail => {

        if (

          cocktail.category

          === oldName

        ) {

          cocktail.category =

            newName;

        }

      }

    );

    categories[index] =

      newName;

    saveAll();

    fillCategorySelect();

    renderCategoryFilters();

    renderCocktails();

  }

  function deleteCategory(index) {

    if (!requireManagement()) {

      return;

    }

    const category =

      categories[index];

    const used =

      cocktails.some(

        cocktail =>

          cocktail.category

          === category

      );

    if (used) {

      const confirmation =

        confirm(

          `"${category}" est utilisée par une ou plusieurs recettes.\n\nLes recettes seront déplacées vers "Autre". Continuer ?`

        );

      if (!confirmation) {

        return;

      }

      if (

        !categories.includes(

          "Autre"

        )

      ) {

        categories.push(

          "Autre"

        );

      }

      cocktails.forEach(

        cocktail => {

          if (

            cocktail.category

            === category

          ) {

            cocktail.category =

              "Autre";

          }

        }

      );

    }

    categories.splice(

      index,

      1

    );

    if (

      currentCategory

      === category

    ) {

      currentCategory =

        "Tous";

    }

    saveAll();

    fillCategorySelect();

    renderCategoryFilters();

    renderCategoryManager();

    renderCocktails();

  }

  /* =========================

     PHOTOS

     ========================= */

  async function handlePhoto(

    event

  ) {

    const file =

      event.target.files?.[0];

    if (!file) return;

    currentPhoto =

      await resizeImage(

        file,

        1200,

        .78

      );

    const preview =

      document.getElementById(

        "photoPreview"

      );

    preview.src =

      currentPhoto;

    preview.style.display =

      "block";

  }

  function resizeImage(

    file,

    maxSize,

    quality

  ) {

    return new Promise(

      (resolve,reject) => {

        const reader =

          new FileReader();

        reader.onload =

          () => {

            const img =

              new Image();

            img.onload =

              () => {

                let width =

                  img.width;

                let height =

                  img.height;

                if (

                  width > maxSize

                  ||

                  height > maxSize

                ) {

                  const ratio =

                    Math.min(

                      maxSize / width,

                      maxSize / height

                    );

                  width =

                    Math.round(

                      width * ratio

                    );

                  height =

                    Math.round(

                      height * ratio

                    );

                }

                const canvas =

                  document.createElement(

                    "canvas"

                  );

                canvas.width =

                  width;

                canvas.height =

                  height;

                const ctx =

                  canvas.getContext(

                    "2d"

                  );

                ctx.drawImage(

                  img,

                  0,

                  0,

                  width,

                  height

                );

                resolve(

                  canvas.toDataURL(

                    "image/jpeg",

                    quality

                  )

                );

              };

            img.onerror =

              reject;

            img.src =

              reader.result;

          };

        reader.onerror =

          reject;

        reader.readAsDataURL(

          file

        );

      }

    );

  }

  /* =========================

     FORMULAIRE COCKTAIL

     ========================= */

  function resetCocktailForm() {

    document.getElementById(

      "cocktailId"

    ).value = "";

    document.getElementById(

      "cocktailNumber"

    ).value = "";

    document.getElementById(

      "cocktailName"

    ).value = "";

    document.getElementById(

      "cocktailIngredients"

    ).value = "";

    document.getElementById(

      "cocktailPreparation"

    ).value = "";

    document.getElementById(

      "cocktailGlass"

    ).value = "";

    document.getElementById(

      "cocktailPhoto"

    ).value = "";

    currentPhoto =

      "";

    const preview =

      document.getElementById(

        "photoPreview"

      );

    preview.src =

      "";

    preview.style.display =

      "none";

    document.getElementById(

      "deleteCocktailButton"

    ).style.display =

      "none";

    document.getElementById(

      "cocktailModalTitle"

    ).textContent =

      "Ajouter un cocktail";

    fillCategorySelect();

    if (

      categories.length

    ) {

      document.getElementById(

        "cocktailCategory"

      ).value =

        categories[0];

    }

  }

  function openCocktailForm(

    id = null

  ) {

    if (!requireManagement()) {

      return;

    }

    resetCocktailForm();

    if (id) {

      const cocktail =

        cocktails.find(

          c => c.id === id

        );

      if (!cocktail) {

        return;

      }

      document.getElementById(

        "cocktailModalTitle"

      ).textContent =

        "Modifier le cocktail";

      document.getElementById(

        "cocktailId"

      ).value =

        cocktail.id;

      document.getElementById(

        "cocktailNumber"

      ).value =

        cocktail.number || "";

      document.getElementById(

        "cocktailName"

      ).value =

        cocktail.name || "";

      document.getElementById(

        "cocktailCategory"

      ).value =

        cocktail.category || "";

      document.getElementById(

        "cocktailIngredients"

      ).value =

        cocktail.ingredients || "";

      document.getElementById(

        "cocktailPreparation"

      ).value =

        cocktail.preparation || "";

      document.getElementById(

        "cocktailGlass"

      ).value =

        cocktail.glass || "";

      currentPhoto =

        cocktail.photo || "";

      if (currentPhoto) {

        const preview =

          document.getElementById(

            "photoPreview"

          );

        preview.src =

          currentPhoto;

        preview.style.display =

          "block";

      }

      document.getElementById(

        "deleteCocktailButton"

      ).style.display =

        "inline-flex";

    }

    openModal(

      "cocktailModal"

    );

  }

  function saveCocktail() {

    if (!requireManagement()) {

      return;

    }

    const id =

      document.getElementById(

        "cocktailId"

      ).value;

    const number =

      document.getElementById(

        "cocktailNumber"

      ).value.trim();

    const name =

      document.getElementById(

        "cocktailName"

      ).value.trim();

    const category =

      document.getElementById(

        "cocktailCategory"

      ).value;

    const ingredients =

      document.getElementById(

        "cocktailIngredients"

      ).value.trim();

    const preparation =

      document.getElementById(

        "cocktailPreparation"

      ).value.trim();

    const glass =

      document.getElementById(

        "cocktailGlass"

      ).value.trim();

    if (!name) {

      alert(

        "Indique le nom du cocktail."

      );

      return;

    }

    if (number) {

      const duplicate =

        cocktails.find(

          cocktail =>

            String(

              cocktail.number

            )

            ===

            String(number)

            &&

            cocktail.id !== id

        );

      if (duplicate) {

        const confirmation =

          confirm(

            `Le numéro ${number} est déjà utilisé par "${duplicate.name}".\n\nTu veux quand même l'utiliser ?`

          );

        if (!confirmation) {

          return;

        }

      }

    }

    const recipe = {

      id:

        id

        ||

        (

          crypto.randomUUID

            ? crypto.randomUUID()

            : Date.now().toString()

        ),

      number,

      name,

      category,

      ingredients,

      preparation,

      glass,

      photo: currentPhoto,

      updatedAt:

        new Date().toISOString()

    };

    if (id) {

      const index =

        cocktails.findIndex(

          c => c.id === id

        );

      if (

        index !== -1

      ) {

        cocktails[index] =

          recipe;

      }

    } else {

      cocktails.push(

        recipe

      );

    }

    saveAll();

    closeModal(

      "cocktailModal"

    );

    renderCocktails();

  }

  function deleteCurrentCocktail() {

    if (!requireManagement()) {

      return;

    }

    const id =

      document.getElementById(

        "cocktailId"

      ).value;

    if (!id) return;

    const cocktail =

      cocktails.find(

        c => c.id === id

      );

    const confirmation =

      confirm(

        `Supprimer définitivement "${cocktail?.name || "ce cocktail"}" ?`

      );

    if (!confirmation) {

      return;

    }

    cocktails =

      cocktails.filter(

        c => c.id !== id

      );

    saveAll();

    closeModal(

      "cocktailModal"

    );

    renderCocktails();

  }

  /* =========================

     AFFICHAGE

     ========================= */

  function renderCocktails() {

    const grid =

      document.getElementById(

        "cocktailGrid"

      );

    const search =

      document.getElementById(

        "searchInput"

      )

      .value

      .trim()

      .toLowerCase();

    let filtered =

      cocktails.filter(

        cocktail => {

          const categoryOK =

            currentCategory === "Tous"

            ||

            cocktail.category

            === currentCategory;

          const searchText = [

            cocktail.number,

            cocktail.name,

            cocktail.category,

            cocktail.ingredients,

            cocktail.preparation,

            cocktail.glass

          ]

          .join(" ")

          .toLowerCase();

          const searchOK =

            !search

            ||

            searchText.includes(

              search

            );

          return (

            categoryOK

            &&

            searchOK

          );

        }

      );

    filtered =

      sortCocktails(

        filtered

      );

    grid.innerHTML =

      "";

    if (!filtered.length) {

      grid.innerHTML = `

        <div class="empty">

          <div style="font-size:3rem;margin-bottom:10px;">

            🍸

          </div>

          <strong>

            Aucun cocktail trouvé

          </strong>

          <p>

            ${

              managementUnlocked

                ? "Appuie sur « + Cocktail » pour ajouter une recette."

                : "Les recettes disponibles apparaîtront ici."

            }

          </p>

        </div>

      `;

      return;

    }

    filtered.forEach(

      cocktail => {

        const card =

          document.createElement(

            "article"

          );

        card.className =

          "card";

        const imageHTML =

          cocktail.photo

            ? `

              <img

                class="card-image"

                src="${cocktail.photo}"

                alt="${escapeHTML(cocktail.name)}"

              >

            `

            : `

              <div class="card-no-image">

                🍹

              </div>

            `;

        const managementButtons =

          managementUnlocked

            ? `

              <div class="card-actions">

                <button

                  class="btn"

                  onclick="openCocktailForm('${cocktail.id}')"

                >

                  ✏️ Modifier

                </button>

              </div>

            `

            : "";

        card.innerHTML = `

          ${imageHTML}

          <div class="card-body">

            <div class="card-top">

              <div>

                <h3>

                  ${escapeHTML(cocktail.name)}

                </h3>

                <div class="category-label">

                  ${escapeHTML(

                    cocktail.category

                    ||

                    "Sans catégorie"

                  )}

                </div>

              </div>

              ${

                cocktail.number

                  ? `

                    <span class="number">

                      #${escapeHTML(cocktail.number)}

                    </span>

                  `

                  : ""

              }

            </div>

            ${

              cocktail.ingredients

                ? `

                  <div class="card-content">

                    <strong>Ingrédients</strong>

                    <br>

                    ${escapeHTML(

                      cocktail.ingredients

                    )}

                  </div>

                `

                : ""

            }

            ${

              cocktail.preparation

                ? `

                  <div

                    class="card-content"

                    style="margin-top:10px;"

                  >

                    <strong>Préparation</strong>

                    <br>

                    ${escapeHTML(

                      cocktail.preparation

                    )}

                  </div>

                `

                : ""

            }

            ${

              cocktail.glass

                ? `

                  <div

                    class="card-content"

                    style="margin-top:10px;"

                  >

                    <strong>

                      Verrerie / décoration

                    </strong>

                    <br>

                    ${escapeHTML(

                      cocktail.glass

                    )}

                  </div>

                `

                : ""

            }

            ${managementButtons}

          </div>

        `;

        grid.appendChild(

          card

        );

      }

    );

  }

  /* =========================

     ÉVÉNEMENTS

     ========================= */

  document

    .getElementById(

      "pinInput"

    )

    .addEventListener(

      "keydown",

      event => {

        if (

          event.key === "Enter"

        ) {

          checkPin();

        }

      }

    );

  document

    .querySelectorAll(

      ".modal"

    )

    .forEach(

      modal => {

        modal.addEventListener(

          "click",

          event => {

            if (

              event.target

              === modal

            ) {

              closeModal(

                modal.id

              );

            }

          }

        );

      }

    );

  document.addEventListener(

    "keydown",

    event => {

      if (

        event.key === "Escape"

      ) {

        const opened =

          document.querySelector(

            ".modal.show"

          );

        if (opened) {

          closeModal(

            opened.id

          );

        }

      }

    }

  );

  /* =========================

     DÉMARRAGE

     ========================= */

  document.getElementById(

    "sortSelect"

  ).value =

    sortMode;

  applyFont();

  fillCategorySelect();

  renderCategoryFilters();

  renderCocktails();

  if (

    "serviceWorker"

    in navigator

    &&

    (

      location.protocol === "https:"

      ||

      location.hostname === "localhost"

    )

  ) {

    navigator

      .serviceWorker

      .register(

        "./service-worker.js"

      )

      .catch(() => {});

  }

</script>
