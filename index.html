<!DOCTYPE html>

<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, viewport-fit=cover"

  >

  <meta name="theme-color" content="#111827">

  <title>Recettes Cocktails</title>

  <link rel="manifest" href="./manifest.json">

  <link rel="apple-touch-icon" href="./icon.jpg">

  <link rel="icon" type="image/jpeg" href="./icon.jpg">

  <style>

    :root {

      --bg: #f3f4f6;

      --card: #ffffff;

      --text: #111827;

      --muted: #6b7280;

      --border: #e5e7eb;

      --accent: #111827;

      --accent-soft: #374151;

      --danger: #b91c1c;

      --danger-bg: #fee2e2;

      --success: #15803d;

      --shadow:

        0 8px 25px rgba(0,0,0,0.08);

    }

    * {

      box-sizing: border-box;

    }

    html {

      -webkit-text-size-adjust: 100%;

    }

    body {

      margin: 0;

      min-height: 100vh;

      font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        Roboto,

        Helvetica,

        Arial,

        sans-serif;

      background: var(--bg);

      color: var(--text);

    }

    button,

    input,

    textarea,

    select {

      font: inherit;

    }

    button {

      cursor: pointer;

      touch-action: manipulation;

    }

    /* =========================

       HEADER

    ========================= */

    header {

      position: sticky;

      top: 0;

      z-index: 50;

      background:

        rgba(17,24,39,.97);

      color: white;

      padding:

        calc(14px + env(safe-area-inset-top))

        20px

        14px;

      box-shadow:

        0 4px 15px rgba(0,0,0,.15);

    }

    .header-inner {

      width: 100%;

      max-width: 1500px;

      margin: auto;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

    }

    .brand {

      display: flex;

      align-items: center;

      gap: 14px;

      min-width: 0;

    }

    .brand img {

      width: 52px;

      height: 52px;

      flex-shrink: 0;

      object-fit: cover;

      border-radius: 14px;

      background: white;

    }

    .brand-text {

      min-width: 0;

    }

    .brand-text h1 {

      margin: 0;

      font-size: 24px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }

    .brand-text p {

      margin: 3px 0 0;

      color: #d1d5db;

      font-size: 14px;

    }

    .header-actions {

      display: flex;

      align-items: center;

      gap: 10px;

      flex-shrink: 0;

    }

    .header-btn {

      border: none;

      min-height: 48px;

      padding: 0 18px;

      border-radius: 12px;

      font-weight: 800;

      font-size: 15px;

    }

    .category-main-btn {

      background: #374151;

      color: white;

      border: 1px solid #4b5563;

    }

    .add-main-btn {

      background: white;

      color: #111827;

    }

    /* =========================

       CONTAINER

    ========================= */

    .container {

      width: 100%;

      max-width: 1500px;

      margin: auto;

      padding: 24px;

    }

    /* =========================

       TOOLBAR

    ========================= */

    .toolbar {

      display: grid;

      grid-template-columns:

        minmax(250px, 1fr)

        minmax(180px, 230px)

        minmax(180px, 230px);

      gap: 14px;

      margin-bottom: 20px;

    }

    .search-box {

      position: relative;

    }

    .search-box span {

      position: absolute;

      left: 17px;

      top: 50%;

      transform:

        translateY(-50%);

      font-size: 20px;

      pointer-events: none;

    }

    .search-box input,

    .toolbar select {

      width: 100%;

      height: 56px;

      border:

        1px solid var(--border);

      border-radius: 14px;

      background: white;

      color: var(--text);

      font-size: 17px;

      outline: none;

      box-shadow:

        0 2px 8px rgba(0,0,0,.04);

    }

    .search-box input {

      padding:

        0 18px 0 50px;

    }

    .toolbar select {

      padding:

        0 14px;

    }

    input:focus,

    textarea:focus,

    select:focus {

      border-color:

        #4b5563 !important;

      box-shadow:

        0 0 0 3px

        rgba(17,24,39,.08);

    }

    /* =========================

       STATS

    ========================= */

    .stats {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 18px;

      color: var(--muted);

      font-size: 15px;

    }

    .stats strong {

      color: var(--text);

    }

    /* =========================

       COCKTAIL GRID

    ========================= */

    .cocktail-grid {

      display: grid;

      grid-template-columns:

        repeat(

          auto-fill,

          minmax(280px, 1fr)

        );

      gap: 20px;

    }

    .cocktail-card {

      position: relative;

      overflow: hidden;

      background: var(--card);

      border:

        1px solid var(--border);

      border-radius: 18px;

      box-shadow: var(--shadow);

      display: flex;

      flex-direction: column;

      min-height: 310px;

      transition:

        transform .15s ease,

        box-shadow .15s ease;

    }

    .cocktail-card:active {

      transform:

        scale(.985);

    }

    .order-badge {

      position: absolute;

      top: 12px;

      left: 12px;

      z-index: 2;

      min-width: 38px;

      height: 38px;

      padding: 0 10px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 999px;

      background:

        rgba(255,255,255,.95);

      color: #111827;

      font-weight: 900;

      font-size: 14px;

      box-shadow:

        0 3px 10px rgba(0,0,0,.15);

    }

    .cocktail-image {

      height: 125px;

      display: flex;

      align-items: center;

      justify-content: center;

      background:

        linear-gradient(

          135deg,

          #111827,

          #374151

        );

      color: white;

      font-size: 54px;

    }

    .cocktail-content {

      padding: 18px;

      display: flex;

      flex-direction: column;

      flex: 1;

    }

    .cocktail-top {

      display: flex;

      justify-content:

        space-between;

      align-items:

        flex-start;

      gap: 12px;

    }

    .cocktail-name {

      margin: 0;

      font-size: 21px;

      line-height: 1.15;

    }

    .category-badge {

      flex-shrink: 0;

      display: inline-flex;

      align-items: center;

      max-width: 140px;

      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;

      background: #f3f4f6;

      color: #4b5563;

      padding: 6px 9px;

      border-radius: 999px;

      font-size: 12px;

      font-weight: 700;

    }

    .ingredients-preview {

      margin: 14px 0;

      color: var(--muted);

      line-height: 1.5;

      font-size: 15px;

      flex: 1;

    }

    .card-buttons {

      display: grid;

      grid-template-columns:

        1fr auto;

      gap: 10px;

    }

    .view-btn {

      height: 48px;

      border: none;

      border-radius: 12px;

      background: var(--accent);

      color: white;

      font-weight: 800;

      font-size: 15px;

    }

    .edit-btn {

      min-width: 52px;

      height: 48px;

      border:

        1px solid var(--border);

      border-radius: 12px;

      background: white;

      color: var(--text);

      font-size: 20px;

    }

    /* =========================

       EMPTY

    ========================= */

    .empty {

      grid-column:

        1 / -1;

      background: white;

      border:

        1px dashed #d1d5db;

      border-radius: 18px;

      padding: 50px 20px;

      text-align: center;

      color: var(--muted);

    }

    .empty-icon {

      font-size: 55px;

      margin-bottom: 10px;

    }

    /* =========================

       MODAL

    ========================= */

    .modal-overlay {

      position: fixed;

      inset: 0;

      z-index: 1000;

      background:

        rgba(0,0,0,.60);

      display: none;

      align-items: center;

      justify-content: center;

      padding:

        max(

          20px,

          env(safe-area-inset-top)

        )

        max(

          20px,

          env(safe-area-inset-right)

        )

        max(

          20px,

          env(safe-area-inset-bottom)

        )

        max(

          20px,

          env(safe-area-inset-left)

        );

    }

    .modal-overlay.show {

      display: flex;

    }

    .modal {

      width:

        min(780px,100%);

      max-height: 92vh;

      background: white;

      border-radius: 22px;

      overflow: auto;

      box-shadow:

        0 25px 70px

        rgba(0,0,0,.30);

    }

    .modal.small {

      width:

        min(600px,100%);

    }

    .modal-header {

      position: sticky;

      top: 0;

      z-index: 5;

      background: white;

      border-bottom:

        1px solid var(--border);

      padding: 20px 22px;

      display: flex;

      align-items: center;

      justify-content:

        space-between;

      gap: 15px;

    }

    .modal-header h2 {

      margin: 0;

      font-size: 24px;

    }

    .close-btn {

      width: 44px;

      height: 44px;

      flex-shrink: 0;

      border: none;

      border-radius: 50%;

      background: #f3f4f6;

      font-size: 22px;

      font-weight: bold;

    }

    .modal-body {

      padding: 22px;

    }

    /* =========================

       RECIPE

    ========================= */

    .recipe-section {

      margin-bottom: 26px;

    }

    .recipe-section:last-child {

      margin-bottom: 0;

    }

    .recipe-section h3 {

      margin: 0 0 10px;

      font-size: 18px;

    }

    .recipe-text {

      white-space: pre-line;

      background: #f9fafb;

      border:

        1px solid var(--border);

      border-radius: 14px;

      padding: 16px;

      line-height: 1.6;

      font-size: 17px;

    }

    .recipe-category {

      display: inline-block;

      background: #111827;

      color: white;

      padding: 7px 12px;

      border-radius: 999px;

      font-size: 13px;

      font-weight: 700;

      margin-bottom: 20px;

    }

    /* =========================

       FORM

    ========================= */

    .form-grid {

      display: grid;

      grid-template-columns:

        1fr 1fr;

      gap: 18px;

    }

    .field {

      margin-bottom: 18px;

    }

    .field.full {

      grid-column:

        1 / -1;

    }

    .field label {

      display: block;

      margin-bottom: 7px;

      font-weight: 800;

      font-size: 14px;

    }

    .field input,

    .field textarea,

    .field select {

      width: 100%;

      border:

        1px solid #d1d5db;

      border-radius: 12px;

      padding: 13px 14px;

      outline: none;

      background: white;

      color: var(--text);

      font-size: 16px;

    }

    .field input,

    .field select {

      min-height: 50px;

    }

    .field textarea {

      min-height: 130px;

      resize: vertical;

      line-height: 1.5;

    }

    .form-actions {

      display: flex;

      gap: 12px;

      justify-content: flex-end;

      border-top:

        1px solid var(--border);

      padding-top: 20px;

      margin-top: 5px;

    }

    .btn {

      min-height: 50px;

      border: none;

      border-radius: 12px;

      padding: 0 20px;

      font-weight: 800;

      font-size: 15px;

    }

    .btn-primary {

      background: var(--accent);

      color: white;

    }

    .btn-secondary {

      background: #e5e7eb;

      color: var(--text);

    }

    .btn-danger {

      background: var(--danger-bg);

      color: var(--danger);

      margin-right: auto;

    }

    /* =========================

       CATEGORIES

    ========================= */

    .category-create {

      display: grid;

      grid-template-columns:

        1fr auto;

      gap: 10px;

      margin-bottom: 22px;

    }

    .category-create input {

      width: 100%;

      min-height: 52px;

      padding: 0 14px;

      border:

        1px solid #d1d5db;

      border-radius: 12px;

      outline: none;

    }

    .category-create button {

      min-height: 52px;

      padding: 0 18px;

      border: none;

      border-radius: 12px;

      background: #111827;

      color: white;

      font-weight: 800;

    }

    .category-list {

      display: flex;

      flex-direction: column;

      gap: 10px;

    }

    .category-row {

      min-height: 54px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      padding: 10px 12px;

      background: #f9fafb;

      border:

        1px solid var(--border);

      border-radius: 12px;

    }

    .category-row strong {

      min-width: 0;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

    }

    .category-delete {

      flex-shrink: 0;

      border: none;

      border-radius: 10px;

      background: var(--danger-bg);

      color: var(--danger);

      padding: 9px 12px;

      font-weight: 700;

    }

    .category-used {

      flex-shrink: 0;

      color: var(--muted);

      font-size: 13px;

    }

    .helper-text {

      color: var(--muted);

      font-size: 14px;

      line-height: 1.5;

      margin-bottom: 18px;

    }

    /* =========================

       TABLET

    ========================= */

    @media (min-width:700px) {

      .container {

        padding: 30px;

      }

      .cocktail-grid {

        grid-template-columns:

          repeat(

            2,

            minmax(0,1fr)

          );

      }

      .cocktail-card {

        min-height: 320px;

      }

      .cocktail-image {

        height: 145px;

      }

      .view-btn,

      .edit-btn {

        height: 54px;

      }

    }

    /* =========================

       LARGE TABLET

    ========================= */

    @media (min-width:1000px) {

      header {

        padding-left: 30px;

        padding-right: 30px;

      }

      .brand img {

        width: 58px;

        height: 58px;

      }

      .brand-text h1 {

        font-size: 27px;

      }

      .header-btn {

        min-height: 54px;

        padding:

          0 22px;

      }

      .cocktail-grid {

        grid-template-columns:

          repeat(

            3,

            minmax(0,1fr)

          );

      }

      .cocktail-name {

        font-size: 22px;

      }

    }

    /* =========================

       VERY LARGE

    ========================= */

    @media (min-width:1400px) {

      .cocktail-grid {

        grid-template-columns:

          repeat(

            4,

            minmax(0,1fr)

          );

      }

    }

    /* =========================

       PHONE

    ========================= */

    @media (max-width:699px) {

      header {

        padding-left: 12px;

        padding-right: 12px;

      }

      .header-inner {

        gap: 8px;

      }

      .brand {

        gap: 9px;

      }

      .brand img {

        width: 44px;

        height: 44px;

        border-radius: 11px;

      }

      .brand-text h1 {

        font-size: 18px;

      }

      .brand-text p {

        display: none;

      }

      .header-actions {

        gap: 6px;

      }

      .header-btn {

        width: 46px;

        height: 46px;

        min-height: 46px;

        padding: 0;

        font-size: 0;

      }

      .category-main-btn::after {

        content: "🏷️";

        font-size: 21px;

      }

      .add-main-btn::after {

        content: "+";

        font-size: 28px;

      }

      .container {

        padding: 16px;

      }

      .toolbar {

        grid-template-columns: 1fr;

        gap: 10px;

      }

      .search-box input,

      .toolbar select {

        height: 52px;

      }

      .cocktail-grid {

        grid-template-columns: 1fr;

        gap: 15px;

      }

      .cocktail-card {

        min-height: auto;

      }

      .cocktail-image {

        height: 105px;

      }

      .form-grid {

        grid-template-columns:

          1fr;

      }

      .field.full {

        grid-column: auto;

      }

      .form-actions {

        flex-wrap: wrap;

      }

      .btn {

        flex: 1;

      }

      .btn-danger {

        flex-basis: 100%;

        order: 3;

      }

      .modal-overlay {

        padding: 8px;

        align-items: flex-end;

      }

      .modal {

        max-height: 94vh;

        border-radius:

          20px

          20px

          12px

          12px;

      }

      .category-create {

        grid-template-columns:

          1fr;

      }

    }

  </style>

</head>

<body>

<header>

  <div class="header-inner">

    <div class="brand">

      <img

        src="./icon.jpg"

        alt="Logo Recettes Cocktails"

        onerror="this.style.display='none'"

      >

      <div class="brand-text">

        <h1>

          🍹 Recettes Cocktails

        </h1>

        <p>

          Les recettes du bar

        </p>

      </div>

    </div>

    <div class="header-actions">

      <button

        class="header-btn category-main-btn"

        onclick="openCategoryModal()"

      >

        🏷️ Catégories

      </button>

      <button

        class="header-btn add-main-btn"

        onclick="openAddModal()"

      >

        + Ajouter

      </button>

    </div>

  </div>

</header>

<main class="container">

  <div class="toolbar">

    <div class="search-box">

      <span>

        🔎

      </span>

      <input

        id="searchInput"

        type="search"

        placeholder="Rechercher un cocktail..."

        autocomplete="off"

        oninput="renderCocktails()"

      >

    </div>

    <select

      id="categoryFilter"

      onchange="renderCocktails()"

    >

    </select>

    <select

      id="sortSelect"

      onchange="renderCocktails()"

    >

      <option value="numberAsc">

        Numéro : 1 → 99

      </option>

      <option value="numberDesc">

        Numéro : 99 → 1

      </option>

      <option value="alphaAsc">

        Alphabétique : A → Z

      </option>

      <option value="alphaDesc">

        Alphabétique : Z → A

      </option>

    </select>

  </div>

  <div class="stats">

    <div>

      <strong id="cocktailCount">

        0

      </strong>

      recette(s)

    </div>

  </div>

  <div

    id="cocktailGrid"

    class="cocktail-grid"

  >

  </div>

</main>

<!-- =========================

     MODAL RECETTE

========================= -->

<div

  id="recipeModal"

  class="modal-overlay"

  onclick="closeOnOverlay(event,'recipeModal')"

>

  <div class="modal">

    <div class="modal-header">

      <h2 id="recipeTitle">

        Cocktail

      </h2>

      <button

        class="close-btn"

        onclick="closeModal('recipeModal')"

      >

        ×

      </button>

    </div>

    <div

      id="recipeBody"

      class="modal-body"

    >

    </div>

  </div>

</div>

<!-- =========================

     MODAL AJOUT / MODIFICATION

========================= -->

<div

  id="editModal"

  class="modal-overlay"

  onclick="closeOnOverlay(event,'editModal')"

>

  <div class="modal">

    <div class="modal-header">

      <h2 id="editTitle">

        Ajouter une recette

      </h2>

      <button

        class="close-btn"

        onclick="closeModal('editModal')"

      >

        ×

      </button>

    </div>

    <div class="modal-body">

      <form

        id="cocktailForm"

        onsubmit="saveCocktail(event)"

      >

        <input

          type="hidden"

          id="editId"

        >

        <div class="form-grid">

          <div class="field">

            <label for="orderNumber">

              N° / ordre

            </label>

            <input

              id="orderNumber"

              type="number"

              min="1"

              step="1"

              placeholder="Ex. 1"

              required

            >

          </div>

          <div class="field">

            <label for="name">

              Nom du cocktail

            </label>

            <input

              id="name"

              type="text"

              placeholder="Ex. Mojito"

              required

            >

          </div>

          <div class="field">

            <label for="category">

              Catégorie

            </label>

            <select

              id="category"

              required

            >

            </select>

          </div>

          <div class="field">

            <label for="glass">

              Verre

            </label>

            <input

              id="glass"

              type="text"

              placeholder="Ex. Highball"

            >

          </div>

          <div class="field full">

            <label for="garnish">

              Décoration

            </label>

            <input

              id="garnish"

              type="text"

              placeholder="Ex. Menthe + citron vert"

            >

          </div>

          <div class="field full">

            <label for="ingredients">

              Ingrédients

            </label>

            <textarea

              id="ingredients"

              required

              placeholder="Ex :

5 cl rhum blanc

2 cl jus de citron vert

Menthe

Eau pétillante"

            ></textarea>

          </div>

          <div class="field full">

            <label for="preparation">

              Préparation

            </label>

            <textarea

              id="preparation"

              required

              placeholder="Explique les étapes de préparation..."

            ></textarea>

          </div>

          <div class="field full">

            <label for="notes">

              Notes

            </label>

            <textarea

              id="notes"

              placeholder="Optionnel : marque, variante, conseil..."

            ></textarea>

          </div>

        </div>

        <div class="form-actions">

          <button

            id="deleteBtn"

            type="button"

            class="btn btn-danger"

            onclick="deleteCocktail()"

            style="display:none;"

          >

            🗑 Supprimer

          </button>

          <button

            type="button"

            class="btn btn-secondary"

            onclick="closeModal('editModal')"

          >

            Annuler

          </button>

          <button

            type="submit"

            class="btn btn-primary"

          >

            💾 Enregistrer

          </button>

        </div>

      </form>

    </div>

  </div>

</div>

<!-- =========================

     MODAL CATEGORIES

========================= -->

<div

  id="categoryModal"

  class="modal-overlay"

  onclick="closeOnOverlay(event,'categoryModal')"

>

  <div class="modal small">

    <div class="modal-header">

      <h2>

        🏷️ Mes catégories

      </h2>

      <button

        class="close-btn"

        onclick="closeModal('categoryModal')"

      >

        ×

      </button>

    </div>

    <div class="modal-body">

      <div class="helper-text">

        Tu peux créer les catégories que tu veux :

        Gin, Rhum, Shooter, Signature, Sans alcool,

        Cocktails maison, etc.

      </div>

      <div class="category-create">

        <input

          id="newCategoryInput"

          type="text"

          placeholder="Nouvelle catégorie..."

          maxlength="40"

          onkeydown="categoryEnter(event)"

        >

        <button

          type="button"

          onclick="addCategory()"

        >

          + Ajouter

        </button>

      </div>

      <div

        id="categoryList"

        class="category-list"

      >

      </div>

    </div>

  </div>

</div>

<script>

/* ============================================================

   CONFIGURATION

============================================================ */

const COCKTAIL_STORAGE =

  "recettesCocktailsMamyMoussV2";

const OLD_COCKTAIL_STORAGE =

  "recettesCocktailsMamyMoussV1";

const CATEGORY_STORAGE =

  "recettesCocktailsCategoriesV2";

const defaultCategories = [

  "Classique",

  "Gin",

  "Rhum",

  "Vodka",

  "Tequila",

  "Whisky",

  "Spritz",

  "Shooter",

  "Mocktail",

  "Maison",

  "Autre"

];

const defaultCocktails = [

  {

    id: "mojito",

    orderNumber: 1,

    name: "Mojito",

    category: "Rhum",

    glass: "Highball",

    garnish:

      "Menthe + citron vert",

    ingredients:

`5 cl de rhum blanc

2 cl de jus de citron vert

2 c. à café de sucre

8 à 10 feuilles de menthe

Eau pétillante

Glace pilée`,

    preparation:

`Mettre la menthe, le sucre et le citron vert dans le verre.

Écraser légèrement.

Ajouter le rhum et la glace pilée.

Compléter avec l'eau pétillante et mélanger.`,

    notes: ""

  },

  {

    id: "gin-tonic",

    orderNumber: 2,

    name: "Gin Tonic",

    category: "Gin",

    glass: "Ballon / Highball",

    garnish: "Selon le gin",

    ingredients:

`5 cl de gin

Tonic

Glaçons`,

    preparation:

`Remplir le verre de glaçons.

Ajouter le gin.

Compléter avec le tonic.

Mélanger doucement.`,

    notes: ""

  },

  {

    id: "aperol-spritz",

    orderNumber: 3,

    name: "Aperol Spritz",

    category: "Spritz",

    glass: "Verre à vin",

    garnish:

      "Tranche d'orange",

    ingredients:

`6 cl de Prosecco

4 cl d'Aperol

2 cl d'eau pétillante

Glaçons`,

    preparation:

`Remplir le verre de glaçons.

Ajouter le Prosecco puis l'Aperol.

Ajouter l'eau pétillante.

Mélanger délicatement.`,

    notes: ""

  }

];

/* ============================================================

   CHARGEMENT

============================================================ */

function loadCocktails() {

  let saved =

    localStorage.getItem(

      COCKTAIL_STORAGE

    );

  if (!saved) {

    saved =

      localStorage.getItem(

        OLD_COCKTAIL_STORAGE

      );

  }

  let data;

  if (saved) {

    try {

      data = JSON.parse(saved);

    }

    catch {

      data = null;

    }

  }

  if (!Array.isArray(data)) {

    data =

      JSON.parse(

        JSON.stringify(

          defaultCocktails

        )

      );

  }

  data =

    data.map(

      (cocktail,index) => ({

        ...cocktail,

        id:

          cocktail.id ||

          generateId(),

        orderNumber:

          Number(

            cocktail.orderNumber

          ) ||

          index + 1,

        name:

          cocktail.name || "",

        category:

          cocktail.category ||

          "Autre",

        glass:

          cocktail.glass || "",

        garnish:

          cocktail.garnish || "",

        ingredients:

          cocktail.ingredients || "",

        preparation:

          cocktail.preparation || "",

        notes:

          cocktail.notes || ""

      })

    );

  localStorage.setItem(

    COCKTAIL_STORAGE,

    JSON.stringify(data)

  );

  return data;

}

function loadCategories() {

  const saved =

    localStorage.getItem(

      CATEGORY_STORAGE

    );

  let list;

  if (saved) {

    try {

      list =

        JSON.parse(saved);

    }

    catch {

      list = null;

    }

  }

  if (!Array.isArray(list)) {

    list =

      [...defaultCategories];

  }

  cocktails.forEach(

    cocktail => {

      if (

        cocktail.category &&

        !list.includes(

          cocktail.category

        )

      ) {

        list.push(

          cocktail.category

        );

      }

    }

  );

  list =

    [...new Set(list)]

      .filter(Boolean)

      .sort(

        (a,b) =>

          a.localeCompare(

            b,

            "fr"

          )

      );

  localStorage.setItem(

    CATEGORY_STORAGE,

    JSON.stringify(list)

  );

  return list;

}

let cocktails =

  loadCocktails();

let categories =

  loadCategories();

/* ============================================================

   SAUVEGARDE

============================================================ */

function saveCocktailsStorage() {

  localStorage.setItem(

    COCKTAIL_STORAGE,

    JSON.stringify(cocktails)

  );

}

function saveCategoriesStorage() {

  localStorage.setItem(

    CATEGORY_STORAGE,

    JSON.stringify(categories)

  );

}

/* ============================================================

   AFFICHAGE CATEGORIES

============================================================ */

function refreshCategorySelectors() {

  const filter =

    document.getElementById(

      "categoryFilter"

    );

  const recipeSelect =

    document.getElementById(

      "category"

    );

  const selectedFilter =

    filter.value;

  const selectedRecipe =

    recipeSelect.value;

  filter.innerHTML = `

    <option value="">

      Toutes les catégories

    </option>

  `;

  recipeSelect.innerHTML = "";

  categories

    .slice()

    .sort(

      (a,b) =>

        a.localeCompare(

          b,

          "fr"

        )

    )

    .forEach(

      category => {

        const optionFilter =

          document.createElement(

            "option"

          );

        optionFilter.value =

          category;

        optionFilter.textContent =

          category;

        filter.appendChild(

          optionFilter

        );

        const optionRecipe =

          document.createElement(

            "option"

          );

        optionRecipe.value =

          category;

        optionRecipe.textContent =

          category;

        recipeSelect.appendChild(

          optionRecipe

        );

      }

    );

  if (

    categories.includes(

      selectedFilter

    )

  ) {

    filter.value =

      selectedFilter;

  }

  if (

    categories.includes(

      selectedRecipe

    )

  ) {

    recipeSelect.value =

      selectedRecipe;

  }

}

/* ============================================================

   AFFICHAGE COCKTAILS

============================================================ */

function renderCocktails() {

  const grid =

    document.getElementById(

      "cocktailGrid"

    );

  const search =

    document

      .getElementById(

        "searchInput"

      )

      .value

      .trim()

      .toLowerCase();

  const category =

    document

      .getElementById(

        "categoryFilter"

      )

      .value;

  const sort =

    document

      .getElementById(

        "sortSelect"

      )

      .value;

  let filtered =

    cocktails.filter(

      cocktail => {

        const text =

          [

            cocktail.name,

            cocktail.category,

            cocktail.ingredients,

            cocktail.glass,

            cocktail.garnish,

            cocktail.notes,

            cocktail.orderNumber

          ]

          .join(" ")

          .toLowerCase();

        const matchesSearch =

          !search ||

          text.includes(search);

        const matchesCategory =

          !category ||

          cocktail.category === category;

        return (

          matchesSearch &&

          matchesCategory

        );

      }

    );

  filtered.sort(

    (a,b) => {

      if (

        sort === "alphaAsc"

      ) {

        return a.name.localeCompare(

          b.name,

          "fr"

        );

      }

      if (

        sort === "alphaDesc"

      ) {

        return b.name.localeCompare(

          a.name,

          "fr"

        );

      }

      if (

        sort === "numberDesc"

      ) {

        return (

          Number(

            b.orderNumber

          ) -

          Number(

            a.orderNumber

          )

        );

      }

      return (

        Number(

          a.orderNumber

        ) -

        Number(

          b.orderNumber

        )

      );

    }

  );

  document.getElementById(

    "cocktailCount"

  ).textContent =

    filtered.length;

  if (

    filtered.length === 0

  ) {

    grid.innerHTML = `

      <div class="empty">

        <div class="empty-icon">

          🍸

        </div>

        <strong>

          Aucun cocktail trouvé

        </strong>

        <p>

          Essaie une autre recherche

          ou ajoute une recette.

        </p>

      </div>

    `;

    return;

  }

  grid.innerHTML =

    filtered.map(

      cocktail => {

        const preview =

          cocktail.ingredients

            .split("\n")

            .filter(Boolean)

            .slice(0,3)

            .join(" • ");

        return `

          <article class="cocktail-card">

            <div class="order-badge">

              ${escapeHtml(

                String(

                  cocktail.orderNumber

                )

              )}

            </div>

            <div class="cocktail-image">

              ${getCocktailEmoji(

                cocktail.category

              )}

            </div>

            <div class="cocktail-content">

              <div class="cocktail-top">

                <h2 class="cocktail-name">

                  ${escapeHtml(

                    cocktail.name

                  )}

                </h2>

                <span class="category-badge">

                  ${escapeHtml(

                    cocktail.category

                  )}

                </span>

              </div>

              <div class="ingredients-preview">

                ${escapeHtml(

                  preview

                )}

              </div>

              <div class="card-buttons">

                <button

                  class="view-btn"

                  onclick="viewCocktail('${cocktail.id}')"

                >

                  Voir la recette

                </button>

                <button

                  class="edit-btn"

                  onclick="editCocktail('${cocktail.id}')"

                  aria-label="Modifier"

                >

                  ✏️

                </button>

              </div>

            </div>

          </article>

        `;

      }

    )

    .join("");

}

/* ============================================================

   EMOJIS

============================================================ */

function getCocktailEmoji(

  category

) {

  const c =

    category.toLowerCase();

  if (

    c.includes("gin")

  ) {

    return "🍸";

  }

  if (

    c.includes("rhum")

  ) {

    return "🍹";

  }

  if (

    c.includes("whisky") ||

    c.includes("whiskey")

  ) {

    return "🥃";

  }

  if (

    c.includes("spritz")

  ) {

    return "🍊";

  }

  if (

    c.includes("sans alcool") ||

    c.includes("mocktail")

  ) {

    return "🧃";

  }

  if (

    c.includes("shooter") ||

    c.includes("shot")

  ) {

    return "🥃";

  }

  if (

    c.includes("maison") ||

    c.includes("signature")

  ) {

    return "⭐";

  }

  return "🍹";

}

/* ============================================================

   VOIR RECETTE

============================================================ */

function viewCocktail(id) {

  const cocktail =

    cocktails.find(

      item =>

        item.id === id

    );

  if (!cocktail) {

    return;

  }

  document.getElementById(

    "recipeTitle"

  ).textContent =

    cocktail.name;

  document.getElementById(

    "recipeBody"

  ).innerHTML = `

    <span class="recipe-category">

      N° ${escapeHtml(

        String(

          cocktail.orderNumber

        )

      )}

      ·

      ${escapeHtml(

        cocktail.category

      )}

    </span>

    ${

      cocktail.glass

      ?

      `

      <div class="recipe-section">

        <h3>

          🥂 Verre

        </h3>

        <div class="recipe-text">

          ${escapeHtml(

            cocktail.glass

          )}

        </div>

      </div>

      `

      :

      ""

    }

    <div class="recipe-section">

      <h3>

        🍋 Ingrédients

      </h3>

      <div class="recipe-text">

        ${escapeHtml(

          cocktail.ingredients

        )}

      </div>

    </div>

    <div class="recipe-section">

      <h3>

        👨‍🍳 Préparation

      </h3>

      <div class="recipe-text">

        ${escapeHtml(

          cocktail.preparation

        )}

      </div>

    </div>

    ${

      cocktail.garnish

      ?

      `

      <div class="recipe-section">

        <h3>

          🌿 Décoration

        </h3>

        <div class="recipe-text">

          ${escapeHtml(

            cocktail.garnish

          )}

        </div>

      </div>

      `

      :

      ""

    }

    ${

      cocktail.notes

      ?

      `

      <div class="recipe-section">

        <h3>

          📝 Notes

        </h3>

        <div class="recipe-text">

          ${escapeHtml(

            cocktail.notes

          )}

        </div>

      </div>

      `

      :

      ""

    }

  `;

  openModal(

    "recipeModal"

  );

}

/* ============================================================

   AJOUT RECETTE

============================================================ */

function openAddModal() {

  document

    .getElementById(

      "cocktailForm"

    )

    .reset();

  document.getElementById(

    "editId"

  ).value = "";

  document.getElementById(

    "editTitle"

  ).textContent =

    "Ajouter une recette";

  document.getElementById(

    "deleteBtn"

  ).style.display =

    "none";

  const maxNumber =

    cocktails.reduce(

      (

        max,

        cocktail

      ) =>

        Math.max(

          max,

          Number(

            cocktail.orderNumber

          ) || 0

        ),

      0

    );

  document.getElementById(

    "orderNumber"

  ).value =

    maxNumber + 1;

  refreshCategorySelectors();

  if (

    categories.length > 0

  ) {

    document.getElementById(

      "category"

    ).value =

      categories[0];

  }

  openModal(

    "editModal"

  );

}

/* ============================================================

   MODIFIER RECETTE

============================================================ */

function editCocktail(id) {

  const cocktail =

    cocktails.find(

      item =>

        item.id === id

    );

  if (!cocktail) {

    return;

  }

  refreshCategorySelectors();

  document.getElementById(

    "editId"

  ).value =

    cocktail.id;

  document.getElementById(

    "editTitle"

  ).textContent =

    "Modifier la recette";

  document.getElementById(

    "orderNumber"

  ).value =

    cocktail.orderNumber;

  document.getElementById(

    "name"

  ).value =

    cocktail.name;

  document.getElementById(

    "category"

  ).value =

    cocktail.category;

  document.getElementById(

    "glass"

  ).value =

    cocktail.glass;

  document.getElementById(

    "garnish"

  ).value =

    cocktail.garnish;

  document.getElementById(

    "ingredients"

  ).value =

    cocktail.ingredients;

  document.getElementById(

    "preparation"

  ).value =

    cocktail.preparation;

  document.getElementById(

    "notes"

  ).value =

    cocktail.notes;

  document.getElementById(

    "deleteBtn"

  ).style.display =

    "block";

  openModal(

    "editModal"

  );

}

/* ============================================================

   ENREGISTRER RECETTE

============================================================ */

function saveCocktail(event) {

  event.preventDefault();

  const editId =

    document.getElementById(

      "editId"

    ).value;

  const orderNumber =

    Math.max(

      1,

      Number(

        document.getElementById(

          "orderNumber"

        ).value

      ) || 1

    );

  const name =

    document.getElementById(

      "name"

    )

    .value

    .trim();

  const category =

    document.getElementById(

      "category"

    ).value;

  const cocktail = {

    id:

      editId ||

      generateId(),

    orderNumber,

    name,

    category,

    glass:

      document

        .getElementById(

          "glass"

        )

        .value

        .trim(),

    garnish:

      document

        .getElementById(

          "garnish"

        )

        .value

        .trim(),

    ingredients:

      document

        .getElementById(

          "ingredients"

        )

        .value

        .trim(),

    preparation:

      document

        .getElementById(

          "preparation"

        )

        .value

        .trim(),

    notes:

      document

        .getElementById(

          "notes"

        )

        .value

        .trim()

  };

  if (editId) {

    const index =

      cocktails.findIndex(

        item =>

          item.id === editId

      );

    if (index !== -1) {

      cocktails[index] =

        cocktail;

    }

  }

  else {

    cocktails.push(

      cocktail

    );

  }

  saveCocktailsStorage();

  closeModal(

    "editModal"

  );

  renderCocktails();

}

/* ============================================================

   SUPPRIMER RECETTE

============================================================ */

function deleteCocktail() {

  const id =

    document.getElementById(

      "editId"

    ).value;

  if (!id) {

    return;

  }

  const cocktail =

    cocktails.find(

      item =>

        item.id === id

    );

  if (!cocktail) {

    return;

  }

  const confirmed =

    confirm(

      `Supprimer "${cocktail.name}" ?`

    );

  if (!confirmed) {

    return;

  }

  cocktails =

    cocktails.filter(

      item =>

        item.id !== id

    );

  saveCocktailsStorage();

  closeModal(

    "editModal"

  );

  renderCocktails();

}

/* ============================================================

   CATEGORIES

============================================================ */

function openCategoryModal() {

  renderCategoryList();

  openModal(

    "categoryModal"

  );

  setTimeout(

    () => {

      document

        .getElementById(

          "newCategoryInput"

        )

        .focus();

    },

    100

  );

}

function categoryEnter(

  event

) {

  if (

    event.key === "Enter"

  ) {

    event.preventDefault();

    addCategory();

  }

}

function addCategory() {

  const input =

    document.getElementById(

      "newCategoryInput"

    );

  const value =

    input.value.trim();

  if (!value) {

    return;

  }

  const exists =

    categories.some(

      category =>

        category.toLowerCase() ===

        value.toLowerCase()

    );

  if (exists) {

    alert(

      "Cette catégorie existe déjà."

    );

    return;

  }

  categories.push(

    value

  );

  categories.sort(

    (a,b) =>

      a.localeCompare(

        b,

        "fr"

      )

  );

  saveCategoriesStorage();

  input.value = "";

  refreshCategorySelectors();

  renderCategoryList();

  renderCocktails();

}

function renderCategoryList() {

  const list =

    document.getElementById(

      "categoryList"

    );

  if (

    categories.length === 0

  ) {

    list.innerHTML = `

      <div class="empty">

        Aucune catégorie.

      </div>

    `;

    return;

  }

  list.innerHTML =

    categories.map(

      category => {

        const count =

          cocktails.filter(

            cocktail =>

              cocktail.category ===

              category

          ).length;

        return `

          <div class="category-row">

            <strong>

              ${escapeHtml(

                category

              )}

            </strong>

            ${

              count > 0

              ?

              `

              <span class="category-used">

                ${count} recette(s)

              </span>

              `

              :

              `

              <button

                class="category-delete"

                onclick="deleteCategory('${escapeJs(category)}')"

              >

                Supprimer

              </button>

              `

            }

          </div>

        `;

      }

    )

    .join("");

}

/* ============================================================

   SUPPRIMER CATEGORIE

============================================================ */

function deleteCategory(

  category

) {

  const used =

    cocktails.some(

      cocktail =>

        cocktail.category ===

        category

    );

  if (used) {

    alert(

      "Cette catégorie est encore utilisée par une ou plusieurs recettes. Modifie d'abord ces recettes."

    );

    return;

  }

  const confirmed =

    confirm(

      `Supprimer la catégorie "${category}" ?`

    );

  if (!confirmed) {

    return;

  }

  categories =

    categories.filter(

      item =>

        item !== category

    );

  saveCategoriesStorage();

  refreshCategorySelectors();

  renderCategoryList();

  renderCocktails();

}

/* ============================================================

   MODALS

============================================================ */

function openModal(id) {

  document

    .getElementById(id)

    .classList.add(

      "show"

    );

  document.body.style.overflow =

    "hidden";

}

function closeModal(id) {

  document

    .getElementById(id)

    .classList.remove(

      "show"

    );

  const anyOpen =

    document.querySelector(

      ".modal-overlay.show"

    );

  if (!anyOpen) {

    document.body.style.overflow =

      "";

  }

}

function closeOnOverlay(

  event,

  id

) {

  if (

    event.target.id === id

  ) {

    closeModal(id);

  }

}

/* ============================================================

   OUTILS

============================================================ */

function generateId() {

  return (

    "cocktail-" +

    Date.now() +

    "-" +

    Math.random()

      .toString(36)

      .slice(2,8)

  );

}

function escapeHtml(

  value

) {

  return String(

    value ?? ""

  )

  .replaceAll(

    "&",

    "&amp;"

  )

  .replaceAll(

    "<",

    "&lt;"

  )

  .replaceAll(

    ">",

    "&gt;"

  )

  .replaceAll(

    '"',

    "&quot;"

  )

  .replaceAll(

    "'",

    "&#039;"

  );

}

function escapeJs(

  value

) {

  return String(value)

    .replaceAll(

      "\\",

      "\\\\"

    )

    .replaceAll(

      "'",

      "\\'"

    );

}

/* ============================================================

   DEMARRAGE

============================================================ */

refreshCategorySelectors();

renderCocktails();

</script>

</body>

</html>
