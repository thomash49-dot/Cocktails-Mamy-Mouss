<!DOCTYPE html>

<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, viewport-fit=cover"

  >

  <meta name="theme-color" content="#111827">

  <title>Recettes Boissons</title>

  <!-- PWA + NOUVELLE ICÔNE -->

  <link rel="manifest" href="./manifest.json">

  <link rel="apple-touch-icon" href="./icon.PNG">

  <link rel="icon" type="image/png" href="./icon.PNG">

  <style>

    :root {

      --bg: #f3f4f6;

      --card: #ffffff;

      --text: #111827;

      --muted: #6b7280;

      --border: #e5e7eb;

      --accent: #111827;

      --danger: #b91c1c;

      --danger-bg: #fee2e2;

      --shadow: 0 8px 25px rgba(0,0,0,.08);

    }

    * {

      box-sizing: border-box;

    }

    html {

      -webkit-text-size-adjust: 100%;

    }

    body {

      margin: 0;

      min-height: 100vh;

      font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        Roboto,

        Helvetica,

        Arial,

        sans-serif;

      background: var(--bg);

      color: var(--text);

    }

    button,

    input,

    textarea,

    select {

      font: inherit;

    }

    button {

      cursor: pointer;

      touch-action: manipulation;

    }

    /* HEADER */

    header {

      position: sticky;

      top: 0;

      z-index: 50;

      background: rgba(17,24,39,.97);

      color: white;

      padding:

        calc(14px + env(safe-area-inset-top))

        20px

        14px;

      box-shadow: 0 4px 15px rgba(0,0,0,.15);

    }

    .header-inner {

      max-width: 1500px;

      margin: auto;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

    }

    .brand {

      display: flex;

      align-items: center;

      gap: 14px;

      min-width: 0;

    }

    .brand img {

      width: 52px;

      height: 52px;

      object-fit: cover;

      border-radius: 14px;

      background: white;

    }

    .brand-text h1 {

      margin: 0;

      font-size: 24px;

    }

    .brand-text p {

      margin: 3px 0 0;

      color: #d1d5db;

      font-size: 14px;

    }

    .header-actions {

      display: flex;

      gap: 10px;

    }

    .header-btn {

      border: none;

      min-height: 48px;

      padding: 0 18px;

      border-radius: 12px;

      font-weight: 800;

    }

    .category-main-btn {

      background: #374151;

      color: white;

      border: 1px solid #4b5563;

    }

    .add-main-btn {

      background: white;

      color: #111827;

    }

    /* CONTAINER */

    .container {

      width: 100%;

      max-width: 1500px;

      margin: auto;

      padding: 24px;

    }

    /* BARRE */

    .toolbar {

      display: grid;

      grid-template-columns:

        minmax(250px,1fr)

        minmax(180px,230px)

        minmax(180px,230px);

      gap: 14px;

      margin-bottom: 20px;

    }

    .search-box {

      position: relative;

    }

    .search-box span {

      position: absolute;

      left: 17px;

      top: 50%;

      transform: translateY(-50%);

      font-size: 20px;

      pointer-events: none;

    }

    .search-box input,

    .toolbar select {

      width: 100%;

      height: 56px;

      border: 1px solid var(--border);

      border-radius: 14px;

      background: white;

      color: var(--text);

      font-size: 17px;

      outline: none;

    }

    .search-box input {

      padding: 0 18px 0 50px;

    }

    .toolbar select {

      padding: 0 14px;

    }

    input:focus,

    textarea:focus,

    select:focus {

      border-color: #4b5563 !important;

      box-shadow: 0 0 0 3px rgba(17,24,39,.08);

    }

    /* COMPTEUR */

    .stats {

      margin-bottom: 18px;

      color: var(--muted);

    }

    .stats strong {

      color: var(--text);

    }

    /* CARTES */

    .cocktail-grid {

      display: grid;

      grid-template-columns:

        repeat(auto-fill,minmax(280px,1fr));

      gap: 20px;

    }

    .cocktail-card {

      position: relative;

      background: white;

      border: 1px solid var(--border);

      border-radius: 18px;

      overflow: hidden;

      box-shadow: var(--shadow);

      display: flex;

      flex-direction: column;

      min-height: 310px;

    }

    .order-badge {

      position: absolute;

      top: 12px;

      left: 12px;

      min-width: 38px;

      height: 38px;

      padding: 0 10px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 999px;

      background: rgba(255,255,255,.95);

      font-weight: 900;

      box-shadow: 0 3px 10px rgba(0,0,0,.15);

    }

    .cocktail-image {

      height: 125px;

      display: flex;

      align-items: center;

      justify-content: center;

      background:

        linear-gradient(

          135deg,

          #111827,

          #374151

        );

      font-size: 54px;

    }

    .cocktail-content {

      padding: 18px;

      display: flex;

      flex-direction: column;

      flex: 1;

    }

    .cocktail-top {

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      gap: 12px;

    }

    .cocktail-name {

      margin: 0;

      font-size: 21px;

    }

    .category-badge {

      background: #f3f4f6;

      color: #4b5563;

      padding: 6px 9px;

      border-radius: 999px;

      font-size: 12px;

      font-weight: 700;

    }

    .ingredients-preview {

      margin: 14px 0;

      color: var(--muted);

      line-height: 1.5;

      flex: 1;

    }

    .card-buttons {

      display: grid;

      grid-template-columns: 1fr auto;

      gap: 10px;

    }

    .view-btn {

      height: 48px;

      border: none;

      border-radius: 12px;

      background: #111827;

      color: white;

      font-weight: 800;

    }

    .edit-btn {

      width: 52px;

      height: 48px;

      border: 1px solid var(--border);

      border-radius: 12px;

      background: white;

      font-size: 20px;

    }

    /* EMPTY */

    .empty {

      grid-column: 1 / -1;

      background: white;

      border: 1px dashed #d1d5db;

      border-radius: 18px;

      padding: 50px 20px;

      text-align: center;

      color: var(--muted);

    }

    /* MODAL */

    .modal-overlay {

      position: fixed;

      inset: 0;

      z-index: 1000;

      display: none;

      align-items: center;

      justify-content: center;

      background: rgba(0,0,0,.6);

      padding: 20px;

    }

    .modal-overlay.show {

      display: flex;

    }

    .modal {

      width: min(780px,100%);

      max-height: 92vh;

      overflow: auto;

      background: white;

      border-radius: 22px;

      box-shadow:

        0 25px 70px rgba(0,0,0,.3);

    }

    .modal.small {

      width: min(600px,100%);

    }

    .modal-header {

      position: sticky;

      top: 0;

      z-index: 5;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 20px 22px;

      background: white;

      border-bottom: 1px solid var(--border);

    }

    .modal-header h2 {

      margin: 0;

    }

    .close-btn {

      width: 44px;

      height: 44px;

      border: none;

      border-radius: 50%;

      background: #f3f4f6;

      font-size: 22px;

    }

    .modal-body {

      padding: 22px;

    }

    /* RECETTE */

    .recipe-section {

      margin-bottom: 24px;

    }

    .recipe-section h3 {

      margin: 0 0 10px;

    }

    .recipe-text {

      white-space: pre-line;

      padding: 16px;

      background: #f9fafb;

      border: 1px solid var(--border);

      border-radius: 14px;

      line-height: 1.6;

      font-size: 17px;

    }

    .recipe-category {

      display: inline-block;

      margin-bottom: 20px;

      padding: 7px 12px;

      background: #111827;

      color: white;

      border-radius: 999px;

      font-size: 13px;

      font-weight: 700;

    }

    /* FORMULAIRE */

    .form-grid {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 18px;

    }

    .field {

      margin-bottom: 18px;

    }

    .field.full {

      grid-column: 1 / -1;

    }

    .field label {

      display: block;

      margin-bottom: 7px;

      font-weight: 800;

    }

    .field input,

    .field textarea,

    .field select {

      width: 100%;

      padding: 13px 14px;

      border: 1px solid #d1d5db;

      border-radius: 12px;

      outline: none;

    }

    .field input,

    .field select {

      min-height: 50px;

    }

    .field textarea {

      min-height: 130px;

      resize: vertical;

    }

    .form-actions {

      display: flex;

      gap: 12px;

      justify-content: flex-end;

      padding-top: 20px;

      border-top: 1px solid var(--border);

    }

    .btn {

      min-height: 50px;

      padding: 0 20px;

      border: none;

      border-radius: 12px;

      font-weight: 800;

    }

    .btn-primary {

      background: #111827;

      color: white;

    }

    .btn-secondary {

      background: #e5e7eb;

    }

    .btn-danger {

      margin-right: auto;

      background: var(--danger-bg);

      color: var(--danger);

    }

    /* CATEGORIES */

    .category-create {

      display: grid;

      grid-template-columns: 1fr auto;

      gap: 10px;

      margin-bottom: 22px;

    }

    .category-create input {

      min-height: 52px;

      padding: 0 14px;

      border: 1px solid #d1d5db;

      border-radius: 12px;

    }

    .category-create button {

      padding: 0 18px;

      border: none;

      border-radius: 12px;

      background: #111827;

      color: white;

      font-weight: 800;

    }

    .category-list {

      display: flex;

      flex-direction: column;

      gap: 10px;

    }

    .category-row {

      min-height: 54px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      padding: 10px 12px;

      background: #f9fafb;

      border: 1px solid var(--border);

      border-radius: 12px;

    }

    .category-delete {

      border: none;

      border-radius: 10px;

      padding: 9px 12px;

      background: var(--danger-bg);

      color: var(--danger);

      font-weight: 700;

    }

    .category-used {

      color: var(--muted);

      font-size: 13px;

    }

    /* TABLETTE */

    @media (min-width:700px) {

      .container {

        padding: 30px;

      }

      .cocktail-grid {

        grid-template-columns:

          repeat(2,minmax(0,1fr));

      }

      .cocktail-image {

        height: 145px;

      }

      .view-btn,

      .edit-btn {

        height: 54px;

      }

    }

    /* GRANDE TABLETTE */

    @media (min-width:1000px) {

      .brand img {

        width: 58px;

        height: 58px;

      }

      .cocktail-grid {

        grid-template-columns:

          repeat(3,minmax(0,1fr));

      }

    }

    @media (min-width:1400px) {

      .cocktail-grid {

        grid-template-columns:

          repeat(4,minmax(0,1fr));

      }

    }

    /* TELEPHONE */

    @media (max-width:699px) {

      header {

        padding-left: 12px;

        padding-right: 12px;

      }

      .brand img {

        width: 44px;

        height: 44px;

      }

      .brand-text h1 {

        font-size: 18px;

      }

      .brand-text p {

        display: none;

      }

      .header-btn {

        width: 46px;

        height: 46px;

        padding: 0;

        font-size: 0;

      }

      .category-main-btn::after {

        content: "🏷️";

        font-size: 21px;

      }

      .add-main-btn::after {

        content: "+";

        font-size: 28px;

      }

      .container {

        padding: 16px;

      }

      .toolbar {

        grid-template-columns: 1fr;

      }

      .cocktail-grid {

        grid-template-columns: 1fr;

      }

      .form-grid {

        grid-template-columns: 1fr;

      }

      .field.full {

        grid-column: auto;

      }

      .modal-overlay {

        padding: 8px;

        align-items: flex-end;

      }

    }

  </style>

</head>

<body>

<header>

  <div class="header-inner">

    <div class="brand">

      <img

        src="./icon.PNG"

        alt="Logo"

        onerror="this.style.display='none'"

      >

      <div class="brand-text">

        <h1>🥤 Recettes Boissons</h1>

        <p>Les recettes du bar</p>

      </div>

    </div>

    <div class="header-actions">

      <button

        class="header-btn category-main-btn"

        onclick="openCategoryModal()"

      >

        🏷️ Catégories

      </button>

      <button

        class="header-btn add-main-btn"

        onclick="openAddModal()"

      >

        + Ajouter

      </button>

    </div>

  </div>

</header>

<main class="container">

  <div class="toolbar">

    <div class="search-box">

      <span>🔎</span>

      <input

        id="searchInput"

        type="search"

        placeholder="Rechercher une recette..."

        oninput="renderCocktails()"

      >

    </div>

    <select

      id="categoryFilter"

      onchange="renderCocktails()"

    ></select>

    <select

      id="sortSelect"

      onchange="renderCocktails()"

    >

      <option value="numberAsc">

        Numéro : 1 → 99

      </option>

      <option value="numberDesc">

        Numéro : 99 → 1

      </option>

      <option value="alphaAsc">

        Alphabétique : A → Z

      </option>

      <option value="alphaDesc">

        Alphabétique : Z → A

      </option>

    </select>

  </div>

  <div class="stats">

    <strong id="cocktailCount">

      0

    </strong>

    recette(s)

  </div>

  <div

    id="cocktailGrid"

    class="cocktail-grid"

  ></div>

</main>

<!-- RECETTE -->

<div

  id="recipeModal"

  class="modal-overlay"

  onclick="closeOnOverlay(event,'recipeModal')"

>

  <div class="modal">

    <div class="modal-header">

      <h2 id="recipeTitle">

        Recette

      </h2>

      <button

        class="close-btn"

        onclick="closeModal('recipeModal')"

      >

        ×

      </button>

    </div>

    <div

      id="recipeBody"

      class="modal-body"

    ></div>

  </div>

</div>

<!-- AJOUT / MODIFICATION -->

<div

  id="editModal"

  class="modal-overlay"

  onclick="closeOnOverlay(event,'editModal')"

>

  <div class="modal">

    <div class="modal-header">

      <h2 id="editTitle">

        Ajouter une recette

      </h2>

      <button

        class="close-btn"

        onclick="closeModal('editModal')"

      >

        ×

      </button>

    </div>

    <div class="modal-body">

      <form

        id="cocktailForm"

        onsubmit="saveCocktail(event)"

      >

        <input

          type="hidden"

          id="editId"

        >

        <div class="form-grid">

          <div class="field">

            <label>

              N° / ordre

            </label>

            <input

              id="orderNumber"

              type="number"

              min="1"

              required

            >

          </div>

          <div class="field">

            <label>

              Nom

            </label>

            <input

              id="name"

              type="text"

              required

            >

          </div>

          <div class="field">

            <label>

              Catégorie

            </label>

            <select

              id="category"

              required

            ></select>

          </div>

          <div class="field">

            <label>

              Verre

            </label>

            <input

              id="glass"

              type="text"

            >

          </div>

          <div class="field full">

            <label>

              Décoration

            </label>

            <input

              id="garnish"

              type="text"

            >

          </div>

          <div class="field full">

            <label>

              Ingrédients

            </label>

            <textarea

              id="ingredients"

              required

            ></textarea>

          </div>

          <div class="field full">

            <label>

              Préparation

            </label>

            <textarea

              id="preparation"

              required

            ></textarea>

          </div>

          <div class="field full">

            <label>

              Notes

            </label>

            <textarea

              id="notes"

            ></textarea>

          </div>

        </div>

        <div class="form-actions">

          <button

            id="deleteBtn"

            type="button"

            class="btn btn-danger"

            onclick="deleteCocktail()"

            style="display:none"

          >

            🗑 Supprimer

          </button>

          <button

            type="button"

            class="btn btn-secondary"

            onclick="closeModal('editModal')"

          >

            Annuler

          </button>

          <button

            type="submit"

            class="btn btn-primary"

          >

            💾 Enregistrer

          </button>

        </div>

      </form>

    </div>

  </div>

</div>

<!-- CATEGORIES -->

<div

  id="categoryModal"

  class="modal-overlay"

  onclick="closeOnOverlay(event,'categoryModal')"

>

  <div class="modal small">

    <div class="modal-header">

      <h2>

        🏷️ Mes catégories

      </h2>

      <button

        class="close-btn"

        onclick="closeModal('categoryModal')"

      >

        ×

      </button>

    </div>

    <div class="modal-body">

      <div class="category-create">

        <input

          id="newCategoryInput"

          type="text"

          placeholder="Nouvelle catégorie..."

          maxlength="40"

          onkeydown="categoryEnter(event)"

        >

        <button

          onclick="addCategory()"

        >

          + Ajouter

        </button>

      </div>

      <div

        id="categoryList"

        class="category-list"

      ></div>

    </div>

  </div>

</div>

<script>

const COCKTAIL_STORAGE =

  "recettesBoissonsMamyMoussV3";

const CATEGORY_STORAGE =

  "recettesBoissonsCategoriesV3";

const defaultCategories = [

  "Classique",

  "Signature",

  "Sans alcool",

  "Jus",

  "Soda",

  "Café",

  "Autre"

];

const defaultCocktails = [

  {

    id: "virgin-mojito",

    orderNumber: 1,

    name: "Virgin Mojito",

    category: "Sans alcool",

    glass: "Highball",

    garnish: "Menthe et citron vert",

    ingredients:

`Citron vert

Menthe

Sirop de sucre

Eau pétillante

Glace pilée`,

    preparation:

`Ajouter les ingrédients dans le verre et mélanger.`,

    notes: ""

  },

  {

    id: "citronnade",

    orderNumber: 2,

    name: "Citronnade",

    category: "Sans alcool",

    glass: "Highball",

    garnish: "Citron",

    ingredients:

`Jus de citron

Sirop de sucre

Eau

Glaçons`,

    preparation:

`Ajouter les ingrédients dans le verre et mélanger.`,

    notes: ""

  }

];

function generateId() {

  return (

    "recette-" +

    Date.now() +

    "-" +

    Math.random()

      .toString(36)

      .slice(2,8)

  );

}

function loadCocktails() {

  const saved =

    localStorage.getItem(

      COCKTAIL_STORAGE

    );

  if (saved) {

    try {

      const parsed =

        JSON.parse(saved);

      if (

        Array.isArray(parsed)

      ) {

        return parsed;

      }

    }

    catch {}

  }

  const copy =

    JSON.parse(

      JSON.stringify(

        defaultCocktails

      )

    );

  localStorage.setItem(

    COCKTAIL_STORAGE,

    JSON.stringify(copy)

  );

  return copy;

}

function loadCategories() {

  const saved =

    localStorage.getItem(

      CATEGORY_STORAGE

    );

  if (saved) {

    try {

      const parsed =

        JSON.parse(saved);

      if (

        Array.isArray(parsed)

      ) {

        return parsed;

      }

    }

    catch {}

  }

  const copy =

    [...defaultCategories];

  localStorage.setItem(

    CATEGORY_STORAGE,

    JSON.stringify(copy)

  );

  return copy;

}

let cocktails =

  loadCocktails();

let categories =

  loadCategories();

function saveCocktailsStorage() {

  localStorage.setItem(

    COCKTAIL_STORAGE,

    JSON.stringify(cocktails)

  );

}

function saveCategoriesStorage() {

  localStorage.setItem(

    CATEGORY_STORAGE,

    JSON.stringify(categories)

  );

}

function refreshCategorySelectors() {

  const filter =

    document.getElementById(

      "categoryFilter"

    );

  const categorySelect =

    document.getElementById(

      "category"

    );

  const oldFilter =

    filter.value;

  const oldCategory =

    categorySelect.value;

  filter.innerHTML =

    `<option value="">

      Toutes les catégories

    </option>`;

  categorySelect.innerHTML =

    "";

  categories

    .slice()

    .sort(

      (a,b) =>

        a.localeCompare(

          b,

          "fr"

        )

    )

    .forEach(

      category => {

        const a =

          document.createElement(

            "option"

          );

        a.value =

          category;

        a.textContent =

          category;

        filter.appendChild(a);

        const b =

          document.createElement(

            "option"

          );

        b.value =

          category;

        b.textContent =

          category;

        categorySelect.appendChild(b);

      }

    );

  if (

    categories.includes(

      oldFilter

    )

  ) {

    filter.value =

      oldFilter;

  }

  if (

    categories.includes(

      oldCategory

    )

  ) {

    categorySelect.value =

      oldCategory;

  }

}

function renderCocktails() {

  const search =

    document

      .getElementById(

        "searchInput"

      )

      .value

      .trim()

      .toLowerCase();

  const category =

    document

      .getElementById(

        "categoryFilter"

      )

      .value;

  const sort =

    document

      .getElementById(

        "sortSelect"

      )

      .value;

  let filtered =

    cocktails.filter(

      cocktail => {

        const text =

          [

            cocktail.name,

            cocktail.category,

            cocktail.ingredients,

            cocktail.notes,

            cocktail.orderNumber

          ]

          .join(" ")

          .toLowerCase();

        return (

          (!search ||

            text.includes(search))

          &&

          (!category ||

            cocktail.category === category)

        );

      }

    );

  filtered.sort(

    (a,b) => {

      if (

        sort === "alphaAsc"

      ) {

        return a.name.localeCompare(

          b.name,

          "fr"

        );

      }

      if (

        sort === "alphaDesc"

      ) {

        return b.name.localeCompare(

          a.name,

          "fr"

        );

      }

      if (

        sort === "numberDesc"

      ) {

        return (

          Number(b.orderNumber) -

          Number(a.orderNumber)

        );

      }

      return (

        Number(a.orderNumber) -

        Number(b.orderNumber)

      );

    }

  );

  document.getElementById(

    "cocktailCount"

  ).textContent =

    filtered.length;

  const grid =

    document.getElementById(

      "cocktailGrid"

    );

  if (!filtered.length) {

    grid.innerHTML =

      `<div class="empty">

        🥤<br><br>

        Aucune recette trouvée.

      </div>`;

    return;

  }

  grid.innerHTML =

    filtered.map(

      cocktail => `

      <article class="cocktail-card">

        <div class="order-badge">

          ${escapeHtml(

            cocktail.orderNumber

          )}

        </div>

        <div class="cocktail-image">

          🥤

        </div>

        <div class="cocktail-content">

          <div class="cocktail-top">

            <h2 class="cocktail-name">

              ${escapeHtml(

                cocktail.name

              )}

            </h2>

            <span class="category-badge">

              ${escapeHtml(

                cocktail.category

              )}

            </span>

          </div>

          <div class="ingredients-preview">

            ${escapeHtml(

              cocktail.ingredients

                .split("\n")

                .filter(Boolean)

                .slice(0,3)

                .join(" • ")

            )}

          </div>

          <div class="card-buttons">

            <button

              class="view-btn"

              onclick="viewCocktail('${cocktail.id}')"

            >

              Voir la recette

            </button>

            <button

              class="edit-btn"

              onclick="editCocktail('${cocktail.id}')"

            >

              ✏️

            </button>

          </div>

        </div>

      </article>

    `).join("");

}

function viewCocktail(id) {

  const cocktail =

    cocktails.find(

      item =>

        item.id === id

    );

  if (!cocktail) return;

  document.getElementById(

    "recipeTitle"

  ).textContent =

    cocktail.name;

  document.getElementById(

    "recipeBody"

  ).innerHTML = `

    <span class="recipe-category">

      N° ${escapeHtml(

        cocktail.orderNumber

      )}

      ·

      ${escapeHtml(

        cocktail.category

      )}

    </span>

    ${

      cocktail.glass

      ?

      `

      <div class="recipe-section">

        <h3>

          🥤 Verre

        </h3>

        <div class="recipe-text">

          ${escapeHtml(

            cocktail.glass

          )}

        </div>

      </div>

      `

      :

      ""

    }

    <div class="recipe-section">

      <h3>

        Ingrédients

      </h3>

      <div class="recipe-text">

        ${escapeHtml(

          cocktail.ingredients

        )}

      </div>

    </div>

    <div class="recipe-section">

      <h3>

        Préparation

      </h3>

      <div class="recipe-text">

        ${escapeHtml(

          cocktail.preparation

        )}

      </div>

    </div>

    ${

      cocktail.garnish

      ?

      `

      <div class="recipe-section">

        <h3>

          Décoration

        </h3>

        <div class="recipe-text">

          ${escapeHtml(

            cocktail.garnish

          )}

        </div>

      </div>

      `

      :

      ""

    }

    ${

      cocktail.notes

      ?

      `

      <div class="recipe-section">

        <h3>

          Notes

        </h3>

        <div class="recipe-text">

          ${escapeHtml(

            cocktail.notes

          )}

        </div>

      </div>

      `

      :

      ""

    }

  `;

  openModal(

    "recipeModal"

  );

}

function openAddModal() {

  document

    .getElementById(

      "cocktailForm"

    )

    .reset();

  document.getElementById(

    "editId"

  ).value =

    "";

  document.getElementById(

    "editTitle"

  ).textContent =

    "Ajouter une recette";

  document.getElementById(

    "deleteBtn"

  ).style.display =

    "none";

  const maxNumber =

    cocktails.reduce(

      (max,item) =>

        Math.max(

          max,

          Number(

            item.orderNumber

          ) || 0

        ),

      0

    );

  document.getElementById(

    "orderNumber"

  ).value =

    maxNumber + 1;

  refreshCategorySelectors();

  openModal(

    "editModal"

  );

}

function editCocktail(id) {

  const cocktail =

    cocktails.find(

      item =>

        item.id === id

    );

  if (!cocktail) return;

  refreshCategorySelectors();

  document.getElementById(

    "editId"

  ).value =

    cocktail.id;

  document.getElementById(

    "editTitle"

  ).textContent =

    "Modifier la recette";

  document.getElementById(

    "orderNumber"

  ).value =

    cocktail.orderNumber;

  document.getElementById(

    "name"

  ).value =

    cocktail.name;

  document.getElementById(

    "category"

  ).value =

    cocktail.category;

  document.getElementById(

    "glass"

  ).value =

    cocktail.glass || "";

  document.getElementById(

    "garnish"

  ).value =

    cocktail.garnish || "";

  document.getElementById(

    "ingredients"

  ).value =

    cocktail.ingredients || "";

  document.getElementById(

    "preparation"

  ).value =

    cocktail.preparation || "";

  document.getElementById(

    "notes"

  ).value =

    cocktail.notes || "";

  document.getElementById(

    "deleteBtn"

  ).style.display =

    "block";

  openModal(

    "editModal"

  );

}

function saveCocktail(event) {

  event.preventDefault();

  const id =

    document.getElementById(

      "editId"

    ).value;

  const cocktail = {

    id:

      id ||

      generateId(),

    orderNumber:

      Math.max(

        1,

        Number(

          document.getElementById(

            "orderNumber"

          ).value

        ) || 1

      ),

    name:

      document.getElementById(

        "name"

      ).value.trim(),

    category:

      document.getElementById(

        "category"

      ).value,

    glass:

      document.getElementById(

        "glass"

      ).value.trim(),

    garnish:

      document.getElementById(

        "garnish"

      ).value.trim(),

    ingredients:

      document.getElementById(

        "ingredients"

      ).value.trim(),

    preparation:

      document.getElementById(

        "preparation"

      ).value.trim(),

    notes:

      document.getElementById(

        "notes"

      ).value.trim()

  };

  if (id) {

    const index =

      cocktails.findIndex(

        item =>

          item.id === id

      );

    if (

      index !== -1

    ) {

      cocktails[index] =

        cocktail;

    }

  }

  else {

    cocktails.push(

      cocktail

    );

  }

  saveCocktailsStorage();

  closeModal(

    "editModal"

  );

  renderCocktails();

}

function deleteCocktail() {

  const id =

    document.getElementById(

      "editId"

    ).value;

  if (!id) return;

  if (

    !confirm(

      "Supprimer cette recette ?"

    )

  ) {

    return;

  }

  cocktails =

    cocktails.filter(

      item =>

        item.id !== id

    );

  saveCocktailsStorage();

  closeModal(

    "editModal"

  );

  renderCocktails();

}

function openCategoryModal() {

  renderCategoryList();

  openModal(

    "categoryModal"

  );

}

function categoryEnter(event) {

  if (

    event.key === "Enter"

  ) {

    event.preventDefault();

    addCategory();

  }

}

function addCategory() {

  const input =

    document.getElementById(

      "newCategoryInput"

    );

  const value =

    input.value.trim();

  if (!value) return;

  const exists =

    categories.some(

      item =>

        item.toLowerCase() ===

        value.toLowerCase()

    );

  if (exists) {

    alert(

      "Cette catégorie existe déjà."

    );

    return;

  }

  categories.push(value);

  categories.sort(

    (a,b) =>

      a.localeCompare(

        b,

        "fr"

      )

  );

  input.value =

    "";

  saveCategoriesStorage();

  refreshCategorySelectors();

  renderCategoryList();

  renderCocktails();

}

function renderCategoryList() {

  const list =

    document.getElementById(

      "categoryList"

    );

  list.innerHTML =

    categories.map(

      category => {

        const count =

          cocktails.filter(

            item =>

              item.category === category

          ).length;

        return `

          <div class="category-row">

            <strong>

              ${escapeHtml(

                category

              )}

            </strong>

            ${

              count

              ?

              `

              <span class="category-used">

                ${count} recette(s)

              </span>

              `

              :

              `

              <button

                class="category-delete"

                onclick="deleteCategory('${escapeJs(category)}')"

              >

                Supprimer

              </button>

              `

            }

          </div>

        `;

      }

    )

    .join("");

}

function deleteCategory(category) {

  const used =

    cocktails.some(

      item =>

        item.category === category

    );

  if (used) {

    alert(

      "Cette catégorie est utilisée par une recette."

    );

    return;

  }

  if (

    !confirm(

      `Supprimer "${category}" ?`

    )

  ) {

    return;

  }

  categories =

    categories.filter(

      item =>

        item !== category

    );

  saveCategoriesStorage();

  refreshCategorySelectors();

  renderCategoryList();

}

function openModal(id) {

  document

    .getElementById(id)

    .classList.add(

      "show"

    );

  document.body.style.overflow =

    "hidden";

}

function closeModal(id) {

  document

    .getElementById(id)

    .classList.remove(

      "show"

    );

  if (

    !document.querySelector(

      ".modal-overlay.show"

    )

  ) {

    document.body.style.overflow =

      "";

  }

}

function closeOnOverlay(

  event,

  id

) {

  if (

    event.target.id === id

  ) {

    closeModal(id);

  }

}

function escapeHtml(value) {

  return String(

    value ?? ""

  )

  .replaceAll(

    "&",

    "&amp;"

  )

  .replaceAll(

    "<",

    "&lt;"

  )

  .replaceAll(

    ">",

    "&gt;"

  )

  .replaceAll(

    '"',

    "&quot;"

  )

  .replaceAll(

    "'",

    "&#039;"

  );

}

function escapeJs(value) {

  return String(value)

    .replaceAll(

      "\\",

      "\\\\"

    )

    .replaceAll(

      "'",

      "\\'"

    );

}

/* DÉMARRAGE */

refreshCategorySelectors();

renderCocktails();

</script>

</body>
