<!DOCTYPE html>

<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, viewport-fit=cover"

  >

  <meta name="theme-color" content="#111827">

  <title>Recettes Cocktails</title>

  <!-- PWA -->

  <link rel="manifest" href="./manifest.json">

  <!-- ICÔNE -->

  <link rel="apple-touch-icon" href="./icon.PNG">

  <link rel="icon" type="image/png" href="./icon.PNG">

  <style>

    :root {

      --bg:#f3f4f6;

      --card:#ffffff;

      --text:#111827;

      --muted:#6b7280;

      --border:#e5e7eb;

      --accent:#111827;

      --danger:#b91c1c;

      --danger-bg:#fee2e2;

      --shadow:0 8px 25px rgba(0,0,0,.08);

    }

    * {

      box-sizing:border-box;

    }

    html {

      -webkit-text-size-adjust:100%;

    }

    body {

      margin:0;

      min-height:100vh;

      font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        Roboto,

        Helvetica,

        Arial,

        sans-serif;

      background:var(--bg);

      color:var(--text);

    }

    button,

    input,

    textarea,

    select {

      font:inherit;

    }

    button {

      cursor:pointer;

      touch-action:manipulation;

    }

    /* =====================================================

       HEADER

    ===================================================== */

    header {

      position:sticky;

      top:0;

      z-index:50;

      background:rgba(17,24,39,.97);

      color:white;

      padding:

        calc(14px + env(safe-area-inset-top))

        20px

        14px;

      box-shadow:

        0 4px 15px rgba(0,0,0,.15);

    }

    .header-inner {

      width:100%;

      max-width:1500px;

      margin:auto;

      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:20px;

    }

    .brand {

      display:flex;

      align-items:center;

      gap:14px;

      min-width:0;

    }

    .brand img {

      width:52px;

      height:52px;

      flex-shrink:0;

      object-fit:cover;

      border-radius:14px;

      background:white;

    }

    .brand-text {

      min-width:0;

    }

    .brand-text h1 {

      margin:0;

      font-size:24px;

      white-space:nowrap;

      overflow:hidden;

      text-overflow:ellipsis;

    }

    .brand-text p {

      margin:3px 0 0;

      color:#d1d5db;

      font-size:14px;

    }

    .header-actions {

      display:flex;

      align-items:center;

      gap:10px;

      flex-shrink:0;

    }

    .header-btn {

      border:none;

      min-height:48px;

      padding:0 18px;

      border-radius:12px;

      font-weight:800;

      font-size:15px;

    }

    .category-main-btn {

      background:#374151;

      color:white;

      border:1px solid #4b5563;

    }

    .add-main-btn {

      background:white;

      color:#111827;

    }

    /* =====================================================

       CONTAINER

    ===================================================== */

    .container {

      width:100%;

      max-width:1500px;

      margin:auto;

      padding:24px;

    }

    /* =====================================================

       BARRE RECHERCHE

    ===================================================== */

    .toolbar {

      display:grid;

      grid-template-columns:

        minmax(250px,1fr)

        minmax(180px,230px)

        minmax(180px,230px);

      gap:14px;

      margin-bottom:20px;

    }

    .search-box {

      position:relative;

    }

    .search-box span {

      position:absolute;

      left:17px;

      top:50%;

      transform:translateY(-50%);

      font-size:20px;

      pointer-events:none;

    }

    .search-box input,

    .toolbar select {

      width:100%;

      height:56px;

      border:1px solid var(--border);

      border-radius:14px;

      background:white;

      color:var(--text);

      font-size:17px;

      outline:none;

      box-shadow:

        0 2px 8px rgba(0,0,0,.04);

    }

    .search-box input {

      padding:0 18px 0 50px;

    }

    .toolbar select {

      padding:0 14px;

    }

    input:focus,

    textarea:focus,

    select:focus {

      border-color:#4b5563 !important;

      box-shadow:

        0 0 0 3px rgba(17,24,39,.08);

    }

    /* =====================================================

       COMPTEUR

    ===================================================== */

    .stats {

      display:flex;

      align-items:center;

      justify-content:space-between;

      margin-bottom:18px;

      color:var(--muted);

      font-size:15px;

    }

    .stats strong {

      color:var(--text);

    }

    /* =====================================================

       CARTES

    ===================================================== */

    .cocktail-grid {

      display:grid;

      grid-template-columns:

        repeat(

          auto-fill,

          minmax(280px,1fr)

        );

      gap:20px;

    }

    .cocktail-card {

      position:relative;

      overflow:hidden;

      background:var(--card);

      border:1px solid var(--border);

      border-radius:18px;

      box-shadow:var(--shadow);

      display:flex;

      flex-direction:column;

      min-height:310px;

    }

    .order-badge {

      position:absolute;

      top:12px;

      left:12px;

      z-index:2;

      min-width:38px;

      height:38px;

      padding:0 10px;

      display:flex;

      align-items:center;

      justify-content:center;

      border-radius:999px;

      background:rgba(255,255,255,.95);

      color:#111827;

      font-weight:900;

      box-shadow:

        0 3px 10px rgba(0,0,0,.15);

    }

    .cocktail-image {

      height:125px;

      display:flex;

      align-items:center;

      justify-content:center;

      background:

        linear-gradient(

          135deg,

          #111827,

          #374151

        );

      color:white;

      font-size:54px;

    }

    .cocktail-content {

      padding:18px;

      display:flex;

      flex-direction:column;

      flex:1;

    }

    .cocktail-top {

      display:flex;

      justify-content:space-between;

      align-items:flex-start;

      gap:12px;

    }

    .cocktail-name {

      margin:0;

      font-size:21px;

      line-height:1.15;

    }

    .category-badge {

      flex-shrink:0;

      display:inline-flex;

      align-items:center;

      max-width:140px;

      overflow:hidden;

      white-space:nowrap;

      text-overflow:ellipsis;

      background:#f3f4f6;

      color:#4b5563;

      padding:6px 9px;

      border-radius:999px;

      font-size:12px;

      font-weight:700;

    }

    .ingredients-preview {

      margin:14px 0;

      color:var(--muted);

      line-height:1.5;

      font-size:15px;

      flex:1;

    }

    .card-buttons {

      display:grid;

      grid-template-columns:

        1fr auto;

      gap:10px;

    }

    .view-btn {

      height:48px;

      border:none;

      border-radius:12px;

      background:var(--accent);

      color:white;

      font-weight:800;

      font-size:15px;

    }

    .edit-btn {

      min-width:52px;

      height:48px;

      border:1px solid var(--border);

      border-radius:12px;

      background:white;

      color:var(--text);

      font-size:20px;

    }

    /* =====================================================

       AUCUNE RECETTE

    ===================================================== */

    .empty {

      grid-column:1 / -1;

      background:white;

      border:1px dashed #d1d5db;

      border-radius:18px;

      padding:50px 20px;

      text-align:center;

      color:var(--muted);

    }

    .empty-icon {

      font-size:55px;

      margin-bottom:10px;

    }

    /* =====================================================

       MODALS

       CORRECTION TABLETTE

    ===================================================== */

    .modal-overlay {

      position:fixed !important;

      top:0;

      right:0;

      bottom:0;

      left:0;

      width:100vw;

      height:100dvh;

      z-index:9999;

      background:rgba(0,0,0,.60);

      display:none;

      overflow-y:auto;

      padding:

        max(20px,env(safe-area-inset-top))

        max(20px,env(safe-area-inset-right))

        max(20px,env(safe-area-inset-bottom))

        max(20px,env(safe-area-inset-left));

    }

    .modal-overlay.show {

      display:grid !important;

      place-items:center;

    }

    .modal {

      position:relative;

      width:min(780px,calc(100vw - 40px));

      max-height:

        calc(100dvh - 40px);

      margin:auto;

      background:white;

      border-radius:22px;

      overflow:auto;

      box-shadow:

        0 25px 70px rgba(0,0,0,.30);

    }

    .modal.small {

      width:min(600px,calc(100vw - 40px));

    }

    .modal-header {

      position:sticky;

      top:0;

      z-index:5;

      background:white;

      border-bottom:

        1px solid var(--border);

      padding:20px 22px;

      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:15px;

    }

    .modal-header h2 {

      margin:0;

      font-size:24px;

    }

    .close-btn {

      width:44px;

      height:44px;

      flex-shrink:0;

      border:none;

      border-radius:50%;

      background:#f3f4f6;

      font-size:22px;

      font-weight:bold;

    }

    .modal-body {

      padding:22px;

    }

    /* =====================================================

       RECETTE

    ===================================================== */

    .recipe-section {

      margin-bottom:26px;

    }

    .recipe-section:last-child {

      margin-bottom:0;

    }

    .recipe-section h3 {

      margin:0 0 10px;

      font-size:18px;

    }

    .recipe-text {

      white-space:pre-line;

      background:#f9fafb;

      border:1px solid var(--border);

      border-radius:14px;

      padding:16px;

      line-height:1.6;

      font-size:17px;

    }

    .recipe-category {

      display:inline-block;

      background:#111827;

      color:white;

      padding:7px 12px;

      border-radius:999px;

      font-size:13px;

      font-weight:700;

      margin-bottom:20px;

    }

    /* =====================================================

       FORMULAIRE

    ===================================================== */

    .form-grid {

      display:grid;

      grid-template-columns:

        1fr 1fr;

      gap:18px;

    }

    .field {

      margin-bottom:18px;

    }

    .field.full {

      grid-column:1 / -1;

    }

    .field label {

      display:block;

      margin-bottom:7px;

      font-weight:800;

      font-size:14px;

    }

    .field input,

    .field textarea,

    .field select {

      width:100%;

      border:1px solid #d1d5db;

      border-radius:12px;

      padding:13px 14px;

      outline:none;

      background:white;

      color:var(--text);

      font-size:16px;

    }

    .field input,

    .field select {

      min-height:50px;

    }

    .field textarea {

      min-height:130px;

      resize:vertical;

      line-height:1.5;

    }

    .form-actions {

      display:flex;

      gap:12px;

      justify-content:flex-end;

      border-top:

        1px solid var(--border);

      padding-top:20px;

      margin-top:5px;

    }

    .btn {

      min-height:50px;

      border:none;

      border-radius:12px;

      padding:0 20px;

      font-weight:800;

      font-size:15px;

    }

    .btn-primary {

      background:var(--accent);

      color:white;

    }

    .btn-secondary {

      background:#e5e7eb;

      color:var(--text);

    }

    .btn-danger {

      background:var(--danger-bg);

      color:var(--danger);

      margin-right:auto;

    }

    /* =====================================================

       CATEGORIES

    ===================================================== */

    .category-create {

      display:grid;

      grid-template-columns:

        1fr auto;

      gap:10px;

      margin-bottom:22px;

    }

    .category-create input {

      width:100%;

      min-height:52px;

      padding:0 14px;

      border:1px solid #d1d5db;

      border-radius:12px;

      outline:none;

    }

    .category-create button {

      min-height:52px;

      padding:0 18px;

      border:none;

      border-radius:12px;

      background:#111827;

      color:white;

      font-weight:800;

    }

    .category-list {

      display:flex;

      flex-direction:column;

      gap:10px;

    }

    .category-row {

      min-height:54px;

      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:12px;

      padding:10px 12px;

      background:#f9fafb;

      border:1px solid var(--border);

      border-radius:12px;

    }

    .category-row strong {

      min-width:0;

      overflow:hidden;

      text-overflow:ellipsis;

      white-space:nowrap;

    }

    .category-delete {

      flex-shrink:0;

      border:none;

      border-radius:10px;

      background:var(--danger-bg);

      color:var(--danger);

      padding:9px 12px;

      font-weight:700;

    }

    .category-used {

      flex-shrink:0;

      color:var(--muted);

      font-size:13px;

    }

    /* =====================================================

       TABLETTE

    ===================================================== */

    @media (min-width:700px) {

      .container {

        padding:30px;

      }

      .cocktail-grid {

        grid-template-columns:

          repeat(

            2,

            minmax(0,1fr)

          );

      }

      .cocktail-card {

        min-height:320px;

      }

      .cocktail-image {

        height:145px;

      }

      .view-btn,

      .edit-btn {

        height:54px;

      }

      .modal {

        width:min(780px,90vw);

      }

      .modal.small {

        width:min(600px,90vw);

      }

    }

    /* =====================================================

       GRANDE TABLETTE

    ===================================================== */

    @media (min-width:1000px) {

      header {

        padding-left:30px;

        padding-right:30px;

      }

      .brand img {

        width:58px;

        height:58px;

      }

      .brand-text h1 {

        font-size:27px;

      }

      .header-btn {

        min-height:54px;

        padding:0 22px;

      }

      .cocktail-grid {

        grid-template-columns:

          repeat(

            3,

            minmax(0,1fr)

          );

      }

    }

    @media (min-width:1400px) {

      .cocktail-grid {

        grid-template-columns:

          repeat(

            4,

            minmax(0,1fr)

          );

      }

    }

    /* =====================================================

       TELEPHONE

    ===================================================== */

    @media (max-width:699px) {

      header {

        padding-left:12px;

        padding-right:12px;

      }

      .header-inner {

        gap:8px;

      }

      .brand {

        gap:9px;

      }

      .brand img {

        width:44px;

        height:44px;

        border-radius:11px;

      }

      .brand-text h1 {

        font-size:18px;

      }

      .brand-text p {

        display:none;

      }

      .header-actions {

        gap:6px;

      }

      .header-btn {

        width:46px;

        height:46px;

        min-height:46px;

        padding:0;

        font-size:0;

      }

      .category-main-btn::after {

        content:"🏷️";

        font-size:21px;

      }

      .add-main-btn::after {

        content:"+";

        font-size:28px;

      }

      .container {

        padding:16px;

      }

      .toolbar {

        grid-template-columns:1fr;

        gap:10px;

      }

      .search-box input,

      .toolbar select {

        height:52px;

      }

      .cocktail-grid {

        grid-template-columns:1fr;

        gap:15px;

      }

      .cocktail-card {

        min-height:auto;

      }

      .cocktail-image {

        height:105px;

      }

      .form-grid {

        grid-template-columns:1fr;

      }

      .field.full {

        grid-column:auto;

      }

      .form-actions {

        flex-wrap:wrap;

      }

      .btn {

        flex:1;

      }

      .btn-danger {

        flex-basis:100%;

        order:3;

      }

      /*

        IMPORTANT :

        même sur téléphone la fenêtre reste

        correctement centrée.

      */

      .modal-overlay.show {

        display:grid !important;

        place-items:center;

      }

      .modal-overlay {

        padding:12px;

      }

      .modal,

      .modal.small {

        width:calc(100vw - 24px);

        max-height:

          calc(100dvh - 24px);

        margin:auto;

        border-radius:18px;

      }

      .category-create {

        grid-template-columns:1fr;

      }

    }

  </style>

</head>

<body>

<header>

  <div class="header-inner">

    <div class="brand">

      <!-- NOUVELLE ICÔNE -->

      <img

        src="./icon.PNG"

        alt="Logo Recettes Cocktails"

        onerror="this.style.display='none'"

      >

      <div class="brand-text">

        <h1>

          🍹 Recettes Cocktails

        </h1>

        <p>

          Les recettes du bar

        </p>

      </div>

    </div>

    <div class="header-actions">

      <button

        class="header-btn category-main-btn"

        onclick="openCategoryModal()"

      >

        🏷️ Catégories

      </button>

      <button

        class="header-btn add-main-btn"

        onclick="openAddModal()"

      >

        + Ajouter

      </button>

    </div>

  </div>

</header>

<main class="container">

  <div class="toolbar">

    <div class="search-box">

      <span>

        🔎

      </span>

      <input

        id="searchInput"

        type="search"

        placeholder="Rechercher une recette..."

        autocomplete="off"

        oninput="renderCocktails()"

      >

    </div>

    <select

      id="categoryFilter"

      onchange="renderCocktails()"

    >

    </select>

    <select

      id="sortSelect"

      onchange="renderCocktails()"

    >

      <option value="numberAsc">

        Numéro : 1 → 99

      </option>

      <option value="numberDesc">

        Numéro : 99 → 1

      </option>

      <option value="alphaAsc">

        Alphabétique : A → Z

      </option>

      <option value="alphaDesc">

        Alphabétique : Z → A

      </option>

    </select>

  </div>

  <div class="stats">

    <div>

      <strong id="cocktailCount">

        0

      </strong>

      recette(s)

    </div>

  </div>

  <div

    id="cocktailGrid"

    class="cocktail-grid"

  >

  </div>

</main>

<!-- =====================================================

     MODAL VOIR RECETTE

===================================================== -->

<div

  id="recipeModal"

  class="modal-overlay"

  onclick="closeOnOverlay(event,'recipeModal')"

>

  <div class="modal">

    <div class="modal-header">

      <h2 id="recipeTitle">

        Recette

      </h2>

      <button

        class="close-btn"

        onclick="closeModal('recipeModal')"

      >

        ×

      </button>

    </div>

    <div

      id="recipeBody"

      class="modal-body"

    >

    </div>

  </div>

</div>

<!-- =====================================================

     MODAL AJOUTER / MODIFIER

===================================================== -->

<div

  id="editModal"

  class="modal-overlay"

  onclick="closeOnOverlay(event,'editModal')"

>

  <div class="modal">

    <div class="modal-header">

      <h2 id="editTitle">

        Ajouter une recette

      </h2>

      <button

        class="close-btn"

        onclick="closeModal('editModal')"

      >

        ×

      </button>

    </div>

    <div class="modal-body">

      <form

        id="cocktailForm"

        onsubmit="saveCocktail(event)"

      >

        <input

          type="hidden"

          id="editId"

        >

        <div class="form-grid">

          <div class="field">

            <label for="orderNumber">

              N° / ordre

            </label>

            <input

              id="orderNumber"

              type="number"

              min="1"

              step="1"

              placeholder="Ex. 1"

              required

            >

          </div>

          <div class="field">

            <label for="name">

              Nom

            </label>

            <input

              id="name"

              type="text"

              required

            >

          </div>

          <div class="field">

            <label for="category">

              Catégorie

            </label>

            <select

              id="category"

              required

            >

            </select>

          </div>

          <div class="field">

            <label for="glass">

              Verre

            </label>

            <input

              id="glass"

              type="text"

            >

          </div>

          <div class="field full">

            <label for="garnish">

              Décoration

            </label>

            <input

              id="garnish"

              type="text"

            >

          </div>

          <div class="field full">

            <label for="ingredients">

              Ingrédients

            </label>

            <textarea

              id="ingredients"

              required

            ></textarea>

          </div>

          <div class="field full">

            <label for="preparation">

              Préparation

            </label>

            <textarea

              id="preparation"

              required

            ></textarea>

          </div>

          <div class="field full">

            <label for="notes">

              Notes

            </label>

            <textarea

              id="notes"

            ></textarea>

          </div>

        </div>

        <div class="form-actions">

          <button

            id="deleteBtn"

            type="button"

            class="btn btn-danger"

            onclick="deleteCocktail()"

            style="display:none;"

          >

            🗑 Supprimer

          </button>

          <button

            type="button"

            class="btn btn-secondary"

            onclick="closeModal('editModal')"

          >

            Annuler

          </button>

          <button

            type="submit"

            class="btn btn-primary"

          >

            💾 Enregistrer

          </button>

        </div>

      </form>

    </div>

  </div>

</div>

<!-- =====================================================

     CATEGORIES

===================================================== -->

<div

  id="categoryModal"

  class="modal-overlay"

  onclick="closeOnOverlay(event,'categoryModal')"

>

  <div class="modal small">

    <div class="modal-header">

      <h2>

        🏷️ Mes catégories

      </h2>

      <button

        class="close-btn"

        onclick="closeModal('categoryModal')"

      >

        ×

      </button>

    </div>

    <div class="modal-body">

      <div class="category-create">

        <input

          id="newCategoryInput"

          type="text"

          placeholder="Nouvelle catégorie..."

          maxlength="40"

          onkeydown="categoryEnter(event)"

        >

        <button

          type="button"

          onclick="addCategory()"

        >

          + Ajouter

        </button>

      </div>

      <div

        id="categoryList"

        class="category-list"

      >

      </div>

    </div>

  </div>

</div>

<script>

/* =====================================================

   STOCKAGE

===================================================== */

const COCKTAIL_STORAGE =

  "recettesCocktailsMamyMoussV2";

const OLD_COCKTAIL_STORAGE =

  "recettesCocktailsMamyMoussV1";

const CATEGORY_STORAGE =

  "recettesCocktailsCategoriesV2";

const defaultCategories = [

  "Classique",

  "Signature",

  "Sans alcool",

  "Maison",

  "Autre"

];

/*

  Aucune recette imposée ici.

  Tes recettes déjà enregistrées dans

  le navigateur restent conservées

  grâce aux mêmes clés V2.

*/

const defaultCocktails = [];

/* =====================================================

   CHARGEMENT

===================================================== */

function loadCocktails() {

  let saved =

    localStorage.getItem(

      COCKTAIL_STORAGE

    );

  if (!saved) {

    saved =

      localStorage.getItem(

        OLD_COCKTAIL_STORAGE

      );

  }

  let data;

  if (saved) {

    try {

      data =

        JSON.parse(saved);

    }

    catch {

      data = null;

    }

  }

  if (!Array.isArray(data)) {

    data =

      JSON.parse(

        JSON.stringify(

          defaultCocktails

        )

      );

  }

  data =

    data.map(

      (item,index) => ({

        ...item,

        id:

          item.id ||

          generateId(),

        orderNumber:

          Number(

            item.orderNumber

          ) ||

          index + 1,

        name:

          item.name || "",

        category:

          item.category ||

          "Autre",

        glass:

          item.glass || "",

        garnish:

          item.garnish || "",

        ingredients:

          item.ingredients || "",

        preparation:

          item.preparation || "",

        notes:

          item.notes || ""

      })

    );

  localStorage.setItem(

    COCKTAIL_STORAGE,

    JSON.stringify(data)

  );

  return data;

}

function loadCategories() {

  const saved =

    localStorage.getItem(

      CATEGORY_STORAGE

    );

  let list;

  if (saved) {

    try {

      list =

        JSON.parse(saved);

    }

    catch {

      list = null;

    }

  }

  if (!Array.isArray(list)) {

    list =

      [...defaultCategories];

  }

  cocktails.forEach(

    item => {

      if (

        item.category &&

        !list.includes(

          item.category

        )

      ) {

        list.push(

          item.category

        );

      }

    }

  );

  list =

    [...new Set(list)]

      .filter(Boolean)

      .sort(

        (a,b) =>

          a.localeCompare(

            b,

            "fr"

          )

      );

  localStorage.setItem(

    CATEGORY_STORAGE,

    JSON.stringify(list)

  );

  return list;

}

let cocktails =

  loadCocktails();

let categories =

  loadCategories();

/* =====================================================

   SAUVEGARDE

===================================================== */

function saveCocktailsStorage() {

  localStorage.setItem(

    COCKTAIL_STORAGE,

    JSON.stringify(cocktails)

  );

}

function saveCategoriesStorage() {

  localStorage.setItem(

    CATEGORY_STORAGE,

    JSON.stringify(categories)

  );

}

/* =====================================================

   CATEGORIES SELECT

===================================================== */

function refreshCategorySelectors() {

  const filter =

    document.getElementById(

      "categoryFilter"

    );

  const recipeSelect =

    document.getElementById(

      "category"

    );

  const selectedFilter =

    filter.value;

  const selectedRecipe =

    recipeSelect.value;

  filter.innerHTML = `

    <option value="">

      Toutes les catégories

    </option>

  `;

  recipeSelect.innerHTML =

    "";

  categories

    .slice()

    .sort(

      (a,b) =>

        a.localeCompare(

          b,

          "fr"

        )

    )

    .forEach(

      category => {

        const optionFilter =

          document.createElement(

            "option"

          );

        optionFilter.value =

          category;

        optionFilter.textContent =

          category;

        filter.appendChild(

          optionFilter

        );

        const optionRecipe =

          document.createElement(

            "option"

          );

        optionRecipe.value =

          category;

        optionRecipe.textContent =

          category;

        recipeSelect.appendChild(

          optionRecipe

        );

      }

    );

  if (

    categories.includes(

      selectedFilter

    )

  ) {

    filter.value =

      selectedFilter;

  }

  if (

    categories.includes(

      selectedRecipe

    )

  ) {

    recipeSelect.value =

      selectedRecipe;

  }

}

/* =====================================================

   AFFICHAGE

===================================================== */

function renderCocktails() {

  const grid =

    document.getElementById(

      "cocktailGrid"

    );

  const search =

    document

      .getElementById(

        "searchInput"

      )

      .value

      .trim()

      .toLowerCase();

  const category =

    document

      .getElementById(

        "categoryFilter"

      )

      .value;

  const sort =

    document

      .getElementById(

        "sortSelect"

      )

      .value;

  let filtered =

    cocktails.filter(

      item => {

        const text =

          [

            item.name,

            item.category,

            item.ingredients,

            item.glass,

            item.garnish,

            item.notes,

            item.orderNumber

          ]

          .join(" ")

          .toLowerCase();

        const matchesSearch =

          !search ||

          text.includes(search);

        const matchesCategory =

          !category ||

          item.category === category;

        return (

          matchesSearch &&

          matchesCategory

        );

      }

    );

  filtered.sort(

    (a,b) => {

      if (

        sort === "alphaAsc"

      ) {

        return a.name.localeCompare(

          b.name,

          "fr"

        );

      }

      if (

        sort === "alphaDesc"

      ) {

        return b.name.localeCompare(

          a.name,

          "fr"

        );

      }

      if (

        sort === "numberDesc"

      ) {

        return (

          Number(

            b.orderNumber

          )

          -

          Number(

            a.orderNumber

          )

        );

      }

      return (

        Number(

          a.orderNumber

        )

        -

        Number(

          b.orderNumber

        )

      );

    }

  );

  document.getElementById(

    "cocktailCount"

  ).textContent =

    filtered.length;

  if (

    filtered.length === 0

  ) {

    grid.innerHTML = `

      <div class="empty">

        <div class="empty-icon">

          🍹

        </div>

        <strong>

          Aucune recette trouvée

        </strong>

        <p>

          Ajoute une recette avec le bouton +.

        </p>

      </div>

    `;

    return;

  }

  grid.innerHTML =

    filtered.map(

      item => {

        const preview =

          item.ingredients

            .split("\n")

            .filter(Boolean)

            .slice(0,3)

            .join(" • ");

        return `

          <article class="cocktail-card">

            <div class="order-badge">

              ${escapeHtml(

                String(

                  item.orderNumber

                )

              )}

            </div>

            <div class="cocktail-image">

              ${getCocktailEmoji(

                item.category

              )}

            </div>

            <div class="cocktail-content">

              <div class="cocktail-top">

                <h2 class="cocktail-name">

                  ${escapeHtml(

                    item.name

                  )}

                </h2>

                <span class="category-badge">

                  ${escapeHtml(

                    item.category

                  )}

                </span>

              </div>

              <div class="ingredients-preview">

                ${escapeHtml(

                  preview

                )}

              </div>

              <div class="card-buttons">

                <button

                  class="view-btn"

                  onclick="viewCocktail('${item.id}')"

                >

                  Voir la recette

                </button>

                <button

                  class="edit-btn"

                  onclick="editCocktail('${item.id}')"

                  aria-label="Modifier"

                >

                  ✏️

                </button>

              </div>

            </div>

          </article>

        `;

      }

    )

    .join("");

}

/* =====================================================

   EMOJI

===================================================== */

function getCocktailEmoji(category) {

  const c =

    String(category || "")

      .toLowerCase();

  if (

    c.includes("sans alcool")

  ) {

    return "🧃";

  }

  if (

    c.includes("maison") ||

    c.includes("signature")

  ) {

    return "⭐";

  }

  return "🍹";

}

/* =====================================================

   VOIR

===================================================== */

function viewCocktail(id) {

  const item =

    cocktails.find(

      cocktail =>

        cocktail.id === id

    );

  if (!item) {

    return;

  }

  document.getElementById(

    "recipeTitle"

  ).textContent =

    item.name;

  document.getElementById(

    "recipeBody"

  ).innerHTML = `

    <span class="recipe-category">

      N° ${escapeHtml(

        String(

          item.orderNumber

        )

      )}

      ·

      ${escapeHtml(

        item.category

      )}

    </span>

    ${

      item.glass

      ?

      `

      <div class="recipe-section">

        <h3>

          🥂 Verre

        </h3>

        <div class="recipe-text">

          ${escapeHtml(

            item.glass

          )}

        </div>

      </div>

      `

      :

      ""

    }

    <div class="recipe-section">

      <h3>

        🍋 Ingrédients

      </h3>

      <div class="recipe-text">

        ${escapeHtml(

          item.ingredients

        )}

      </div>

    </div>

    <div class="recipe-section">

      <h3>

        👨‍🍳 Préparation

      </h3>

      <div class="recipe-text">

        ${escapeHtml(

          item.preparation

        )}

      </div>

    </div>

    ${

      item.garnish

      ?

      `

      <div class="recipe-section">

        <h3>

          🌿 Décoration

        </h3>

        <div class="recipe-text">

          ${escapeHtml(

            item.garnish

          )}

        </div>

      </div>

      `

      :

      ""

    }

    ${

      item.notes

      ?

      `

      <div class="recipe-section">

        <h3>

          📝 Notes

        </h3>

        <div class="recipe-text">

          ${escapeHtml(

            item.notes

          )}

        </div>

      </div>

      `

      :

      ""

    }

  `;

  openModal(

    "recipeModal"

  );

}

/* =====================================================

   AJOUTER

===================================================== */

function openAddModal() {

  document

    .getElementById(

      "cocktailForm"

    )

    .reset();

  document.getElementById(

    "editId"

  ).value =

    "";

  document.getElementById(

    "editTitle"

  ).textContent =

    "Ajouter une recette";

  document.getElementById(

    "deleteBtn"

  ).style.display =

    "none";

  const maxNumber =

    cocktails.reduce(

      (max,item) =>

        Math.max(

          max,

          Number(

            item.orderNumber

          ) || 0

        ),

      0

    );

  document.getElementById(

    "orderNumber"

  ).value =

    maxNumber + 1;

  refreshCategorySelectors();

  if (

    categories.length > 0

  ) {

    document.getElementById(

      "category"

    ).value =

      categories[0];

  }

  openModal(

    "editModal"

  );

}

/* =====================================================

   MODIFIER

===================================================== */

function editCocktail(id) {

  const item =

    cocktails.find(

      cocktail =>

        cocktail.id === id

    );

  if (!item) {

    return;

  }

  refreshCategorySelectors();

  document.getElementById(

    "editId"

  ).value =

    item.id;

  document.getElementById(

    "editTitle"

  ).textContent =

    "Modifier la recette";

  document.getElementById(

    "orderNumber"

  ).value =

    item.orderNumber;

  document.getElementById(

    "name"

  ).value =

    item.name;

  document.getElementById(

    "category"

  ).value =

    item.category;

  document.getElementById(

    "glass"

  ).value =

    item.glass;

  document.getElementById(

    "garnish"

  ).value =

    item.garnish;

  document.getElementById(

    "ingredients"

  ).value =

    item.ingredients;

  document.getElementById(

    "preparation"

  ).value =

    item.preparation;

  document.getElementById(

    "notes"

  ).value =

    item.notes;

  document.getElementById(

    "deleteBtn"

  ).style.display =

    "block";

  openModal(

    "editModal"

  );

}

/* =====================================================

   ENREGISTRER

===================================================== */

function saveCocktail(event) {

  event.preventDefault();

  const editId =

    document.getElementById(

      "editId"

    ).value;

  const item = {

    id:

      editId ||

      generateId(),

    orderNumber:

      Math.max(

        1,

        Number(

          document.getElementById(

            "orderNumber"

          ).value

        ) || 1

      ),

    name:

      document

        .getElementById(

          "name"

        )

        .value

        .trim(),

    category:

      document

        .getElementById(

          "category"

        )

        .value,

    glass:

      document

        .getElementById(

          "glass"

        )

        .value

        .trim(),

    garnish:

      document

        .getElementById(

          "garnish"

        )

        .value

        .trim(),

    ingredients:

      document

        .getElementById(

          "ingredients"

        )

        .value

        .trim(),

    preparation:

      document

        .getElementById(

          "preparation"

        )

        .value

        .trim(),

    notes:

      document

        .getElementById(

          "notes"

        )

        .value

        .trim()

  };

  if (editId) {

    const index =

      cocktails.findIndex(

        cocktail =>

          cocktail.id === editId

      );

    if (

      index !== -1

    ) {

      cocktails[index] =

        item;

    }

  }

  else {

    cocktails.push(

      item

    );

  }

  saveCocktailsStorage();

  closeModal(

    "editModal"

  );

  renderCocktails();

}

/* =====================================================

   SUPPRIMER

===================================================== */

function deleteCocktail() {

  const id =

    document.getElementById(

      "editId"

    ).value;

  if (!id) {

    return;

  }

  const item =

    cocktails.find(

      cocktail =>

        cocktail.id === id

    );

  if (!item) {

    return;

  }

  const confirmed =

    confirm(

      `Supprimer "${item.name}" ?`

    );

  if (!confirmed) {

    return;

  }

  cocktails =

    cocktails.filter(

      cocktail =>

        cocktail.id !== id

    );

  saveCocktailsStorage();

  closeModal(

    "editModal"

  );

  renderCocktails();

}

/* =====================================================

   CATEGORIES

===================================================== */

function openCategoryModal() {

  renderCategoryList();

  openModal(

    "categoryModal"

  );

}

function categoryEnter(event) {

  if (

    event.key === "Enter"

  ) {

    event.preventDefault();

    addCategory();

  }

}

function addCategory() {

  const input =

    document.getElementById(

      "newCategoryInput"

    );

  const value =

    input.value.trim();

  if (!value) {

    return;

  }

  const exists =

    categories.some(

      category =>

        category.toLowerCase() ===

        value.toLowerCase()

    );

  if (exists) {

    alert(

      "Cette catégorie existe déjà."

    );

    return;

  }

  categories.push(

    value

  );

  categories.sort(

    (a,b) =>

      a.localeCompare(

        b,

        "fr"

      )

  );

  saveCategoriesStorage();

  input.value =

    "";

  refreshCategorySelectors();

  renderCategoryList();

  renderCocktails();

}

function renderCategoryList() {

  const list =

    document.getElementById(

      "categoryList"

    );

  if (

    categories.length === 0

  ) {

    list.innerHTML = `

      <div class="empty">

        Aucune catégorie.

      </div>

    `;

    return;

  }

  list.innerHTML =

    categories.map(

      category => {

        const count =

          cocktails.filter(

            item =>

              item.category ===

              category

          ).length;

        return `

          <div class="category-row">

            <strong>

              ${escapeHtml(

                category

              )}

            </strong>

            ${

              count > 0

              ?

              `

              <span class="category-used">

                ${count} recette(s)

              </span>

              `

              :

              `

              <button

                class="category-delete"

                onclick="deleteCategory('${escapeJs(category)}')"

              >

                Supprimer

              </button>

              `

            }

          </div>

        `;

      }

    )

    .join("");

}

function deleteCategory(category) {

  const used =

    cocktails.some(

      item =>

        item.category ===

        category

    );

  if (used) {

    alert(

      "Cette catégorie est encore utilisée par une recette."

    );

    return;

  }

  const confirmed =

    confirm(

      `Supprimer la catégorie "${category}" ?`

    );

  if (!confirmed) {

    return;

  }

  categories =

    categories.filter(

      item =>

        item !== category

    );

  saveCategoriesStorage();

  refreshCategorySelectors();

  renderCategoryList();

  renderCocktails();

}

/* =====================================================

   OUVERTURE / FERMETURE MODAL

===================================================== */

function openModal(id) {

  const modal =

    document.getElementById(id);

  modal.classList.add(

    "show"

  );

  document.body.style.overflow =

    "hidden";

}

function closeModal(id) {

  const modal =

    document.getElementById(id);

  modal.classList.remove(

    "show"

  );

  const anyOpen =

    document.querySelector(

      ".modal-overlay.show"

    );

  if (!anyOpen) {

    document.body.style.overflow =

      "";

  }

}

function closeOnOverlay(

  event,

  id

) {

  if (

    event.target.id === id

  ) {

    closeModal(id);

  }

}

/* =====================================================

   OUTILS

===================================================== */

function generateId() {

  return (

    "cocktail-" +

    Date.now() +

    "-" +

    Math.random()

      .toString(36)

      .slice(2,8)

  );

}

function escapeHtml(value) {

  return String(

    value ?? ""

  )

  .replaceAll(

    "&",

    "&amp;"

  )

  .replaceAll(

    "<",

    "&lt;"

  )

  .replaceAll(

    ">",

    "&gt;"

  )

  .replaceAll(

    '"',

    "&quot;"

  )

  .replaceAll(

    "'",

    "&#039;"

  );

}

function escapeJs(value) {

  return String(value)

    .replaceAll(

      "\\",

      "\\\\"

    )

    .replaceAll(

      "'",

      "\\'"

    );

}

/* =====================================================

   DEMARRAGE

===================================================== */

refreshCategorySelectors();

renderCocktails();

</script>

</body>

</html>
