<!DOCTYPE html>

<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, viewport-fit=cover"

  >

  <meta name="theme-color" content="#111827">

  <title>Recettes Cocktails</title>

  <link rel="manifest" href="./manifest.json">

  <link rel="apple-touch-icon" href="./icon.PNG">

  <link rel="icon" type="image/png" href="./icon.PNG">

  <style>

    :root {

      --bg: #f3f4f6;

      --card: #ffffff;

      --text: #111827;

      --muted: #6b7280;

      --border: #e5e7eb;

      --dark: #111827;

      --dark2: #374151;

      --danger: #b91c1c;

      --danger-bg: #fee2e2;

      --ok: #15803d;

      --blue: #2563eb;

      --radius: 18px;

      --font-scale: 1;

    }

    * {

      box-sizing: border-box;

    }

    html {

      -webkit-text-size-adjust: 100%;

    }

    body {

      margin: 0;

      background: var(--bg);

      color: var(--text);

      font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        Roboto,

        Arial,

        sans-serif;

      font-size: calc(16px * var(--font-scale));

      padding-bottom: max(30px, env(safe-area-inset-bottom));

    }

    button,

    input,

    textarea,

    select {

      font: inherit;

    }

    button {

      cursor: pointer;

      border: 1px solid var(--border);

      background: white;

      color: var(--text);

      border-radius: 12px;

      padding: 10px 13px;

      font-weight: 700;

    }

    button:active {

      transform: scale(.98);

    }

    .primary {

      background: var(--dark);

      color: white;

      border-color: var(--dark);

    }

    .danger {

      background: var(--danger-bg);

      color: var(--danger);

      border-color: #fecaca;

    }

    .wrap {

      width: min(100%, 1150px);

      margin: auto;

      padding:

        max(14px, env(safe-area-inset-top))

        14px

        40px;

    }

    .header {

      background: var(--dark);

      color: white;

      border-radius: 0 0 22px 22px;

      padding: 18px;

      margin:

        calc(-1 * max(14px, env(safe-area-inset-top)))

        -14px

        18px;

    }

    .header-inner {

      width: min(100%, 1150px);

      margin: auto;

    }

    h1 {

      margin: 0;

      font-size: 1.7em;

    }

    .subtitle {

      color: #d1d5db;

      margin-top: 5px;

      font-size: .9em;

    }

    .card {

      background: var(--card);

      border: 1px solid var(--border);

      border-radius: var(--radius);

      padding: 14px;

      box-shadow:

        0 2px 4px rgba(0,0,0,.03),

        0 8px 20px rgba(0,0,0,.04);

    }

    .toolbar {

      display: grid;

      grid-template-columns: minmax(180px, 1fr) auto auto;

      gap: 10px;

      margin-bottom: 12px;

    }

    input,

    textarea,

    select {

      width: 100%;

      border: 1px solid #d1d5db;

      background: white;

      color: var(--text);

      border-radius: 12px;

      padding: 11px 12px;

      outline: none;

    }

    input:focus,

    textarea:focus,

    select:focus {

      border-color: #9ca3af;

      box-shadow: 0 0 0 3px rgba(17,24,39,.06);

    }

    textarea {

      min-height: 110px;

      resize: vertical;

    }

    .settings-bar {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-bottom: 14px;

    }

    .sort-box,

    .font-box {

      background: white;

      border: 1px solid var(--border);

      border-radius: 14px;

      padding: 10px;

    }

    .small-label {

      display: block;

      color: var(--muted);

      font-size: .78em;

      margin-bottom: 6px;

      font-weight: 700;

    }

    .font-controls {

      display: grid;

      grid-template-columns: auto 1fr auto;

      gap: 7px;

      align-items: center;

    }

    .font-controls button {

      padding: 9px 14px;

    }

    #fontValue {

      text-align: center;

      font-weight: 800;

    }

    .category-tools {

      margin-bottom: 14px;

    }

    .category-filters {

      display: flex;

      gap: 7px;

      overflow-x: auto;

      padding-bottom: 5px;

      scrollbar-width: thin;

    }

    .category-filters button {

      white-space: nowrap;

      padding: 8px 12px;

    }

    .category-filters button.active {

      background: var(--dark);

      color: white;

      border-color: var(--dark);

    }

    .section-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

      margin: 14px 0 10px;

    }

    .section-header h2 {

      margin: 0;

      font-size: 1.25em;

    }

    .count {

      color: var(--muted);

      font-size: .85em;

    }

    .cocktail-list {

      display: grid;

      grid-template-columns:

        repeat(auto-fill, minmax(min(100%, 320px), 1fr));

      gap: 12px;

    }

    .cocktail-card {

      background: white;

      border: 1px solid var(--border);

      border-radius: var(--radius);

      overflow: hidden;

      box-shadow: 0 3px 15px rgba(0,0,0,.04);

      display: flex;

      flex-direction: column;

      min-width: 0;

    }

    .cocktail-photo {

      width: 100%;

      height: 200px;

      object-fit: cover;

      display: block;

      background: #e5e7eb;

    }

    .cocktail-photo-placeholder {

      height: 130px;

      display: grid;

      place-items: center;

      background:

        linear-gradient(135deg, #111827, #374151);

      color: white;

      font-size: 2.4em;

    }

    .cocktail-content {

      padding: 14px;

      display: flex;

      flex-direction: column;

      flex: 1;

    }

    .cocktail-top {

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      gap: 10px;

    }

    .cocktail-number {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-width: 34px;

      height: 34px;

      padding: 0 9px;

      border-radius: 10px;

      background: var(--dark);

      color: white;

      font-size: .86em;

      font-weight: 900;

      flex-shrink: 0;

    }

    .cocktail-name {

      margin: 0;

      font-size: 1.15em;

      line-height: 1.2;

      overflow-wrap: anywhere;

    }

    .category-badge {

      display: inline-block;

      margin-top: 6px;

      border-radius: 999px;

      background: #f3f4f6;

      color: var(--dark2);

      padding: 5px 9px;

      font-size: .77em;

      font-weight: 700;

    }

    .preview {

      margin-top: 10px;

      color: var(--muted);

      font-size: .88em;

      line-height: 1.45;

      white-space: pre-line;

      overflow-wrap: anywhere;

    }

    .card-actions {

      display: flex;

      gap: 7px;

      margin-top: auto;

      padding-top: 13px;

    }

    .card-actions button {

      flex: 1;

    }

    .empty {

      background: white;

      color: var(--muted);

      border: 1px dashed #d1d5db;

      border-radius: var(--radius);

      padding: 35px 15px;

      text-align: center;

      grid-column: 1 / -1;

    }

    .fab {

      position: fixed;

      right: max(18px, env(safe-area-inset-right));

      bottom: max(18px, env(safe-area-inset-bottom));

      width: 60px;

      height: 60px;

      padding: 0;

      border-radius: 50%;

      background: var(--dark);

      color: white;

      border: none;

      font-size: 30px;

      box-shadow: 0 12px 30px rgba(0,0,0,.25);

      z-index: 20;

    }

    dialog {

      width: min(94vw, 620px);

      max-height: 90vh;

      border: none;

      border-radius: 20px;

      padding: 0;

      color: var(--text);

      background: white;

      box-shadow: 0 25px 80px rgba(0,0,0,.35);

    }

    dialog::backdrop {

      background: rgba(0,0,0,.55);

      backdrop-filter: blur(3px);

    }

    .modal {

      padding: 18px;

      overflow-y: auto;

      max-height: 90vh;

    }

    .modal h2 {

      margin-top: 0;

    }

    .field {

      margin-bottom: 12px;

    }

    .field label {

      display: block;

      color: var(--muted);

      font-size: .8em;

      margin-bottom: 5px;

      font-weight: 700;

    }

    .grid2 {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

    }

    .modal-actions {

      display: flex;

      justify-content: flex-end;

      flex-wrap: wrap;

      gap: 8px;

      margin-top: 15px;

    }

    .photo-preview {

      display: none;

      width: 100%;

      max-height: 260px;

      object-fit: contain;

      border: 1px solid var(--border);

      border-radius: 14px;

      margin-top: 8px;

      background: #f3f4f6;

    }

    .category-manager-row {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      padding: 9px 0;

      border-bottom: 1px solid var(--border);

    }

    .category-manager-row:last-child {

      border-bottom: none;

    }

    .category-manager-name {

      font-weight: 800;

      overflow-wrap: anywhere;

    }

    .category-manager-actions {

      display: flex;

      gap: 6px;

      flex-shrink: 0;

    }

    @media (max-width: 700px) {

      .toolbar {

        grid-template-columns: 1fr;

      }

      .settings-bar {

        grid-template-columns: 1fr;

      }

      .grid2 {

        grid-template-columns: 1fr;

      }

      .cocktail-list {

        grid-template-columns: 1fr;

      }

      .cocktail-photo {

        height: 220px;

      }

      .header {

        border-radius: 0 0 18px 18px;

      }

      .modal-actions button {

        flex: 1;

      }

    }

    @media (min-width: 701px) and (max-width: 1000px) {

      .cocktail-list {

        grid-template-columns: repeat(2, 1fr);

      }

    }

    @media (min-width: 1200px) {

      .cocktail-list {

        grid-template-columns: repeat(3, 1fr);

      }

    }

  </style>

</head>

<body>

<div class="wrap">

  <header class="header">

    <div class="header-inner">

      <h1>🍸 Recettes Cocktails</h1>

      <div class="subtitle">

        Recettes du bar • Mamy Mouss

      </div>

    </div>

  </header>

  <div class="toolbar">

    <input

      id="searchInput"

      type="search"

      placeholder="🔎 Rechercher un cocktail…"

    >

    <button id="categoriesBtn">

      ⚙️ Catégories

    </button>

    <button id="addTopBtn" class="primary">

      + Cocktail

    </button>

  </div>

  <div class="settings-bar">

    <div class="sort-box">

      <span class="small-label">Trier les cocktails par</span>

      <select id="sortSelect">

        <option value="number">🔢 Numéro</option>

        <option value="name">🔤 Nom A → Z</option>

        <option value="category">📂 Catégorie</option>

      </select>

    </div>

    <div class="font-box">

      <span class="small-label">Taille du texte</span>

      <div class="font-controls">

        <button id="fontMinus">A−</button>

        <div id="fontValue">100 %</div>

        <button id="fontPlus">A+</button>

      </div>

    </div>

  </div>

  <div class="category-tools card">

    <div

      class="category-filters"

      id="categoryFilters"

    ></div>

  </div>

  <div class="section-header">

    <h2>Liste des cocktails</h2>

    <span class="count" id="cocktailCount">0 cocktail</span>

  </div>

  <div

    id="cocktailList"

    class="cocktail-list"

  ></div>

</div>

<button

  class="fab"

  id="addFab"

  aria-label="Ajouter un cocktail"

>+</button>

<!-- ======================================================

     FENÊTRE AJOUT / MODIFICATION COCKTAIL

====================================================== -->

<dialog id="cocktailDialog">

  <form

    id="cocktailForm"

    class="modal"

  >

    <h2 id="cocktailDialogTitle">

      Ajouter un cocktail

    </h2>

    <input

      type="hidden"

      id="cocktailId"

    >

    <div class="grid2">

      <div class="field">

        <label>Numéro</label>

        <input

          id="cocktailNumber"

          type="number"

          min="1"

          step="1"

          placeholder="Ex. 12"

        >

      </div>

      <div class="field">

        <label>Catégorie</label>

        <select id="cocktailCategory"></select>

      </div>

    </div>

    <div class="field">

      <label>Nom du cocktail</label>

      <input

        id="cocktailName"

        required

        placeholder="Ex. Mojito"

      >

    </div>

    <div class="field">

      <label>Ingrédients</label>

      <textarea

        id="cocktailIngredients"

        placeholder="Ex.

5 cl de rhum

2 cl de citron vert

Menthe

Sucre

Eau pétillante"

      ></textarea>

    </div>

    <div class="field">

      <label>Préparation</label>

      <textarea

        id="cocktailPreparation"

        placeholder="Explique ici comment préparer le cocktail…"

      ></textarea>

    </div>

    <div class="field">

      <label>Verrerie / décoration</label>

      <textarea

        id="cocktailGlass"

        placeholder="Ex. Verre highball, menthe, citron vert…"

      ></textarea>

    </div>

    <div class="field">

      <label>Photo du cocktail</label>

      <input

        id="cocktailPhoto"

        type="file"

        accept="image/*"

      >

      <img

        id="photoPreview"

        class="photo-preview"

        alt="Aperçu"

      >

      <button

        id="removePhotoBtn"

        type="button"

        style="display:none;margin-top:7px"

      >

        Supprimer la photo

      </button>

    </div>

    <div class="modal-actions">

      <button

        id="deleteCocktailBtn"

        type="button"

        class="danger"

        style="display:none"

      >

        Supprimer

      </button>

      <button

        id="cancelCocktailBtn"

        type="button"

      >

        Annuler

      </button>

      <button

        type="submit"

        class="primary"

      >

        Enregistrer

      </button>

    </div>

  </form>

</dialog>

<!-- ======================================================

     GESTION DES CATÉGORIES

====================================================== -->

<dialog id="categoryDialog">

  <div class="modal">

    <h2>Gérer les catégories</h2>

    <div class="field">

      <label>Nouvelle catégorie</label>

      <div

        style="

          display:grid;

          grid-template-columns:1fr auto;

          gap:8px;

        "

      >

        <input

          id="newCategoryInput"

          placeholder="Ex. Cocktails sans alcool"

        >

        <button

          id="addCategoryBtn"

          class="primary"

          type="button"

        >

          Ajouter

        </button>

      </div>

    </div>

    <div

      id="categoryManager"

      style="margin-top:10px"

    ></div>

    <div class="modal-actions">

      <button

        id="closeCategoryBtn"

        type="button"

        class="primary"

      >

        Fermer

      </button>

    </div>

  </div>

</dialog>

<script>

const STORAGE_COCKTAILS = "cocktail_recipes_v5";

const STORAGE_CATEGORIES = "cocktail_categories_v5";

const STORAGE_FONT = "cocktail_font_scale_v5";

const STORAGE_SORT = "cocktail_sort_v5";

const DEFAULT_CATEGORIES = [

  "Classiques",

  "Signatures",

  "Fruités",

  "Tiki",

  "Shots",

  "Sans alcool",

  "Autre"

];

let cocktails =

  JSON.parse(localStorage.getItem(STORAGE_COCKTAILS) || "[]");

let categories =

  JSON.parse(localStorage.getItem(STORAGE_CATEGORIES) || "null")

  || DEFAULT_CATEGORIES;

let activeCategory = "Tous";

let currentPhoto = "";

let fontScale =

  Number(localStorage.getItem(STORAGE_FONT) || 1);

let sortMode =

  localStorage.getItem(STORAGE_SORT) || "number";

const $ = id => document.getElementById(id);

function saveCocktails() {

  localStorage.setItem(

    STORAGE_COCKTAILS,

    JSON.stringify(cocktails)

  );

}

function saveCategories() {

  localStorage.setItem(

    STORAGE_CATEGORIES,

    JSON.stringify(categories)

  );

}

function escapeHtml(value) {

  return String(value ?? "").replace(

    /[&<>"']/g,

    character => ({

      "&": "&amp;",

      "<": "&lt;",

      ">": "&gt;",

      '"': "&quot;",

      "'": "&#039;"

    })[character]

  );

}

/* ======================================================

   TAILLE DU TEXTE

====================================================== */

function applyFontSize() {

  fontScale =

    Math.max(

      0.8,

      Math.min(1.5, fontScale)

    );

  document.documentElement.style.setProperty(

    "--font-scale",

    fontScale

  );

  $("fontValue").textContent =

    Math.round(fontScale * 100) + " %";

  localStorage.setItem(

    STORAGE_FONT,

    String(fontScale)

  );

}

$("fontMinus").onclick = () => {

  fontScale =

    Math.round((fontScale - 0.1) * 10) / 10;

  applyFontSize();

};

$("fontPlus").onclick = () => {

  fontScale =

    Math.round((fontScale + 0.1) * 10) / 10;

  applyFontSize();

};

/* ======================================================

   CATÉGORIES

====================================================== */

function renderCategoryFilters() {

  const box = $("categoryFilters");

  box.innerHTML = "";

  const allCategories = [

    "Tous",

    ...categories

  ];

  allCategories.forEach(category => {

    const button =

      document.createElement("button");

    button.textContent = category;

    if (activeCategory === category) {

      button.classList.add("active");

    }

    button.onclick = () => {

      activeCategory = category;

      renderCategoryFilters();

      renderCocktails();

    };

    box.appendChild(button);

  });

}

function populateCategorySelect(selected = "") {

  const select =

    $("cocktailCategory");

  select.innerHTML = "";

  categories.forEach(category => {

    const option =

      document.createElement("option");

    option.value = category;

    option.textContent = category;

    select.appendChild(option);

  });

  if (

    selected &&

    categories.includes(selected)

  ) {

    select.value = selected;

  } else if (categories.length) {

    select.value = categories[0];

  }

}

function renderCategoryManager() {

  const box =

    $("categoryManager");

  if (!categories.length) {

    box.innerHTML =

      '<div class="empty">Aucune catégorie.</div>';

    return;

  }

  box.innerHTML = "";

  categories.forEach(category => {

    const used =

      cocktails.filter(

        cocktail =>

          cocktail.category === category

      ).length;

    const row =

      document.createElement("div");

    row.className =

      "category-manager-row";

    row.innerHTML = `

      <div>

        <div class="category-manager-name">

          ${escapeHtml(category)}

        </div>

        <div

          style="

            color:#6b7280;

            font-size:.78em;

          "

        >

          ${used}

          cocktail${used > 1 ? "s" : ""}

        </div>

      </div>

      <div class="category-manager-actions">

        <button

          type="button"

          data-action="rename"

        >

          ✏️

        </button>

        <button

          type="button"

          data-action="delete"

          class="danger"

        >

          🗑️

        </button>

      </div>

    `;

    row

      .querySelector('[data-action="rename"]')

      .onclick = () => {

        const newName =

          prompt(

            "Nouveau nom de la catégorie :",

            category

          );

        if (newName === null) return;

        const clean =

          newName.trim();

        if (!clean) return;

        if (

          categories.some(

            c =>

              c.toLowerCase() ===

              clean.toLowerCase()

          ) &&

          clean.toLowerCase() !==

            category.toLowerCase()

        ) {

          alert(

            "Cette catégorie existe déjà."

          );

          return;

        }

        cocktails.forEach(cocktail => {

          if (

            cocktail.category === category

          ) {

            cocktail.category = clean;

          }

        });

        categories =

          categories.map(

            c =>

              c === category

                ? clean

                : c

          );

        if (

          activeCategory === category

        ) {

          activeCategory = clean;

        }

        saveCocktails();

        saveCategories();

        renderCategoryManager();

        renderCategoryFilters();

        renderCocktails();

      };

    row

      .querySelector('[data-action="delete"]')

      .onclick = () => {

        let message =

          `Supprimer la catégorie "${category}" ?`;

        if (used) {

          message +=

            `\n\n${used} cocktail${used > 1 ? "s" : ""} passeront dans "Autre".`;

        }

        if (!confirm(message)) return;

        if (!categories.includes("Autre")) {

          categories.push("Autre");

        }

        cocktails.forEach(cocktail => {

          if (

            cocktail.category === category

          ) {

            cocktail.category = "Autre";

          }

        });

        categories =

          categories.filter(

            c => c !== category

          );

        if (

          activeCategory === category

        ) {

          activeCategory = "Tous";

        }

        saveCocktails();

        saveCategories();

        renderCategoryManager();

        renderCategoryFilters();

        renderCocktails();

      };

    box.appendChild(row);

  });

}

$("categoriesBtn").onclick = () => {

  renderCategoryManager();

  $("newCategoryInput").value = "";

  $("categoryDialog").showModal();

};

$("closeCategoryBtn").onclick = () => {

  $("categoryDialog").close();

};

$("addCategoryBtn").onclick = () => {

  const name =

    $("newCategoryInput")

      .value

      .trim();

  if (!name) return;

  const exists =

    categories.some(

      c =>

        c.toLowerCase() ===

        name.toLowerCase()

    );

  if (exists) {

    alert(

      "Cette catégorie existe déjà."

    );

    return;

  }

  categories.push(name);

  saveCategories();

  $("newCategoryInput").value = "";

  renderCategoryManager();

  renderCategoryFilters();

};

$("newCategoryInput").addEventListener(

  "keydown",

  event => {

    if (event.key === "Enter") {

      event.preventDefault();

      $("addCategoryBtn").click();

    }

  }

);

/* ======================================================

   TRI

====================================================== */

function sortCocktails(list) {

  const sorted = [...list];

  if (sortMode === "number") {

    sorted.sort((a, b) => {

      const numberA =

        Number(a.number) || 999999;

      const numberB =

        Number(b.number) || 999999;

      if (numberA !== numberB) {

        return numberA - numberB;

      }

      return String(a.name)

        .localeCompare(

          String(b.name),

          "fr",

          { sensitivity: "base" }

        );

    });

  }

  if (sortMode === "name") {

    sorted.sort((a, b) =>

      String(a.name)

        .localeCompare(

          String(b.name),

          "fr",

          { sensitivity: "base" }

        )

    );

  }

  if (sortMode === "category") {

    sorted.sort((a, b) => {

      const categoryCompare =

        String(a.category || "")

          .localeCompare(

            String(b.category || ""),

            "fr",

            { sensitivity: "base" }

          );

      if (categoryCompare !== 0) {

        return categoryCompare;

      }

      const numberA =

        Number(a.number) || 999999;

      const numberB =

        Number(b.number) || 999999;

      if (numberA !== numberB) {

        return numberA - numberB;

      }

      return String(a.name)

        .localeCompare(

          String(b.name),

          "fr",

          { sensitivity: "base" }

        );

    });

  }

  return sorted;

}

$("sortSelect").value =

  sortMode;

$("sortSelect").onchange = () => {

  sortMode =

    $("sortSelect").value;

  localStorage.setItem(

    STORAGE_SORT,

    sortMode

  );

  renderCocktails();

};

/* ======================================================

   AFFICHAGE COCKTAILS

====================================================== */

function renderCocktails() {

  const search =

    $("searchInput")

      .value

      .trim()

      .toLowerCase();

  let filtered =

    cocktails.filter(cocktail => {

      const categoryOk =

        activeCategory === "Tous" ||

        cocktail.category === activeCategory;

      const searchText = [

        cocktail.name,

        cocktail.category,

        cocktail.number,

        cocktail.ingredients,

        cocktail.preparation,

        cocktail.glass

      ]

        .join(" ")

        .toLowerCase();

      const searchOk =

        !search ||

        searchText.includes(search);

      return categoryOk && searchOk;

    });

  filtered =

    sortCocktails(filtered);

  const list =

    $("cocktailList");

  const count =

    filtered.length;

  $("cocktailCount").textContent =

    `${count} cocktail${count > 1 ? "s" : ""}`;

  if (!count) {

    list.innerHTML = `

      <div class="empty">

        Aucun cocktail trouvé.<br><br>

        Appuie sur

        <strong>+ Cocktail</strong>

        pour en ajouter un.

      </div>

    `;

    return;

  }

  list.innerHTML = "";

  filtered.forEach(cocktail => {

    const card =

      document.createElement("article");

    card.className =

      "cocktail-card";

    const photoHtml =

      cocktail.photo

        ? `

          <img

            class="cocktail-photo"

            src="${cocktail.photo}"

            alt="${escapeHtml(cocktail.name)}"

          >

        `

        : `

          <div class="cocktail-photo-placeholder">

            🍸

          </div>

        `;

    const numberHtml =

      cocktail.number

        ? `

          <span class="cocktail-number">

            ${escapeHtml(cocktail.number)}

          </span>

        `

        : "";

    let preview =

      cocktail.ingredients || "";

    if (preview.length > 150) {

      preview =

        preview.slice(0, 150) + "…";

    }

    card.innerHTML = `

      ${photoHtml}

      <div class="cocktail-content">

        <div class="cocktail-top">

          <div>

            <h3 class="cocktail-name">

              ${escapeHtml(cocktail.name)}

            </h3>

            <span class="category-badge">

              ${escapeHtml(

                cocktail.category || "Autre"

              )}

            </span>

          </div>

          ${numberHtml}

        </div>

        ${

          preview

            ? `

              <div class="preview">

                ${escapeHtml(preview)}

              </div>

            `

            : ""

        }

        <div class="card-actions">

          <button

            data-action="view"

            class="primary"

          >

            Voir

          </button>

          <button

            data-action="edit"

          >

            Modifier

          </button>

        </div>

      </div>

    `;

    card

      .querySelector('[data-action="view"]')

      .onclick = () => {

        showCocktail(cocktail.id);

      };

    card

      .querySelector('[data-action="edit"]')

      .onclick = () => {

        openEditCocktail(cocktail.id);

      };

    list.appendChild(card);

  });

}

/* ======================================================

   AJOUTER / MODIFIER

====================================================== */

function nextAvailableNumber() {

  const numbers =

    cocktails

      .map(c => Number(c.number))

      .filter(n => Number.isFinite(n));

  if (!numbers.length) {

    return 1;

  }

  return Math.max(...numbers) + 1;

}

function openAddCocktail() {

  $("cocktailForm").reset();

  $("cocktailId").value = "";

  $("cocktailDialogTitle").textContent =

    "Ajouter un cocktail";

  $("cocktailNumber").value =

    nextAvailableNumber();

  populateCategorySelect();

  currentPhoto = "";

  $("photoPreview").src = "";

  $("photoPreview").style.display = "none";

  $("removePhotoBtn").style.display =

    "none";

  $("deleteCocktailBtn").style.display =

    "none";

  $("cocktailDialog").showModal();

}

function openEditCocktail(id) {

  const cocktail =

    cocktails.find(

      item => item.id === id

    );

  if (!cocktail) return;

  $("cocktailDialogTitle").textContent =

    "Modifier le cocktail";

  $("cocktailId").value =

    cocktail.id;

  $("cocktailNumber").value =

    cocktail.number || "";

  $("cocktailName").value =

    cocktail.name || "";

  populateCategorySelect(

    cocktail.category

  );

  $("cocktailIngredients").value =

    cocktail.ingredients || "";

  $("cocktailPreparation").value =

    cocktail.preparation || "";

  $("cocktailGlass").value =

    cocktail.glass || "";

  currentPhoto =

    cocktail.photo || "";

  if (currentPhoto) {

    $("photoPreview").src =

      currentPhoto;

    $("photoPreview").style.display =

      "block";

    $("removePhotoBtn").style.display =

      "inline-block";

  } else {

    $("photoPreview").style.display =

      "none";

    $("removePhotoBtn").style.display =

      "none";

  }

  $("deleteCocktailBtn").style.display =

    "inline-block";

  $("cocktailDialog").showModal();

}

$("addTopBtn").onclick =

  openAddCocktail;

$("addFab").onclick =

  openAddCocktail;

$("cancelCocktailBtn").onclick = () => {

  $("cocktailDialog").close();

};

/* ======================================================

   PHOTO

====================================================== */

$("cocktailPhoto").addEventListener(

  "change",

  event => {

    const file =

      event.target.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {

      alert(

        "Choisis une image valide."

      );

      return;

    }

    const reader =

      new FileReader();

    reader.onload = loadEvent => {

      const image =

        new Image();

      image.onload = () => {

        const canvas =

          document.createElement("canvas");

        const maxSize = 1200;

        let width =

          image.width;

        let height =

          image.height;

        if (

          width > maxSize ||

          height > maxSize

        ) {

          const ratio =

            Math.min(

              maxSize / width,

              maxSize / height

            );

          width =

            Math.round(width * ratio);

          height =

            Math.round(height * ratio);

        }

        canvas.width = width;

        canvas.height = height;

        const ctx =

          canvas.getContext("2d");

        ctx.drawImage(

          image,

          0,

          0,

          width,

          height

        );

        currentPhoto =

          canvas.toDataURL(

            "image/jpeg",

            .78

          );

        $("photoPreview").src =

          currentPhoto;

        $("photoPreview").style.display =

          "block";

        $("removePhotoBtn").style.display =

          "inline-block";

      };

      image.src =

        loadEvent.target.result;

    };

    reader.readAsDataURL(file);

  }

);

$("removePhotoBtn").onclick = () => {

  currentPhoto = "";

  $("cocktailPhoto").value = "";

  $("photoPreview").src = "";

  $("photoPreview").style.display =

    "none";

  $("removePhotoBtn").style.display =

    "none";

};

/* ======================================================

   ENREGISTREMENT

====================================================== */

$("cocktailForm").addEventListener(

  "submit",

  event => {

    event.preventDefault();

    const id =

      $("cocktailId").value;

    const number =

      $("cocktailNumber")

        .value

        .trim();

    const name =

      $("cocktailName")

        .value

        .trim();

    if (!name) {

      alert(

        "Entre le nom du cocktail."

      );

      return;

    }

    if (number) {

      const duplicate =

        cocktails.find(

          cocktail =>

            String(cocktail.number) ===

              String(number) &&

            cocktail.id !== id

        );

      if (duplicate) {

        const continueSave =

          confirm(

            `Le numéro ${number} est déjà utilisé par "${duplicate.name}".\n\nTu veux quand même l'utiliser ?`

          );

        if (!continueSave) return;

      }

    }

    const cocktail = {

      id:

        id ||

        crypto.randomUUID(),

      number,

      name,

      category:

        $("cocktailCategory").value ||

        "Autre",

      ingredients:

        $("cocktailIngredients")

          .value

          .trim(),

      preparation:

        $("cocktailPreparation")

          .value

          .trim(),

      glass:

        $("cocktailGlass")

          .value

          .trim(),

      photo:

        currentPhoto,

      updatedAt:

        new Date().toISOString()

    };

    const index =

      cocktails.findIndex(

        item =>

          item.id === cocktail.id

      );

    if (index >= 0) {

      cocktails[index] =

        cocktail;

    } else {

      cocktails.push(cocktail);

    }

    saveCocktails();

    $("cocktailDialog").close();

    renderCocktails();

  }

);

/* ======================================================

   SUPPRESSION

====================================================== */

$("deleteCocktailBtn").onclick = () => {

  const id =

    $("cocktailId").value;

  const cocktail =

    cocktails.find(

      item => item.id === id

    );

  if (!cocktail) return;

  if (

    !confirm(

      `Supprimer "${cocktail.name}" ?`

    )

  ) {

    return;

  }

  cocktails =

    cocktails.filter(

      item => item.id !== id

    );

  saveCocktails();

  $("cocktailDialog").close();

  renderCocktails();

};

/* ======================================================

   AFFICHER UNE RECETTE

====================================================== */

function showCocktail(id) {

  const cocktail =

    cocktails.find(

      item => item.id === id

    );

  if (!cocktail) return;

  $("cocktailDialogTitle").textContent =

    cocktail.number

      ? `${cocktail.number} — ${cocktail.name}`

      : cocktail.name;

  $("cocktailId").value =

    cocktail.id;

  $("cocktailNumber").value =

    cocktail.number || "";

  $("cocktailName").value =

    cocktail.name || "";

  populateCategorySelect(

    cocktail.category

  );

  $("cocktailIngredients").value =

    cocktail.ingredients || "";

  $("cocktailPreparation").value =

    cocktail.preparation || "";

  $("cocktailGlass").value =

    cocktail.glass || "";

  currentPhoto =

    cocktail.photo || "";

  if (currentPhoto) {

    $("photoPreview").src =

      currentPhoto;

    $("photoPreview").style.display =

      "block";

    $("removePhotoBtn").style.display =

      "inline-block";

  } else {

    $("photoPreview").style.display =

      "none";

    $("removePhotoBtn").style.display =

      "none";

  }

  $("deleteCocktailBtn").style.display =

    "inline-block";

  $("cocktailDialog").showModal();

}

/* ======================================================

   RECHERCHE

====================================================== */

$("searchInput").addEventListener(

  "input",

  renderCocktails

);

/* ======================================================

   INITIALISATION

====================================================== */

function initialise() {

  categories =

    Array.from(

      new Set([

        ...categories,

        ...cocktails

          .map(c => c.category)

          .filter(Boolean)

      ])

    );

  if (!categories.length) {

    categories =

      [...DEFAULT_CATEGORIES];

  }

  saveCategories();

  applyFontSize();

  $("sortSelect").value =

    sortMode;

  renderCategoryFilters();

  renderCocktails();

}

initialise();

  navigator.serviceWorker
