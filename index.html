<!DOCTYPE html>

<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, viewport-fit=cover"

  >

  <meta name="theme-color" content="#111827">

  <title>Recettes Cocktails</title>

  <link rel="manifest" href="./manifest.json">

  <link rel="apple-touch-icon" href="./icon.PNG">

  <link rel="icon" type="image/png" href="./icon.PNG">

  <style>

    :root {

      --bg:#f3f4f6;

      --card:#ffffff;

      --text:#111827;

      --muted:#6b7280;

      --border:#e5e7eb;

      --dark:#111827;

      --dark2:#374151;

      --danger:#b91c1c;

      --danger-bg:#fee2e2;

      --ok:#15803d;

      --blue:#2563eb;

    }

    * {

      box-sizing:border-box;

    }

    html {

      -webkit-text-size-adjust:100%;

      height:100%;

    }

    body {

      margin:0;

      min-height:100%;

      font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        Roboto,

        Helvetica,

        Arial,

        sans-serif;

      background:var(--bg);

      color:var(--text);

      font-size:16px;

    }

    body.modal-open {

      overflow:hidden;

    }

    button,

    input,

    textarea,

    select {

      font:inherit;

    }

    button {

      cursor:pointer;

      -webkit-tap-highlight-color:transparent;

    }

    body.font-small {

      font-size:14px;

    }

    body.font-normal {

      font-size:16px;

    }

    body.font-large {

      font-size:19px;

    }

    body.font-xlarge {

      font-size:22px;

    }

    /* =====================================================

       HEADER

    ===================================================== */

    header {

      position:sticky;

      top:0;

      z-index:30;

      background:var(--dark);

      color:white;

      padding:

        calc(14px + env(safe-area-inset-top))

        18px

        14px;

      box-shadow:0 2px 12px rgba(0,0,0,0.14);

    }

    .header-inner {

      width:100%;

      max-width:1200px;

      margin:auto;

      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:14px;

    }

    .title-area {

      display:flex;

      align-items:center;

      gap:12px;

      min-width:0;

    }

    .app-icon {

      width:54px;

      height:54px;

      flex-shrink:0;

      border-radius:14px;

      object-fit:cover;

      background:white;

    }

    .title-text {

      min-width:0;

    }

    header h1 {

      margin:0;

      font-size:1.35em;

      line-height:1.15;

      white-space:nowrap;

    }

    header p {

      margin:4px 0 0;

      color:#d1d5db;

      font-size:0.9em;

    }

    .header-actions {

      display:flex;

      align-items:center;

      justify-content:flex-end;

      gap:8px;

    }

    .font-controls {

      display:flex;

      gap:6px;

    }

    .header-btn {

      min-height:46px;

      border:none;

      border-radius:12px;

      padding:10px 14px;

      font-weight:800;

      white-space:nowrap;

    }

    .font-btn {

      min-width:48px;

      background:var(--dark2);

      color:white;

    }

    .category-btn {

      background:var(--dark2);

      color:white;

    }

    .add-btn {

      background:white;

      color:var(--dark);

    }

    /* =====================================================

       CONTENU

    ===================================================== */

    main {

      width:100%;

      max-width:1200px;

      margin:auto;

      padding:

        20px

        20px

        calc(35px + env(safe-area-inset-bottom));

    }

    .search-card {

      padding:15px;

      margin-bottom:20px;

      background:white;

      border-radius:18px;

      box-shadow:0 3px 15px rgba(0,0,0,0.05);

    }

    input,

    textarea,

    select {

      width:100%;

      border:1px solid var(--border);

      border-radius:12px;

      padding:13px;

      background:white;

      color:var(--text);

      outline:none;

    }

    input:focus,

    textarea:focus,

    select:focus {

      border-color:#9ca3af;

      box-shadow:0 0 0 3px rgba(17,24,39,0.06);

    }

    textarea {

      min-height:120px;

      resize:vertical;

    }

    /* =====================================================

       GRILLE

    ===================================================== */

    .cocktail-grid {

      display:grid;

      grid-template-columns:

        repeat(auto-fill,minmax(250px,1fr));

      gap:18px;

    }

    .cocktail-card {

      overflow:hidden;

      background:white;

      border-radius:18px;

      box-shadow:0 4px 18px rgba(0,0,0,0.06);

    }

    .cocktail-image-wrap {

      width:100%;

      height:220px;

      display:flex;

      align-items:center;

      justify-content:center;

      overflow:hidden;

      background:

        linear-gradient(

          135deg,

          #e5e7eb,

          #f9fafb

        );

      cursor:pointer;

      position:relative;

    }

    .cocktail-number {

      position:absolute;

      top:10px;

      left:10px;

      min-width:38px;

      height:38px;

      padding:0 10px;

      display:flex;

      align-items:center;

      justify-content:center;

      border-radius:999px;

      background:rgba(17,24,39,0.92);

      color:white;

      font-weight:900;

      box-shadow:0 3px 10px rgba(0,0,0,0.25);

      z-index:2;

    }

    .cocktail-image {

      width:100%;

      height:100%;

      object-fit:cover;

    }

    .no-image {

      font-size:54px;

    }

    .card-content {

      padding:16px;

    }

    .cocktail-name {

      margin:0 0 5px;

      font-size:1.2em;

      font-weight:800;

    }

    .cocktail-category {

      margin-bottom:12px;

      color:var(--muted);

      font-size:0.86em;

    }

    .card-actions {

      display:flex;

      gap:8px;

      margin-top:14px;

    }

    .btn {

      min-height:44px;

      border:none;

      border-radius:11px;

      padding:11px 14px;

      font-weight:750;

    }

    .btn-dark {

      background:var(--dark);

      color:white;

    }

    .btn-light {

      background:#f3f4f6;

      color:var(--dark);

    }

    .btn-danger {

      background:var(--danger-bg);

      color:var(--danger);

    }

    .btn-blue {

      background:var(--blue);

      color:white;

    }

    .btn-green {

      background:var(--ok);

      color:white;

    }

    .grow {

      flex:1;

    }

    .empty {

      grid-column:1 / -1;

      min-height:280px;

      padding:45px 20px;

      display:flex;

      flex-direction:column;

      align-items:center;

      justify-content:center;

      text-align:center;

      color:var(--muted);

      background:white;

      border-radius:18px;

      line-height:1.55;

    }

    /* =====================================================

       MODALES

    ===================================================== */

    .modal-overlay {

      display:none;

      position:fixed;

      top:0;

      right:0;

      bottom:0;

      left:0;

      z-index:9999;

      background:rgba(0,0,0,0.60);

      padding:

        calc(16px + env(safe-area-inset-top))

        16px

        calc(16px + env(safe-area-inset-bottom));

      overflow:hidden;

      align-items:center;

      justify-content:center;

    }

    .modal-overlay.open {

      display:flex;

    }

    .modal {

      width:100%;

      max-width:780px;

      max-height:calc(100vh - 32px);

      display:flex;

      flex-direction:column;

      overflow:hidden;

      margin:auto;

      background:white;

      border-radius:22px;

      box-shadow:

        0 20px 60px rgba(0,0,0,0.30);

    }

    .modal-header {

      flex:0 0 auto;

      padding:18px 20px;

      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:12px;

      background:var(--dark);

      color:white;

    }

    .modal-header h2 {

      margin:0;

      font-size:1.25em;

    }

    .close-button {

      border:none;

      padding:2px 8px;

      background:transparent;

      color:white;

      font-size:34px;

      line-height:1;

    }

    .modal-body {

      flex:1 1 auto;

      min-height:0;

      overflow-y:auto;

      overflow-x:hidden;

      padding:20px;

      -webkit-overflow-scrolling:touch;

    }

    .field {

      margin-bottom:18px;

    }

    .field label {

      display:block;

      margin-bottom:8px;

      font-weight:800;

    }

    .help {

      margin-top:7px;

      color:var(--muted);

      font-size:0.8em;

      line-height:1.4;

    }

    .modal-actions {

      display:flex;

      gap:10px;

      position:sticky;

      bottom:-20px;

      z-index:5;

      margin:

        24px

        -20px

        -20px;

      padding:

        14px

        20px

        calc(14px + env(safe-area-inset-bottom));

      border-top:1px solid var(--border);

      background:rgba(255,255,255,0.98);

    }

    /* =====================================================

       PHOTO

    ===================================================== */

    .photo-preview {

      display:none;

      width:100%;

      max-height:400px;

      margin-top:12px;

      border-radius:15px;

      object-fit:contain;

      background:#f3f4f6;

    }

    .photo-buttons {

      display:flex;

      gap:10px;

      margin-top:10px;

      flex-wrap:wrap;

    }

    /* =====================================================

       DÉTAIL

    ===================================================== */

    .detail-photo {

      width:100%;

      max-height:440px;

      margin-bottom:18px;

      object-fit:cover;

      border-radius:16px;

    }

    .detail-no-photo {

      height:230px;

      margin-bottom:18px;

      display:flex;

      align-items:center;

      justify-content:center;

      border-radius:16px;

      background:#f3f4f6;

      font-size:60px;

    }

    .detail-section {

      margin-top:21px;

    }

    .detail-section h3 {

      margin:0 0 8px;

      font-size:1em;

    }

    .detail-text {

      white-space:pre-wrap;

      line-height:1.6;

    }

    .badge {

      display:inline-block;

      margin-right:7px;

      margin-bottom:7px;

      padding:7px 12px;

      border-radius:999px;

      background:#f3f4f6;

      font-size:0.85em;

      font-weight:700;

    }

    .number-badge {

      background:var(--dark);

      color:white;

    }

    /* =====================================================

       CATÉGORIES

    ===================================================== */

    .category-create {

      display:flex;

      gap:9px;

      margin-bottom:22px;

    }

    .category-create input {

      flex:1;

    }

    .category-list {

      display:flex;

      flex-direction:column;

      gap:9px;

    }

    .category-row {

      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:12px;

      padding:13px;

      border:1px solid var(--border);

      border-radius:13px;

      background:#f9fafb;

    }

    .category-name {

      min-width:0;

      font-weight:700;

      overflow-wrap:anywhere;

    }

    .category-actions {

      display:flex;

      gap:7px;

      flex-shrink:0;

    }

    .category-actions .btn {

      min-height:40px;

      padding:8px 11px;

    }

    .category-empty {

      padding:30px 10px;

      text-align:center;

      color:var(--muted);

    }

    /* =====================================================

       TABLETTE / IPAD

    ===================================================== */

    @media (min-width:700px) and (max-width:1100px) {

      main {

        max-width:1000px;

        padding-left:24px;

        padding-right:24px;

      }

      .cocktail-grid {

        grid-template-columns:

          repeat(3,minmax(0,1fr));

      }

      .cocktail-image-wrap {

        height:190px;

      }

      .modal-overlay {

        padding:

          calc(24px + env(safe-area-inset-top))

          28px

          calc(24px + env(safe-area-inset-bottom));

      }

      .modal {

        max-width:820px;

        max-height:calc(100vh - 48px);

      }

      .modal-header {

        padding:20px 24px;

      }

      .modal-body {

        padding:24px;

      }

      .modal-actions {

        bottom:-24px;

        margin:

          26px

          -24px

          -24px;

        padding:

          16px

          24px

          calc(16px + env(safe-area-inset-bottom));

      }

    }

    /* =====================================================

       TÉLÉPHONE

    ===================================================== */

    @media (max-width:699px) {

      header {

        padding-left:14px;

        padding-right:14px;

      }

      .header-inner {

        display:block;

      }

      .title-area {

        margin-bottom:13px;

      }

      .app-icon {

        width:48px;

        height:48px;

      }

      header h1 {

        font-size:1.2em;

      }

      .header-actions {

        width:100%;

        display:grid;

        grid-template-columns:

          auto

          1fr

          1fr;

        gap:7px;

      }

      .font-controls {

        display:flex;

      }

      .font-btn {

        min-width:43px;

      }

      .category-btn,

      .add-btn {

        width:100%;

      }

      .header-btn {

        padding:10px 8px;

      }

      main {

        padding-left:12px;

        padding-right:12px;

      }

      .cocktail-grid {

        grid-template-columns:

          repeat(2,minmax(0,1fr));

        gap:10px;

      }

      .cocktail-image-wrap {

        height:150px;

      }

      .card-content {

        padding:12px;

      }

      .card-actions {

        flex-direction:column;

      }

      .modal-overlay {

        padding:

          calc(8px + env(safe-area-inset-top))

          8px

          calc(8px + env(safe-area-inset-bottom));

      }

      .modal {

        max-width:none;

        max-height:calc(100vh - 16px);

        border-radius:18px;

      }

      .modal-header {

        padding:16px;

      }

      .modal-body {

        padding:16px;

      }

      .modal-actions {

        bottom:-16px;

        margin:

          22px

          -16px

          -16px;

        padding:

          13px

          16px

          calc(13px + env(safe-area-inset-bottom));

      }

      .category-create {

        flex-direction:column;

      }

      .category-row {

        align-items:flex-start;

        flex-direction:column;

      }

      .category-actions {

        width:100%;

      }

      .category-actions .btn {

        flex:1;

      }

    }

    /* =====================================================

       PETITS TÉLÉPHONES

    ===================================================== */

    @media (max-width:390px) {

      .header-actions {

        grid-template-columns:1fr 1fr;

      }

      .font-controls {

        grid-column:1 / -1;

        width:100%;

      }

      .font-btn {

        flex:1;

      }

      .cocktail-grid {

        grid-template-columns:1fr;

      }

      .cocktail-image-wrap {

        height:215px;

      }

      .modal-actions {

        flex-direction:column;

      }

    }

    /* =====================================================

       GRAND ÉCRAN

    ===================================================== */

    @media (min-width:1101px) {

      .modal {

        max-width:850px;

      }

      .cocktail-grid {

        grid-template-columns:

          repeat(auto-fill,minmax(270px,1fr));

      }

    }

  </style>

</head>

<body>

<header>

  <div class="header-inner">

    <div class="title-area">

      <img

        src="./icon.PNG"

        alt="Cocktails"

        class="app-icon"

      >

      <div class="title-text">

        <h1>Recettes Cocktails</h1>

        <p>Mamy Mouss</p>

      </div>

    </div>

    <div class="header-actions">

      <div class="font-controls">

        <button

          class="header-btn font-btn"

          onclick="decreaseFont()"

        >

          A−

        </button>

        <button

          class="header-btn font-btn"

          onclick="increaseFont()"

        >

          A+

        </button>

      </div>

      <button

        class="header-btn category-btn"

        onclick="openCategoryModal()"

      >

        🗂 Catégories

      </button>

      <button

        class="header-btn add-btn"

        onclick="openCocktailForm()"

      >

        ＋ Cocktail

      </button>

    </div>

  </div>

</header>

<main>

  <div class="search-card">

    <input

      id="search"

      type="search"

      placeholder="🔎 Rechercher un cocktail..."

      oninput="renderCocktails()"

    >

  </div>

  <div

    id="cocktailList"

    class="cocktail-grid"

  ></div>

</main>

<!-- =====================================================

     MODALE COCKTAIL

===================================================== -->

<div

  id="cocktailModal"

  class="modal-overlay"

>

  <div class="modal">

    <div class="modal-header">

      <h2 id="formTitle">

        Nouveau cocktail

      </h2>

      <button

        class="close-button"

        onclick="closeCocktailForm()"

      >

        ×

      </button>

    </div>

    <div class="modal-body">

      <input

        type="hidden"

        id="cocktailId"

      >

      <!-- NUMÉRO -->

      <div class="field">

        <label>

          🔢 Numéro / ordre

        </label>

        <input

          id="cocktailNumber"

          type="number"

          inputmode="numeric"

          min="1"

          step="1"

          placeholder="Exemple : 1"

        >

        <div class="help">

          Ce numéro détermine l'ordre d'affichage des cocktails.

        </div>

      </div>

      <div class="field">

        <label>

          Nom du cocktail *

        </label>

        <input

          id="cocktailName"

          type="text"

          placeholder="Nom du cocktail"

        >

      </div>

      <div class="field">

        <label>

          Catégorie

        </label>

        <select

          id="cocktailCategory"

        ></select>

        <div class="help">

          Les catégories peuvent être créées avec le bouton « Catégories ».

        </div>

      </div>

      <div class="field">

        <label>

          📸 Photo du cocktail

        </label>

        <input

          id="cocktailPhoto"

          type="file"

          accept="image/*"

          onchange="handlePhoto(event)"

        >

        <div class="help">

          Choisis une photo présente sur l'appareil.

        </div>

        <img

          id="photoPreview"

          class="photo-preview"

          alt="Aperçu de la photo"

        >

        <div class="photo-buttons">

          <button

            type="button"

            class="btn btn-danger"

            onclick="removePhoto()"

          >

            🗑 Supprimer la photo

          </button>

        </div>

      </div>

      <div class="field">

        <label>

          Ingrédients

        </label>

        <textarea

          id="cocktailIngredients"

          placeholder="Liste des ingrédients..."

        ></textarea>

      </div>

      <div class="field">

        <label>

          Préparation

        </label>

        <textarea

          id="cocktailPreparation"

          placeholder="Informations de préparation..."

        ></textarea>

      </div>

      <div class="field">

        <label>

          Verrerie

        </label>

        <input

          id="cocktailGlass"

          type="text"

          placeholder="Type de verre"

        >

      </div>

      <div class="field">

        <label>

          Garniture / décoration

        </label>

        <input

          id="cocktailGarnish"

          type="text"

          placeholder="Décoration"

        >

      </div>

      <div class="field">

        <label>

          Notes

        </label>

        <textarea

          id="cocktailNotes"

          placeholder="Informations supplémentaires..."

        ></textarea>

      </div>

      <div class="modal-actions">

        <button

          class="btn btn-light grow"

          onclick="closeCocktailForm()"

        >

          Annuler

        </button>

        <button

          class="btn btn-green grow"

          onclick="saveCocktail()"

        >

          💾 Enregistrer

        </button>

      </div>

    </div>

  </div>

</div>

<!-- =====================================================

     MODALE DÉTAIL

===================================================== -->

<div

  id="detailModal"

  class="modal-overlay"

>

  <div class="modal">

    <div class="modal-header">

      <h2 id="detailTitle">

        Cocktail

      </h2>

      <button

        class="close-button"

        onclick="closeDetail()"

      >

        ×

      </button>

    </div>

    <div

      id="detailBody"

      class="modal-body"

    ></div>

  </div>

</div>

<!-- =====================================================

     MODALE CATÉGORIES

===================================================== -->

<div

  id="categoryModal"

  class="modal-overlay"

>

  <div class="modal">

    <div class="modal-header">

      <h2>

        🗂 Catégories

      </h2>

      <button

        class="close-button"

        onclick="closeCategoryModal()"

      >

        ×

      </button>

    </div>

    <div class="modal-body">

      <div class="category-create">

        <input

          id="newCategoryName"

          type="text"

          placeholder="Nouvelle catégorie..."

        >

        <button

          class="btn btn-green"

          onclick="addCategory()"

        >

          ＋ Ajouter

        </button>

      </div>

      <div

        id="categoryList"

        class="category-list"

      ></div>

    </div>

  </div>

</div>

<script>

/* =========================================================

   STOCKAGE

========================================================= */

var STORAGE_KEY =

  "mamy_mouss_cocktails_v3";

var CATEGORY_KEY =

  "mamy_mouss_categories_v1";

var FONT_KEY =

  "mamy_mouss_font_size";

var cocktails = [];

var categories = [];

var currentPhoto = "";

/* =========================================================

   POLICE

========================================================= */

var FONT_SIZES = [

  "font-small",

  "font-normal",

  "font-large",

  "font-xlarge"

];

var currentFontIndex = 1;

function loadFontSize() {

  var saved =

    localStorage.getItem(FONT_KEY);

  if (saved !== null) {

    var index =

      Number(saved);

    if (

      !isNaN(index) &&

      index >= 0 &&

      index < FONT_SIZES.length

    ) {

      currentFontIndex = index;

    }

  }

  applyFontSize();

}

function applyFontSize() {

  for (

    var i = 0;

    i < FONT_SIZES.length;

    i++

  ) {

    document.body.classList.remove(

      FONT_SIZES[i]

    );

  }

  document.body.classList.add(

    FONT_SIZES[currentFontIndex]

  );

  localStorage.setItem(

function renderCocktails() {

  var container =

    document.getElementById(

      "cocktailList"

    );

  var search =

    document

      .getElementById(

        "search"

      )

      .value

      .trim()

      .toLowerCase();

  var filtered = [];

  for (

    var i = 0;

    i < cocktails.length;

    i++

  ) {

    var cocktail =

      cocktails[i];

    var text = [

      cocktail.number,

      cocktail.name,

      cocktail.category,

      cocktail.ingredients,

      cocktail.preparation,

      cocktail.glass,

      cocktail.garnish,

      cocktail.notes

    ]

    .join(" ")

    .toLowerCase();

    if (

      text.indexOf(search) !== -1

    ) {

      filtered.push(

        cocktail

      );

    }

  }

  /*

    TRI :

    1

    2

    3

    4

    etc.

    Les cocktails sans numéro

    passent après.

  */

  filtered.sort(

    function(a,b) {

      var numberA =

        Number(a.number);

      var numberB =

        Number(b.number);

      var hasA =

        a.number !== "" &&

        a.number !== null &&

        a.number !== undefined &&

        !isNaN(numberA);

      var hasB =

        b.number !== "" &&

        b.number !== null &&

        b.number !== undefined &&

        !isNaN(numberB);

      if (

        hasA &&

        hasB &&

        numberA !== numberB

      ) {

        return numberA - numberB;

      }

      if (

        hasA &&

        !hasB

      ) {

        return -1;

      }

      if (

        !hasA &&

        hasB

      ) {

        return 1;

      }

      return String(

        a.name || ""

      )

      .localeCompare(

        String(

          b.name || ""

        ),

        "fr",

        {

          sensitivity:"base"

        }

      );

    }

  );

  if (

    !filtered.length

  ) {

    container.innerHTML =

      '<div class="empty">' +

        '<div style="font-size:42px">' +

          "🍹" +

        "</div>" +

        "<br>" +

        (

          cocktails.length

            ? "Aucune fiche trouvée."

            : 'Aucune recette pour le moment.<br><br>Appuie sur <strong>＋ Cocktail</strong> pour commencer.'

        ) +

      "</div>";

    return;

  }

  var html = "";

  for (

    var j = 0;

    j < filtered.length;

    j++

  ) {

    var item =

      filtered[j];

    var safeId =

      escapeJsString(

        item.id

      );

    var imageHtml = "";

    if (

      item.photo

    ) {

      imageHtml =

        '<img class="cocktail-image" src="' +

        item.photo +

        '" alt="">';

    } else {

      imageHtml =

        '<div class="no-image">🍹</div>';

    }

    var numberHtml = "";

    if (

      item.number !== "" &&

      item.number !== undefined &&

      item.number !== null

    ) {

      numberHtml =

        '<div class="cocktail-number">' +

          escapeHtml(

            item.number

          ) +

        "</div>";

    }

    html +=

      '<div class="cocktail-card">' +

        '<div class="cocktail-image-wrap" onclick="showDetail(\'' +

          safeId +

        '\')">' +

          numberHtml +

          imageHtml +

        "</div>" +

        '<div class="card-content">' +

          '<h2 class="cocktail-name">' +

            escapeHtml(

              item.name

            ) +

          "</h2>" +

          '<div class="cocktail-category">' +

            (

              item.category

                ? escapeHtml(

                    item.category

                  )

                : "Sans catégorie"

            ) +

          "</div>" +

          '<div class="card-actions">' +

            '<button class="btn btn-dark grow" onclick="showDetail(\'' +

              safeId +

            '\')">' +

              "Voir" +

            "</button>" +

            '<button class="btn btn-light" onclick="editCocktail(\'' +

              safeId +

            '\')">' +

function handlePhoto(event) {

  var file =

    event.target.files[0];

  if (!file) {

    return;

  }

  if (

    file.type.indexOf(

      "image/"

    ) !== 0

  ) {

    alert(

      "Le fichier choisi n'est pas une image."

    );

    return;

  }

  compressImage(

    file,

    1100,

    0.78,

    function(dataUrl) {

      currentPhoto =

        dataUrl;

      updatePhotoPreview();

    }

  );

}

function compressImage(

  file,

  maxSize,

  quality,

  callback

) {

  var reader =

    new FileReader();

  reader.onload =

    function(event) {

      var img =

        new Image();

      img.onload =

        function() {

          var width =

            img.width;

          var height =

            img.height;

          if (

            width > maxSize ||

            height > maxSize

          ) {

            var ratio =

              Math.min(

                maxSize / width,

                maxSize / height

              );

            width =

              Math.round(

                width * ratio

              );

            height =

              Math.round(

                height * ratio

              );

          }

          var canvas =

            document.createElement(

              "canvas"

            );

          canvas.width =

            width;

          canvas.height =

            height;

          var context =

            canvas.getContext(

              "2d"

            );

          context.drawImage(

            img,

            0,

            0,

            width,

            height

          );

          callback(

            canvas.toDataURL(

              "image/jpeg",

              quality

            )

          );

        };

      img.src =

        event.target.result;

    };

  reader.readAsDataURL(

    file

  );

}

function saveCocktail() {

  var id =

    document

      .getElementById(

        "cocktailId"

      )

      .value;

  var numberValue =

    document

      .getElementById(

        "cocktailNumber"

      )

      .value

      .trim();

  if (

    numberValue !== ""

  ) {

    var numericNumber =

      Number(numberValue);

    if (

      isNaN(numericNumber) ||

      numericNumber < 1 ||

      Math.floor(numericNumber) !== numericNumber

    ) {

      alert(

        "Le numéro doit être un nombre entier supérieur à 0."

      );

      return;

    }

    numberValue =

      String(numericNumber);

  }

  var name =

    document

      .getElementById(

        "cocktailName"

      )

      .value

      .trim();

  if (!name) {

    alert(

      "Indique le nom du cocktail."

    );

    return;

  }

  var oldCocktail =

    null;

  for (

    var i = 0;

    i < cocktails.length;

    i++

  ) {

    if (

      cocktails[i].id === id

    ) {

      oldCocktail =

        cocktails[i];

      break;

    }

  }

  var cocktail = {

    id:

      id ||

      (

        Date.now()

          .toString(36) +

        Math.random()

          .toString(36)

          .slice(2)

      ),

    number:

      numberValue,

    name:

      name,

    category:

      document

        .getElementById(

          "cocktailCategory"

        )

        .value,

    ingredients:

      document

        .getElementById(

          "cocktailIngredients"

        )

        .value

        .trim(),

    preparation:

      document

        .getElementById(

          "cocktailPreparation"

        )

        .value

        .trim(),

    glass:

      document

        .getElementById(

          "cocktailGlass"

        )

        .value

        .trim(),

    garnish:

      document

        .getElementById(

          "cocktailGarnish"

        )

        .value

        .trim(),

    notes:

      document

        .getElementById(

          "cocktailNotes"

        )

        .value

        .trim(),

    photo:

      currentPhoto,

    createdAt:

      oldCocktail

        ? oldCocktail.createdAt

        : new Date()

            .toISOString(),

    updatedAt:

      new Date()

        .toISOString()

  };

  var foundIndex =

    -1;

  for (

    var j = 0;

    j < cocktails.length;

    j++

  ) {

    if (

      cocktails[j].id === id

    ) {

      foundIndex =

        j;

      break;

    }

  }

  if (

    foundIndex >= 0

  ) {

    cocktails[

      foundIndex

    ] = cocktail;

  } else {

    cocktails.push(

      cocktail

    );

  }

  if (

    !saveCocktailsToStorage()

  ) {

    return;

  }

  closeCocktailForm();

  renderCocktails();

}

        cocktail.preparation

      ) +

      "</div>" +

      "</div>";

  }

  if (

    cocktail.glass

  ) {

    html +=

      '<div class="detail-section">' +

      "<h3>🥃 Verrerie</h3>" +

      '<div class="detail-text">' +

      escapeHtml(

        cocktail.glass

      ) +

      "</div>" +

      "</div>";

  }

  if (

    cocktail.garnish

  ) {

    html +=

      '<div class="detail-section">' +

      "<h3>🍋 Garniture</h3>" +

      '<div class="detail-text">' +

      escapeHtml(

        cocktail.garnish

      ) +

      "</div>" +

      "</div>";

  }

  if (

    cocktail.notes

  ) {

    html +=

      '<div class="detail-section">' +

      "<h3>📝 Notes</h3>" +

      '<div class="detail-text">' +

      escapeHtml(

        cocktail.notes

      ) +

      "</div>" +

      "</div>";

  }

  html +=

    '<div class="modal-actions">' +

      '<button class="btn btn-blue grow" onclick="closeDetail();editCocktail(\'' +

      safeId +

      '\')">' +

        "✏️ Modifier" +

      "</button>" +

      '<button class="btn btn-danger" onclick="deleteCocktail(\'' +

      safeId +

      '\')">' +

        "🗑 Supprimer" +

      "</button>" +

    "</div>";

  document

    .getElementById(

      "detailBody"

    )

    .innerHTML =

      html;

  var modal =

    document.getElementById(

      "detailModal"

    );

  modal.classList.add(

    "open"

  );

  modal

    .querySelector(

      ".modal-body"

    )

    .scrollTop = 0;

  lockBody();

}

function closeDetail() {

  document

    .getElementById(

      "detailModal"

    )

    .classList.remove(

      "open"

    );

  unlockBodyIfNeeded();

}

/* =========================================================

   PROTECTION

========================================================= */

function escapeHtml(value) {

  return String(

    value || ""

  )

  .replace(/&/g,"&amp;")

  .replace(/</g,"&lt;")

  .replace(/>/g,"&gt;")

  .replace(/"/g,"&quot;")

  .replace(/'/g,"&#039;");

}

function escapeJsString(value) {

  return String(

    value || ""

  )

  .replace(/\\/g,"\\\\")

  .replace(/'/g,"\\'")

  .replace(/\n/g,"\\n")

  .replace(/\r/g,"\\r");

}

/* =========================================================

   ÉVÉNEMENTS

========================================================= */

document

  .getElementById(

    "newCategoryName"

  )

  .addEventListener(

    "keydown",

    function(event) {

      if (

        event.key === "Enter"

      ) {

        event.preventDefault();

        addCategory();

      }

    }

  );

document

  .getElementById(

    "cocktailModal"

  )

  .addEventListener(

    "click",

    function(event) {

      if (

        event.target ===

        this

      ) {

        closeCocktailForm();

      }

    }

  );

document

  .getElementById(

    "detailModal"

  )

  .addEventListener(

    "click",

    function(event) {

      if (

        event.target ===

        this

      ) {

        closeDetail();

      }

    }

  );

document

  .getElementById(

    "categoryModal"

  )

  .addEventListener(

    "click",

    function(event) {

      if (

        event.target ===

        this

      ) {

        closeCategoryModal();

      }

    }

  );

document.addEventListener(

  "keydown",

  function(event) {

    if (

      event.key !==

      "Escape"

    ) {

      return;

    }

    if (

      document

        .getElementById(

          "cocktailModal"

        )

        .classList

        .contains(

          "open"

        )

    ) {

      closeCocktailForm();

      return;

    }

    if (

      document

        .getElementById(

          "detailModal"

        )

        .classList

        .contains(

          "open"

        )

    ) {

      closeDetail();

      return;

    }

    if (

      document

        .getElementById(

          "categoryModal"

        )

        .classList

        .contains(

          "open"

        )

    ) {

      closeCategoryModal();

    }

  }

);

/* =========================================================

   DÉMARRAGE

========================================================= */

loadFontSize();

loadCocktails();

loadCategories();

populateCategorySelect();

renderCocktails();

</script>
